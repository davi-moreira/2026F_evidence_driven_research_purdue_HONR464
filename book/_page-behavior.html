<span id="edrai-new-tab-note" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">opens in a new tab</span>
<style>.edrai-newtab-mark{font-size:.7em;vertical-align:super;opacity:.55;margin-left:.12em;text-decoration:none}</style>
<script>
// Two page behaviors for every book page:
//
// 1. Every hyperlink in the page body opens in a new tab, so the book never
//    navigates away from the reader's place. Navigation chrome (sidebar,
//    TOC, breadcrumbs, next/previous) and same-page anchors keep native
//    behavior. Treated links carry an assistive-technology note (W3C G201);
//    Quarto's link-external-icon marks truly external links visibly.
// 2. The citeproc-generated "Bibliography" section arrives as a second <h1>;
//    demote it to <h2> so the chapter title stays the page's only h1.
(function () {
  var main = document.getElementById("quarto-document-content");
  if (!main) return;
  var links = main.querySelectorAll("a[href]");
  for (var i = 0; i < links.length; i++) {
    var a = links[i];
    var href = a.getAttribute("href");
    if (!href || href.charAt(0) === "#") continue;
    if (/^(mailto:|tel:|javascript:)/i.test(href)) continue;
    if (a.hasAttribute("download")) continue;
    if (a.closest("nav")) continue;
    try {
      var u = new URL(href, window.location.href);
      if (u.origin === location.origin && u.pathname === location.pathname &&
          u.search === location.search) continue;   // same-document link
    } catch (e) { /* unparseable href: treat as cross-document */ }
    a.setAttribute("target", "_blank");
    var rel = (a.getAttribute("rel") || "").split(/\s+/).filter(Boolean);
    if (rel.indexOf("noopener") === -1) rel.push("noopener");
    a.setAttribute("rel", rel.join(" "));
    var desc = (a.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean);
    if (desc.indexOf("edrai-new-tab-note") === -1) desc.push("edrai-new-tab-note");
    a.setAttribute("aria-describedby", desc.join(" "));
    // Visible new-context cue (W3C G201) for links Quarto's external icon
    // does not already mark; the hidden note above covers assistive tech.
    if (!a.querySelector("i.bi") && !a.querySelector(".edrai-newtab-mark") &&
        !a.querySelector("img")) {
      var mark = document.createElement("span");
      mark.className = "edrai-newtab-mark";
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = "↗︎";
      a.appendChild(mark);
    }
  }
  var bibSection = main.querySelector("section#bibliography");
  if (bibSection) {
    bibSection.classList.remove("level1");
    bibSection.classList.add("level2");
    var h1 = bibSection.querySelector("h1");
    if (h1) {
      var h2 = document.createElement("h2");
      h2.className = h1.className;
      if (h1.id) h2.id = h1.id;
      while (h1.firstChild) h2.appendChild(h1.firstChild);
      h1.parentNode.replaceChild(h2, h1);
    }
  }
})();
</script>
