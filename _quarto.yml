# IMPORTANT REFERENCE: https://www.youtube.com/watch?v=uimdXPZc40I&list=PLkrJrLs7xfbXcEKhTCKRSr2VXH4yiBeXo&index=4
project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    # The course book and its translations are their OWN Quarto projects
    # (book/ → docs/book, book-pt/ → docs/book-pt, book-es/ → docs/book-es).
    # Excluding them here keeps the site render from clobbering the book output
    # with website-styled pages; render them with `quarto render book/` etc.
    - "!book/"
    - "!book-pt/"
    - "!book-es/"
  resources:
    - "notebooks/data/data.zip"
  # No page encryption (D35): instructor-facing pages ship openly; the private
  # instructor repo + GitHub auth is the real protection.


website:
  title: "HONR 46400: Evidence-Driven Research (Fall 2026)"
  sidebar:
    background: light
    logo: "images/edrai_logo.png"
    pinned: true
    align: center
    tools:
      - icon: github
        href: https://github.com/davi-moreira/2026F_evidence_driven_research_purdue_HONR464
        text: GitHub
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: material.qmd
        text: Material
      - href: book/index.html
        text: "Book: EDR|AI"
        target: _blank
      - href: schedule.qmd
        text: Schedule
      - href: instructor.qmd
        text: Instructor

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    # No page on this site carries a code block. Leaving code-copy on emits the
    # copy-button CSS into the theme bundle, and turning it off per-page forks a
    # second 498 KB bootstrap bundle for that one page.
    code-copy: false
    code-annotations: false

editor: visual
