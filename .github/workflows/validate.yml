name: validate

# Static QA battery for HONR 46400. These gates read the committed files (no
# notebook execution, no Quarto render) so they run fast and need no kernel.
# They mirror the local hooks so a contributor WITHOUT the hooks still cannot
# merge a schedule/milestone/voice/citation regression. Notebook execution and
# the Quarto render remain local (see CLAUDE.md "Commit AND Render").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static-check dependencies
        # numpy/matplotlib are pinned because the misconception gate's numbers
        # evaluator EXECUTES the seeded simulations (round-4 G4: an undeclared
        # dependency passes only while the runner image happens to supply it).
        run: pip install nbformat pyyaml "numpy==1.26.4" "matplotlib==3.8.4"

      - name: Calendar backbone (43 = 41 in-person + 2 async)
        run: python3 scripts/validate_calendar.py --emit-csv

      - name: Meeting schedule builds against the backbone (43 x 34)
        run: python3 scripts/build_meeting_schedule.py

      - name: Milestone system consistent (M0-M15 anchors)
        run: python3 scripts/validate_milestones.py

      - name: Coverage mapping (meetings <-> notebooks <-> readings <-> datasets)
        run: python3 scripts/validate_coverage.py --plan

      - name: Notebook template conformance (registered v2 notebooks)
        run: python3 scripts/validate_notebooks.py

      - name: Undergraduate-voice lint (student notebooks)
        run: python3 scripts/voice_lint_notebooks.py

      - name: Citation-integrity audit
        run: python3 scripts/audit_sources.py

      # A5 (D35): corrected methods misconceptions must not reappear.
      # HONESTY (round-4 G2): this checkout is public, so these two steps
      # certify ONLY tracked public surfaces — chapters, generated notebooks,
      # rubrics, config, translations. The gitignored canonical sources and
      # instructor notebooks are enforced by `--local`, which runs inside
      # scripts/nbbuild.py (every build) and scripts/sync_instructor_repo.sh
      # (every private-repo sync) — the two points where canonical content
      # actually moves. --self-test is the mutation test, run against an
      # isolated snapshot: if reinserting a rejected phrase does not fail the
      # scan, the gate is not a gate.
      - name: Misconception manifest — mutation test (isolated snapshot)
        run: python3 scripts/validate_misconceptions.py --self-test

      - name: Misconception manifest — scan (tracked public surfaces)
        run: python3 scripts/validate_misconceptions.py

      - name: Book manifest + chapter sync (37 chapters ↔ 16 notebooks)
        run: python3 scripts/validate_book_sync.py --strict

      # D35 Phase 2: the identity/crosswalk validator is the arbiter — the
      # manifests, schedule, briefs, and generated BOOK_MAP must agree.
      - name: Book architecture + crosswalk (schema 1.0)
        run: python3 scripts/validate_book_architecture.py
