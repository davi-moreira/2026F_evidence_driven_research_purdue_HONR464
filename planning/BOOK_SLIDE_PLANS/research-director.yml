lesson: research-director
source_sha256: "0bc7a4bbaa42a9693bef84cd54978056ae9ff77408bd089f3e2f0b5dc11e3b53"
sections:
  "Why this decision matters":
    - title: "A lab head briefs a new hire on where the line sits"
      bullets:
        - "A **principal investigator** runs a lab and owns its scientific decisions."
        - "Day one, a new lab member is told where the line sits."
        - "The assistant is faster. The line does not move because of that."
      quote: >
        Here is the deal. A research assistant here can run the assay, plot the
        readings, and format the table, and honestly, they will do it faster
        than I would. What the assistant does not do is choose the question,
        decide what the readings mean, or sign the claim. That part is mine.
        Learn where that line sits, because it does not move just because the
        assistant got faster.
      note: >
        Read the briefing out loud and let it sit for a second. Notice what the
        PI concedes without hesitation: the assistant really is faster at the
        assay, the plot, the table. What the PI keeps is choosing the question,
        deciding what the readings mean, and signing the claim. Ask the room
        which of those three they would find hardest to hold onto when a tool
        offers to do it for them.
    - title: "The risk is drift, not the routine work"
      bullets:
        - "AI is the fastest research assistant you will ever direct."
        - "The risk is not that it does the routine work."
        - "The risk is letting it drift into the calls that make the work yours."
        - "Deciding task by task what you delegate makes you a director, not a passenger."
      note: >
        The chapter is careful here, and the slide keeps that care: nothing is
        wrong with handing out the routine work. What goes wrong is drift, one
        small call at a time, until the judgments that made the project yours
        were made by something that cannot answer for them. The alternative to
        directing is not caution, it is being a passenger. Ask who has already
        let a tool make a call they had not planned to hand over.
  "The concept":
    - title: "A director assigns the work and still answers for it"
      layout: terms
      terms:
        - term: "Research director"
          definition: "the person who assigns each piece of work and stays accountable for the finished result"
        - term: "Delegation triage"
          definition: "sorting each task into one of three buckets before you start"
        - term: "Never-delegate decision"
          definition: "any call that defines the science itself, from the question to the uncertainty you report"
      note: >
        These three words do the work of the whole chapter, so give them a
        moment each. The example the book uses for the first one is exact: you
        may ask a tool to draft your methods paragraph, but you are the one who
        signs it and answers for it. Stress the word "before" in the second
        definition, because a triage done mid-tool is not a triage. The third
        gets its full list on the next slide but one.
    - title: "Two buckets you may hand out, and they are not the same bucket"
      bullets:
        - "**Safe to delegate**: low stakes and easy to check, so a wrong answer costs little."
        - "Example: rewording one survey item three ways."
        - "**Delegate then verify**: fine to hand out, but you must confirm it with a real check."
        - "Example: ask for a lab protocol, then open it and confirm it says what the tool claimed."
      note: >
        The difference between these two is the cost of being wrong, not the
        difficulty of the task. Rewording a survey item three ways is safe
        because one glance catches a bad rewording. Locating a protocol is not
        safe in that sense, because a plausible wrong answer looks exactly like
        a right one until you open the document. Ask the room for one task from
        their own project that sits in each bucket, and make them say why.
    - title: "Never delegate names the science itself"
      bullets:
        - "The question you pursue, and the design and the people or samples it covers."
        - "What your measures mean, and the ethics."
        - "The boundary of your claim, and the uncertainty you report."
        - "Example: deciding whether your evidence actually supports the claim you want to make."
        - "Research-integrity guidance draws this same line [@nasem2017integrity]."
      note: >
        Read the list slowly. The chapter gives it as a single definition, and
        each item names a call that defines the science itself. The bucket is
        defined by a property, not by difficulty: these are the calls that stay yours no matter how
        capable the tool becomes. That is why the chapter's phrasing is "no
        matter how capable", and why a better model next year changes nothing
        about this list.
    - title: "A loop you did not watch is not a loop you verified"
      bullets:
        - "Handing a task to a modern tool rarely means one prompt and one answer."
        - "The tool drafts, runs, reads its own error, rewrites, and runs again."
        - "Increasingly it closes that loop itself and shows you only the tidy result at the end."
        - "Decide right then what you will inspect when the loop stops [@nist2024genai]."
      note: >
        This is what has changed about delegation, and it is why the triage has
        to be written down. When you only see the tidy result at the end, the
        temptation is to judge whether the final answer looks plausible, which
        is not a check. Naming the inspection at the moment you drop a task
        into "delegate then verify" is cheap. Naming it after a confident
        answer arrives is much harder, because you now have a reason to want it
        to be right.
  "A worked example":
    - title: "Does a food preservative slow E. coli growth?"
      bullets:
        - "The question: does sodium benzoate slow growth in a harmless lab strain of *E. coli*?"
        - "**Optical density** is how cloudy a liquid culture gets as cells multiply."
        - "It is read on a plate reader as OD600."
        - "You are the director. The AI is your assistant."
      note: >
        Everything from here is one concrete triage on one concrete question,
        so the buckets stop being abstract. Note that the measure is defined
        before it is used, which is the standard this book holds you to in your
        own writing. Ask the room to hold the question in mind, because the
        never-delegate bucket at the end is entirely about what this particular
        measure licenses you to say.
    - title: "Safe to delegate: one glance catches the mistake"
      bullets:
        - "Reformat three plates of raw OD600 numbers into one tidy table."
        - "Draft a plain-language version of your methods paragraph."
        - "A value in the wrong column is caught at a glance, so the stakes are low."
      note: >
        Both of these are real work and both take time, which is exactly why
        handing them out is worth doing. The test the chapter applies is the
        cost of an undetected error, and here that cost is near zero because
        the error is visible. Push the room a little: apply that same test to
        the plain-language methods draft, and have someone say out loud what an
        undetected error in it would look like.
    - title: "Delegate then verify: name the check before you hand it out"
      bullets:
        - "Locate a standard protocol for reading bacterial growth curves."
        - "Draft the formula for **doubling time**, the hours a population takes to double."
        - "The check: open the actual protocol and read it yourself."
        - "The check: recompute one doubling time by hand from two printed OD values."
      note: >
        Notice that each handed-out task arrives with its check already
        attached, and the checks are specific: this document, this
        recomputation. That specificity is the whole point, because "I will
        sanity-check it" is not a check. Both checks are small, and both would
        catch the failure modes that matter, a protocol that does not exist and
        a formula that does not compute what it claims.
    - title: "No tool decides what \"inhibits\" means here"
      bullets:
        - "Deciding that the concentrations you test are biologically meaningful and safe."
        - "Deciding whether a gap between the treated and untreated curves licenses \"inhibits\"."
        - "Stating how uncertain that conclusion is, given three plates and one strain."
        - "Let a tool make those calls and you become a reader of someone else's guess."
      note: >
        This is the bucket the chapter defends hardest, so slow down. The word
        "licenses" is doing real work: a visible gap between two curves is a
        fact, and calling it inhibition is a claim about biology that the gap
        alone does not establish. The uncertainty line is bounded on purpose,
        three plates and one strain, and that bound is part of the finding
        rather than a disclaimer added afterwards.
    - title: "Run it, change one input, and watch a sentence stop being true"
      bullets:
        - "SEED = 464, so the three plates and the hourly readings repeat exactly."
        - "Watch the control and benzoate OD600 columns pull apart hour by hour."
        - "The last function is the hand check, from two OD values four hours apart."
      code: 0
      note: >
        The block builds this example's data and prints the numbers the section
        quotes, so the triage above is not hypothetical. The doubling-time
        function is the recomputation named in the "delegate then verify"
        bucket, written out. Change one input, the doubling hours or the noise,
        and find which sentence in the section stops being true. That is the
        habit the rest of the book keeps asking for.
