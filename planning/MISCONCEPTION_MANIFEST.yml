# MISCONCEPTION_MANIFEST.yml — the executable half of acceptance test A5 (D35)
#
# Each confirmed methods defect gets ONE row here. `scripts/validate_misconceptions.py`
# reads this file and fails the build when a rejected formulation reappears anywhere
# on the declared surfaces — chapter bodies AND their prompts, canonical notebook
# sources, generated notebooks, rubrics, configuration, and both translations.
#
# Why this exists: the Batch-B/C round passed prose review while the same
# misconceptions survived in nb08, nb10, ch20, ch23, ms09, ms13, nb14 and the
# generated rubrics. Catching the sentence is not catching the misconception.
#
# Contract (verified by `--self-test`, which is the mutation test): reinserting any
# `rejects:` phrase into any declared surface MUST make the validator exit non-zero.
#
# Fields
#   id           stable slug, referenced by BOOK_DESIGN_ACCEPTANCE A5
#   defect       one line: what was being taught wrongly
#   rejects      exact phrases that must NOT appear (case-insensitive substring)
#   reject_patterns
#                regex FAMILIES targeting the claim rather than one wording, so a
#                paraphrase cannot drift through. Each carries `catches:` (drift
#                sentences the pattern must flag) and `permits:` (legitimate
#                phrasings it must NOT flag); --self-test asserts both.
#   allow        exceptions — passages that name a phrase in order to refute it
#   requires     phrases that MUST appear somewhere in `surfaces` (the correction
#                is present, not merely the error absent)
#   numbers      figures whose prose value must match the seeded computation
#   surfaces     glob list; defaults to all book editions + canonical sources

defaults:
  # Every entry is {glob, required}. `required: true` means a glob matching ZERO
  # files FAILS the build: a gate that silently skips a surface class reports
  # "clean" about material it never opened (round-3 finding R3-7).
  #
  # NOTE on canonical sources: `_production_kit/nb_sources/*.py` is GITIGNORED,
  # so it does not exist in a fresh CI checkout. It is scanned when present
  # (required: false) — and the tracked, generated notebooks below carry the
  # same prose, so CI still reads the content even when the sources are absent.
  surfaces:
    - {glob: "book/**/*.qmd", required: true}
    - {glob: "book-pt/**/*.qmd", required: true}
    - {glob: "book-es/**/*.qmd", required: true}
    - {glob: "notebooks/student/*.ipynb", required: true}
    - {glob: "notebooks/book/*.ipynb", required: true}
    - {glob: "notebooks/book/pt/*.ipynb", required: true}
    - {glob: "notebooks/book/es/*.ipynb", required: true}
    - {glob: "book/_iyt-rubrics.qmd", required: true}
    - {glob: "book-pt/_iyt-rubrics.qmd", required: true}
    - {glob: "book-es/_iyt-rubrics.qmd", required: true}
    - {glob: "course_config.yaml", required: true}
    - {glob: "planning/INQUIRY_MAP.md", required: true}
    - {glob: "scripts/build_session_guides.py", required: true}
    - {glob: "_production_kit/nb_sources/*.py", required: false}
  exclude:
    - "**/.quarto/**"

misconceptions:

  - id: compass-relabeling
    defect: >-
      A causal question whose data cannot identify it was relabeled descriptive.
      The kind of a question comes from its words; weak data leave it unanswered.
    rejects:
      - "the honest kind is descriptive"
      - "no intervention means descriptive"
      - "is descriptive, whatever word it carries"
      - "you buy KIND and REACH"
    requires:
      - "currently unidentified"
    allow:
      - "never relabeled descriptive"
      - "never descriptive"

  - id: signed-bias
    defect: >-
      Bias defined as average distance rather than signed mean error.
    rejects:
      - "average distance between your estimate"
    reject_patterns:
      - pattern: "(bias|viés|sesgo)[^.]{0,40}\\b(is|é|es)\\b[^.]{0,30}((average|média|promedio)[^.]{0,15}(distance|distância|distancia)|(distance|distância|distancia)[^.]{0,15}(average|média|promedio))"
        why: "bias defined as average distance (that is mean absolute error, unsigned)"
        catches:
          - "Bias is the average distance between your estimate and the truth."
          - "O viés é a distância média entre a sua estimativa e a verdade."
        permits:
          - "The average distance between campus and the lab is two kilometres."
          - "Bias is the average of your errors across the runs, counting direction."
    requires:
      - "counting direction"

  - id: power-needs-a-rule
    defect: >-
      Power stated with no test, no threshold, and alpha read as the chance the
      finding is false.
    rejects:
      - "5 percent chance of a false alarm"
      - "a 5% chance that this result is false"
    requires:
      - "statistical test"

  - id: attrition-stayers
    defect: >-
      A complete-case contrast under treatment-dependent attrition called "the
      effect among stayers"; unequal retention treated as a diagnosis.
    rejects:
      - "the effect among stayers"
      - "effect among those who stayed"
    reject_patterns:
      - pattern: "(gap|difference|number|estimate|contrast)[^.]{0,40}(describes|is the effect for|gives you)[^.]{0,25}(only )?(the )?(patients|people|units|larvae)[^.]{0,20}(who (remained|stayed)(?! silent)|remaining)"
        why: "hands the number to the units that remained, which no contrast delivers"
        catches:
          - "The gap therefore describes the patients who remained in the study."
          - "That difference is the effect for the people who stayed."
        permits:
          - "Their difference is a complete-case contrast, a comparison of whoever happened to be measured in each arm."
          - "It is also not automatically an effect for any shared group of stayers."
          - "Listen for: evidence that the people who stayed silent resemble the people who answered."
          - "It is tempting to hand the 9-point gap to the patients who stayed. Be careful with that sentence."
      - pattern: "not the effect among stayers[^.]{0,20}(except|unless|but whenever|save when)"
        why: "the correction stated and then immediately taken back"
        catches:
          - "It is not the effect among stayers—except whenever retention differs."
          - "It is not the effect among stayers unless retention is equal."
        permits:
          - "It is not the effect among stayers, because each arm produced its own."
    requires:
      - "complete-case contrast"
    allow:
      - "not the effect among stayers,"
      - "not the effect among stayers either"
      - "not automatically an effect"

  - id: adjustment-set
    defect: >-
      "Adjust for every confounder you can measure" — adjusting for mediators or
      colliders manufactures bias.
    rejects:
      - "every confounder you can measure"
      - "each factor of confusion that you can measure"
    requires:
      - "collider"

  - id: selection-on-holdout
    defect: >-
      Model chosen on the same holdout that reports final performance; the
      winner's crowning score reported as final.
    rejects:
      - "honest best"
      - "the only honest test"
    reject_patterns:
      - pattern: "(pick|choose|choosing|select|selecting|keep)[^.]{0,50}(best|lowest|smallest|winning)[^.]{0,40}(on|from|using)[^.]{0,25}(the )?(test|holdout|held-out|final)"
        why: "choosing a model on the data that reports final performance"
        catches:
          - "Pick whichever model scores best on the test rows."
          - "Choose the degree with the lowest error on the holdout."
        permits:
          - "Fit on training, choose on selection, then score your one choice on the final holdout."
          - "The selection set is separate data you use to choose among candidates."
    requires:
      - "selection set"

  - id: reliability-splits-items
    defect: >-
      "Two halves of one sample" offered as split-half reliability; splitting
      respondents measures sampling variation, not the instrument.
    rejects:
      - "two halves of one sample"
    requires:
      - "split items, never people"

  - id: specification-spread
    defect: >-
      A same-sign specification curve read as robustness; the min-max span
      reported as an uncertainty interval; versions mixing estimands.
    rejects:
      - "its spread is your honest range"
      - "the honest range is"
      - "direction is robust and the range"
    requires:
      - "specification spread"
      - "Shared bias"
    reject_patterns:
      - pattern: "(if|when)[^.]{0,60}(every|all)[^.]{0,40}(specification|version|dot)s?[^.]{0,40}(agree|positive|same sign|one side)[^.]{0,40}(robust|holds|confirmed|solid)"
        why: "same-sign agreement read as robustness; a shared bias tilts them together"
        catches:
          - "If every specification agrees, the finding is robust."
          - "When all versions are positive, the direction is robust."
        permits:
          - "A curve that stays entirely on one side of zero shows that your answer is stable across the choices you listed."
    allow:
      - 'Collapsing them into "the honest range is'
      - 'Collapsing the two into "the honest range is'

  - id: exact-zero
    defect: >-
      Negative tests expected to return exactly zero; a pass read as ruling out
      an artifact; a simulated band used as a decision rule.
    rejects:
      - "state the exact zero I should expect"
      - "make sure it says zero"
      - "rules out one specific artifact"
      - "rules out a procedural artifact"
      - "which rules out the one worry"
    reject_patterns:
      - pattern: "(passing|passed|clean|a) (negative test|control|placebo)[^.]{0,60}(rules? out|eliminates?|proves? (the )?absence|certifies|guarantees)"
        why: "a passed negative test bounded only by the check's sensitivity"
        catches:
          - "A passing negative test eliminates that artifact entirely."
          - "A clean control rules out the artifact."
        permits:
          - "A passed negative test reduces your concern about one specific artifact, as far as that check could have detected it."
      - pattern: "(rules? out[^.]{0,30}\\b(artifact|artefact|worry|one specific)|\\b(artifact|artefact|worry)[^.]{0,40}rules? out)"
        why: "any phrasing that has a check RULE OUT an artifact rather than bound concern"
        catches:
          - "Then write the artifact this pass rules out."
          - "This rules out one specific worry."
          - "That rules out the artifact."
          - "The placebo rules out a procedural artifact."
        permits:
          - "Random assignment rules out confounding by any pre-treatment trait."
          - 'Watch out for "it rules out artifacts" and for expecting an exact zero.'
      - pattern: "(is|was|are|were) not an artifact"
        why: "a clean check reframed as proof the result is genuine"
        catches:
          - "The result is not an artifact of procedure."
          - "This shows the gap is not an artifact."
        permits:
          - "You cannot conclude the result is not an artifact from a single quiet control."
      - pattern: "(confirm|check|verify|ensure)[^.]{0,50}(returns?|comes? back|reads?|says?|sits? at)[^.]{0,25}(exactly|precisely) zero"
        why: "demanding an exact zero from a continuous estimator"
        catches:
          - "Confirm the control returns precisely zero before you continue."
          - "Check that it comes back exactly zero."
        permits:
          - "Reject any answer that asks for a reading of exactly zero."
    requires:
      - "reduces your concern"
    allow:
      - "cannot conclude the result is not an artifact"
      - "Reject any answer that asks for a reading of exactly zero"
      - 'watch out for "it rules out artifacts"'
      - "expecting an exact zero"

  - id: locf-truncation
    defect: >-
      Last-observation-carried-forward for a post-treatment death called an
      equally defensible rule; the resulting spread called an honest range.
    rejects:
      - "an equally defensible rule"
      - "equally defensible alternative, and the gap"
    requires:
      - "post-treatment event"
    allow:
      - "Resist calling that an equally defensible"

  - id: ai-cannot-execute
    defect: >-
      "An AI tool cannot run the code" — capability depends on the environment;
      what is missing from a bare claim is the execution record.
    reject_patterns:
      - pattern: "(an? ai|the tool|the model|neither|it|a chatbot)\\b[^.]{0,25}((cannot|can't|could not|can never)|(?<=neither )can) (run|execute)[^.]{0,15}(the )?code"
        why: "a blanket capability denial; an agent with an execution environment can run code"
        catches:
          - "Neither can run the code."
          - "An AI cannot run the code."
          - "The tool cannot run code."
        permits:
          - "In this disconnected environment, the configured reviewer role cannot run the code, so ask for the record instead."
          - "This reviewer role does not execute anything."
    requires:
      - "execution record"

numbers:
  # prose value -> the seeded computation that must produce it
  - id: ch14-optimism
    file: book/part3-pathways/14-prediction-and-generalization.qmd
    claims:
      - {text: "0.025 RMSE on average", source: "fig_ch14.mean_gap", tolerance: 0.0005}
      - {text: "median 0.015", source: "fig_ch14.median_gap", tolerance: 0.0005}
      - {text: "64 percent of worlds", source: "fig_ch14.pct_worse", tolerance: 0.5}
  - id: ch15-attrition
    file: book/part3-pathways/15-experimental-causal-research.qmd
    claims:
      - {text: "8.1", source: "fig_ch15_attrition.cc_mean", tolerance: 0.05}
  - id: ch22-null
    file: book/part4-credible-evidence/22-diagnostics-and-negative-tests.qmd
    claims:
      # `value:` is explicit because the prose spells the number out.
      - {text: "Sixty-two of them round to 0.00", value: 62, source: "fig_ch22.rounded_zeros", tolerance: 0}
      - {text: "not one reading came back exactly zero", value: 0, source: "fig_ch22.exact_zeros", tolerance: 0}
      - {text: "-0.29 to +0.27 mm", value: -0.29, source: "fig_ch22.lo", tolerance: 0.005}
      - {text: "roughly -0.48 and +0.47", value: -0.48, source: "fig_ch22.obs_min", tolerance: 0.005}
