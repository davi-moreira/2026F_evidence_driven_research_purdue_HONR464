# MISCONCEPTION_MANIFEST.yml — the executable half of acceptance test A5 (D35)
#
# Each confirmed methods defect gets ONE row here. `scripts/validate_misconceptions.py`
# reads this file and fails the build when a rejected formulation reappears anywhere
# on the declared surfaces — chapter bodies AND their prompts, canonical notebook
# sources, generated notebooks, rubrics, configuration, and both translations.
#
# Why this exists: the Batch-B/C round passed prose review while the same
# misconceptions survived in nb08, nb10, ch20, ch23, ms09, ms13, nb14 and the
# generated rubrics. Catching the sentence is not catching the misconception.
#
# Contract (verified by `--self-test`, which is the mutation test): reinserting any
# `rejects:` phrase into any declared surface MUST make the validator exit non-zero.
# The self-test runs against an ISOLATED SNAPSHOT of the surfaces — it never
# mutates a real repository file (round-4 finding G3).
#
# Fields (schema-enforced; a missing field fails the build)
#   id           stable slug, referenced by BOOK_DESIGN_ACCEPTANCE A5
#   defect       one line: what was being taught wrongly
#   estimand     what the correct teaching is actually about (A5)
#   counterexample
#                where the executable/worked counterexample lives (A5)
#   concept_check
#                {question, answer, anchor} — the check a reader must pass,
#                WITH its answer key, so a wrong reading is detectable (A5)
#   cases        the executable A5 record (round-5 G-A): one `positive`
#                (demonstrates the defect), one `boundary` (warning sign
#                present, defect absent), one `converse` (warning sign
#                absent, defect present). Numeric cases carry seeded `code`
#                (numpy, SEED inside) setting `result`, plus `expect`
#                assertions ({key, value, tolerance} or {key, min}/{key,
#                max}). Conceptual cases carry `fixture` + `verdict:
#                caught|permitted`, executed through the entry's own scan
#                rules. All cases RUN on every full scan.
#   rejects      exact phrases that must NOT appear (case-insensitive substring)
#   reject_patterns
#                regex FAMILIES targeting the claim rather than one wording, so a
#                paraphrase cannot drift through. Each carries `catches:` (drift
#                sentences the pattern must flag) and `permits:` (legitimate
#                phrasings it must NOT flag); --self-test asserts both.
#   allow        PINNED exceptions — passages that quote a phrase in order to
#                refute it. Each entry is {text, pins: [{file, sha256}]}:
#                suppression applies ONLY in a pinned file, ONLY while the
#                WINDOW (previous + containing + next paragraph; notebook
#                cells are separate paragraphs) hashes to the pinned value,
#                and ONLY while that window is UNIQUE in the file. An edit in
#                or beside the quotation, or a duplicated copy, invalidates
#                the exception (rounds 4-6). Inert allows are forbidden:
#                an exception that suppresses nothing is laundering surface.
#   allow_reversals
#                adversarial endorsements that reuse allowed material and MUST
#                still be caught; required whenever `allow:` exists, asserted by
#                --self-test.
#   requires     phrases that MUST appear somewhere in `surfaces` (the correction
#                is present, not merely the error absent)
#   numbers      figures whose prose value must match the seeded computation
#   surfaces     glob list; defaults to all book editions + canonical sources

defaults:
  # Every entry is {glob, required}. `required: true` means a glob matching ZERO
  # files FAILS the build: a gate that silently skips a surface class reports
  # "clean" about material it never opened (round-3 finding R3-7).
  #
  # HONESTY NOTE on what a fresh CI checkout certifies (round-4 finding G2):
  # `_production_kit/nb_sources/*.py` and `notebooks/instructor/*.ipynb` are
  # GITIGNORED, so public CI certifies ONLY the tracked public surfaces.
  # Generated notebooks are NOT a substitute for canonical sources — an
  # instructor-only solution can carry a misconception the student copy never
  # shows. The canonical surfaces are enforced by `--local` mode, which
  # `scripts/nbbuild.py` and `scripts/sync_instructor_repo.sh` run at the two
  # points where canonical content actually moves; `--local` also fails when a
  # canonical source is NEWER than its generated student notebook (staleness).
  surfaces:
    - {glob: "book/**/*.qmd", required: true}
    - {glob: "book-pt/**/*.qmd", required: true}
    - {glob: "book-es/**/*.qmd", required: true}
    - {glob: "notebooks/student/*.ipynb", required: true}
    - {glob: "notebooks/book/*.ipynb", required: true}
    - {glob: "notebooks/book/pt/*.ipynb", required: true}
    - {glob: "notebooks/book/es/*.ipynb", required: true}
    - {glob: "book/_iyt-rubrics.qmd", required: true}
    - {glob: "book-pt/_iyt-rubrics.qmd", required: true}
    - {glob: "book-es/_iyt-rubrics.qmd", required: true}
    - {glob: "course_config.yaml", required: true}
    - {glob: "planning/INQUIRY_MAP.md", required: true}
    - {glob: "scripts/build_session_guides.py", required: true}
    - {glob: "_production_kit/nb_sources/*.py", required: false, local_required: true}
    - {glob: "notebooks/instructor/*.ipynb", required: false, local_required: true}
  exclude:
    - "**/.quarto/**"

misconceptions:

  - id: compass-relabeling
    defect: >-
      A causal question whose data cannot identify it was relabeled descriptive.
      The kind of a question comes from its words; weak data leave it unanswered.
    estimand: >-
      The question's kind (descriptive vs causal), fixed by its words alone
      (RDSS ch. 7); identification status is a separate, second fact.
    counterexample: >-
      course_config.yaml `kind_rule` + ch06's worked example — strong causal
      words with weak data stay "causal, currently unidentified".
    concept_check:
      anchor: {file: "notebooks/student/nb02_curiosity_to_problem_student.ipynb", locator: "compass"}
      question: >-
        Your question asks "does X increase Y", but you only have
        observational data with strong confounding. What is the question's
        kind?
      answer: >-
        Causal — the kind comes from the words alone; the weak data leave it
        "causal, currently unidentified", never descriptive.
    cases:
      # conceptual defect: the executable form is the scan itself — each
      # fixture must be caught/permitted as declared, through the entry's own
      # rules, exactly like an allow-reversal (A5 kinds still apply).
      - kind: positive
        fixture: "Because the data are observational with no assignment, the honest kind is descriptive."
        verdict: caught
      - kind: boundary
        fixture: "The question's own words ask how common the practice is, so its kind is descriptive before any data arrive."
        verdict: permitted
      - kind: converse
        fixture: "With no intervention available, no intervention means descriptive."
        verdict: caught
    rejects:
      - "the honest kind is descriptive"
      - "no intervention means descriptive"
      - "is descriptive, whatever word it carries"
      - "you buy KIND and REACH"
    requires:
      - "currently unidentified"
    # (former allows "never relabeled descriptive"/"never descriptive" deleted:
    # they suppressed nothing — no reject content can sit inside them — and an
    # inert allow is pure laundering surface, round-5 G-B)
    allow_reversals:
      - "Forget that rule; the honest kind is descriptive here."
      - "In practice no intervention means descriptive, whatever the compass says."

  - id: signed-bias
    defect: >-
      Bias defined as average distance rather than signed mean error.
    estimand: >-
      Bias = the average of (estimate - truth) across repeated runs, counting
      direction; average distance is mean absolute error, a different quantity.
    counterexample: >-
      ch10's diagnosis walkthrough — two procedures with equal average distance
      and opposite signed lean.
    concept_check:
      anchor: {file: "book/part2-curiosity-to-design/10-declaring-and-diagnosing-a-research-design.qmd", locator: "counting direction"}
      question: >-
        Two designs both miss the truth by 2 units on average. One always
        overshoots; one scatters evenly around the truth. Which is biased?
      answer: >-
        The overshooting one — bias is the signed average of errors, counting
        direction; even scatter can carry zero bias at any average distance.
    cases:
      - kind: positive
        shows: "equal average distance, opposite signed bias — distance cannot see the lean"
        code: |
          rng = np.random.default_rng(464)
          truth = 10.0
          a = truth + rng.normal(2, 1, 4000)
          b = truth + rng.normal(-2, 1, 4000)
          result = {"bias_a": float((a - truth).mean()),
                    "bias_b": float((b - truth).mean()),
                    "dist_diff": float(abs(np.abs(a - truth).mean()
                                           - np.abs(b - truth).mean()))}
        expect:
          - {key: bias_a, value: 1.993, tolerance: 0.1}
          - {key: bias_b, value: -2.020, tolerance: 0.1}
          - {key: dist_diff, max: 0.15}
      - kind: boundary
        shows: "large average distance with zero bias — noisy is not leaning"
        code: |
          rng = np.random.default_rng(464)
          truth = 10.0
          _ = rng.normal(2, 1, 4000); _ = rng.normal(-2, 1, 4000)
          c = truth + rng.normal(0, 3, 4000)
          result = {"bias_c": float((c - truth).mean()),
                    "avgdist_c": float(np.abs(c - truth).mean())}
        expect:
          - {key: bias_c, value: 0.045, tolerance: 0.1}
          - {key: avgdist_c, min: 2.2}
      - kind: converse
        shows: "tiny average distance, systematic lean — precise and still biased"
        code: |
          rng = np.random.default_rng(464)
          truth = 10.0
          _ = rng.normal(2, 1, 4000); _ = rng.normal(-2, 1, 4000)
          _ = rng.normal(0, 3, 4000)
          d = truth + rng.normal(0.2, 0.05, 4000)
          result = {"bias_d": float((d - truth).mean()),
                    "avgdist_d": float(np.abs(d - truth).mean())}
        expect:
          - {key: bias_d, value: 0.199, tolerance: 0.03}
          - {key: avgdist_d, max: 0.25}
    rejects:
      - "average distance between your estimate"
    reject_patterns:
      - pattern: "(bias|viés|sesgo)[^.]{0,40}\\b(is|é|es)\\b[^.]{0,30}((average|média|promedio)[^.]{0,15}(distance|distância|distancia)|(distance|distância|distancia)[^.]{0,15}(average|média|promedio))"
        why: "bias defined as average distance (that is mean absolute error, unsigned)"
        catches:
          - "Bias is the average distance between your estimate and the truth."
          - "O viés é a distância média entre a sua estimativa e a verdade."
        permits:
          - "The average distance between campus and the lab is two kilometres."
          - "Bias is the average of your errors across the runs, counting direction."
    requires:
      - "counting direction"

  - id: power-needs-a-rule
    defect: >-
      Power stated with no test, no threshold, and alpha read as the chance the
      finding is false.
    estimand: >-
      Power = the probability that a DECLARED statistical test, at a declared
      threshold, rejects when the assumed effect is real.
    counterexample: >-
      ch10's power walkthrough — the same design's "power" changes when the
      declared test changes, so power without a test is not a number.
    concept_check:
      anchor: {file: "book/part2-curiosity-to-design/10-declaring-and-diagnosing-a-research-design.qmd", locator: "statistical test"}
      question: >-
        A designer says "this study has 80 percent power." What must they have
        declared for that number to mean anything?
      answer: >-
        The statistical test (the decision rule), its threshold, and the
        assumed effect size — power is a property of that whole triple.
    cases:
      - kind: positive
        shows: "same design, same data, different declared threshold — different power"
        code: |
          rng = np.random.default_rng(464)
          r1 = r2 = 0; reps = 400
          for _ in range(reps):
              x = rng.normal(0.5, 1, 40); y = rng.normal(0, 1, 40)
              se = np.sqrt(x.var(ddof=1)/40 + y.var(ddof=1)/40)
              t = (x.mean() - y.mean()) / se
              r1 += abs(t) > 1.96; r2 += abs(t) > 2.58
          result = {"power_05": r1/reps, "power_01": r2/reps,
                    "gap": r1/reps - r2/reps}
        expect:
          - {key: power_05, value: 0.595, tolerance: 0.05}
          - {key: power_01, value: 0.345, tolerance: 0.05}
          - {key: gap, min: 0.1}
      - kind: boundary
        shows: "no assumed effect — the same rule rejects at only its alpha rate"
        code: |
          rng = np.random.default_rng(464)
          r0 = 0; reps = 400
          for _ in range(reps):
              x = rng.normal(0, 1, 40); y = rng.normal(0, 1, 40)
              se = np.sqrt(x.var(ddof=1)/40 + y.var(ddof=1)/40)
              t = (x.mean() - y.mean()) / se
              r0 += abs(t) > 1.96
          result = {"null_rate": r0/reps}
        expect:
          - {key: null_rate, min: 0.02, max: 0.08}
      - kind: converse
        shows: "same alpha, different declared TEST — different power; alpha alone fixes nothing"
        code: |
          rng = np.random.default_rng(464)
          r_two = r_one = 0; reps = 400
          for _ in range(reps):
              x = rng.normal(0.5, 1, 40); y = rng.normal(0, 1, 40)
              se = np.sqrt(x.var(ddof=1)/40 + y.var(ddof=1)/40)
              t = (x.mean() - y.mean()) / se
              r_two += abs(t) > 1.96; r_one += t > 1.645
          result = {"power_two": r_two/reps, "power_one": r_one/reps,
                    "gap": r_one/reps - r_two/reps}
        expect:
          - {key: power_two, value: 0.595, tolerance: 0.05}
          - {key: power_one, value: 0.705, tolerance: 0.05}
          - {key: gap, min: 0.05}
    rejects:
      - "5 percent chance of a false alarm"
      - "a 5% chance that this result is false"
    requires:
      - "statistical test"

  - id: attrition-stayers
    defect: >-
      A complete-case contrast under treatment-dependent attrition called "the
      effect among stayers"; unequal retention treated as a diagnosis.
    estimand: >-
      The complete-case contrast E[Y | measured, treated] - E[Y | measured,
      control]; under treatment-dependent attrition it is an effect for no
      named group.
    counterexample: >-
      fig_ch15_attrition (seeded, SEED=464) — truth 5, complete-case contrast
      8.1, because treatment changed who stayed measurable.
    concept_check:
      anchor: {file: "notebooks/student/nb08_prediction_student.ipynb", locator: "complete-case contrast"}
      # D49: the attrition guard is taught in the Studio 8 stress-test week,
      # which is nb08 now (nb09 became Studio 9, write-bound-disclose)
      question: >-
        Treatment made more low-scorers drop out before the final measure.
        Whose effect does the complete-case gap estimate?
      answer: >-
        No named group's — it is a complete-case contrast, a comparison of
        whoever happened to stay measurable in each arm.
    cases:
      - kind: positive
        shows: "treatment-dependent attrition inflates the complete-case contrast far past the truth"
        code: |
          rng = np.random.default_rng(464); n = 4000
          y0 = rng.normal(50, 10, n); tau = 5.0; y1 = y0 + tau
          t = rng.random(n) < .5
          keep = np.where(t, rng.random(n) < 1/(1+np.exp(-(y1-55)/5)),
                          rng.random(n) < .8)
          result = {"truth": tau,
                    "cc_gap": float(y1[t & keep].mean() - y0[(~t) & keep].mean())}
        expect:
          - {key: truth, value: 5.0, tolerance: 0}
          - {key: cc_gap, min: 8.0}
      - kind: boundary
        shows: "retention DIFFERS by arm but is unrelated to outcomes — little bias despite the warning sign"
        code: |
          rng = np.random.default_rng(464); n = 4000
          y0 = rng.normal(50, 10, n); tau = 5.0; y1 = y0 + tau
          t = rng.random(n) < .5
          keep = np.where(t, rng.random(n) < .5, rng.random(n) < .8)
          result = {"cc_gap": float(y1[t & keep].mean() - y0[(~t) & keep].mean())}
        expect:
          - {key: cc_gap, value: 5.0, tolerance: 0.7}
      - kind: converse
        shows: "EQUAL retention rates with opposite outcome selection — the warning sign is absent, the bias is huge"
        code: |
          rng = np.random.default_rng(464); n = 4000
          y0 = rng.normal(50, 10, n); tau = 5.0; y1 = y0 + tau
          t = rng.random(n) < .5
          thr_t = np.quantile(y1[t], .4); thr_c = np.quantile(y0[~t], .6)
          keep = np.where(t, y1 > thr_t, y0 < thr_c)
          result = {"rate_diff": float(abs(keep[t].mean() - keep[~t].mean())),
                    "cc_gap": float(y1[t & keep].mean() - y0[(~t) & keep].mean())}
        expect:
          - {key: rate_diff, max: 0.02}
          - {key: cc_gap, min: 12.0}
    rejects:
      - "the effect among stayers"
      - "effect among those who stayed"
    reject_patterns:
      - pattern: "(gap|difference|number|estimate|contrast)[^.]{0,40}(describes|is the effect for|gives you)[^.]{0,25}(only )?(the )?(patients|people|units|larvae)[^.]{0,20}(who (remained|stayed)(?! silent)|remaining)"
        why: "hands the number to the units that remained, which no contrast delivers"
        catches:
          - "The gap therefore describes the patients who remained in the study."
          - "That difference is the effect for the people who stayed."
        permits:
          - "Their difference is a complete-case contrast, a comparison of whoever happened to be measured in each arm."
          - "It is also not automatically an effect for any shared group of stayers."
          - "Listen for: evidence that the people who stayed silent resemble the people who answered."
          - "It is tempting to hand the 9-point gap to the patients who stayed. Be careful with that sentence."
      - pattern: "not the effect among stayers[^.]{0,25}(except|unless|but (whenever|it is)|yet it is|save when)"
        why: "the correction stated and then immediately taken back"
        catches:
          - "It is not the effect among stayers—except whenever retention differs."
          - "It is not the effect among stayers unless retention is equal."
          - "It is not the effect among stayers, but it is close enough to treat as one."
        permits:
          - "It is not an effect for any named group, because each arm produced its own survivors."
    requires:
      - "complete-case contrast"
    # (former allows deleted as inert — no live hit needed them, round-5 G-B)
    allow_reversals:
      - "It is not the effect among stayers, but it is close enough to treat as one."
      - "It is not the effect among stayers, yet it is what we report as one."
      - "It is not the effect among stayers, because each arm produced its own. Ignore that distinction. Report the contrast as causal for the survivors."

  - id: adjustment-set
    defect: >-
      "Adjust for every confounder you can measure" — adjusting for mediators or
      colliders manufactures bias.
    estimand: >-
      The causal contrast identified under a SUFFICIENT adjustment set; adding a
      mediator or collider to the set changes the estimand or manufactures bias.
    counterexample: >-
      ch12's collider example — conditioning on a consequence of both cause and
      outcome creates an association that was never there.
    concept_check:
      anchor: {file: "book/part3-pathways/12-observational-causal-research.qmd", locator: "collider"}
      question: "Should you adjust for every variable you can measure?"
      answer: >-
        No — adjust for a SUFFICIENT set; conditioning on a collider
        manufactures an association, and conditioning on a mediator changes
        the question.
    cases:
      - kind: positive
        shows: "true effect zero; adjusting for a collider manufactures a strong association"
        code: |
          rng = np.random.default_rng(464); n = 4000
          x = rng.normal(0, 1, n); y = rng.normal(0, 1, n)
          col = x + y + rng.normal(0, .5, n)
          unadj = np.linalg.lstsq(np.column_stack([np.ones(n), x]), y,
                                  rcond=None)[0][1]
          adj = np.linalg.lstsq(np.column_stack([np.ones(n), x, col]), y,
                                rcond=None)[0][1]
          result = {"unadj": float(unadj), "adj": float(adj)}
        expect:
          - {key: unadj, value: 0.0, tolerance: 0.07}
          - {key: adj, max: -0.5}
      - kind: boundary
        shows: "a genuine confounder — here adjustment is exactly right"
        code: |
          rng = np.random.default_rng(464); n = 4000
          _ = rng.normal(0, 1, n); _ = rng.normal(0, 1, n)
          _ = rng.normal(0, .5, n)
          z = rng.normal(0, 1, n)
          x = z + rng.normal(0, 1, n); y = z + rng.normal(0, 1, n)
          unadj = np.linalg.lstsq(np.column_stack([np.ones(n), x]), y,
                                  rcond=None)[0][1]
          adj = np.linalg.lstsq(np.column_stack([np.ones(n), x, z]), y,
                                rcond=None)[0][1]
          result = {"unadj": float(unadj), "adj": float(adj)}
        expect:
          - {key: unadj, min: 0.35}
          - {key: adj, value: 0.0, tolerance: 0.07}
      - kind: converse
        shows: "adjusting for a mediator erases a real effect — more adjustment, worse answer"
        code: |
          rng = np.random.default_rng(464); n = 4000
          for _ in range(5):
              _ = rng.normal(0, 1, n)
          _ = rng.normal(0, .5, n)
          x = rng.normal(0, 1, n)
          m = x + rng.normal(0, .5, n)
          y = .8 * m + rng.normal(0, 1, n)
          unadj = np.linalg.lstsq(np.column_stack([np.ones(n), x]), y,
                                  rcond=None)[0][1]
          adj = np.linalg.lstsq(np.column_stack([np.ones(n), x, m]), y,
                                rcond=None)[0][1]
          result = {"unadj": float(unadj), "adj": float(adj)}
        expect:
          - {key: unadj, min: 0.65}
          - {key: adj, value: 0.0, tolerance: 0.1}
    rejects:
      - "every confounder you can measure"
      - "each factor of confusion that you can measure"
    requires:
      - "collider"

  - id: selection-on-holdout
    defect: >-
      Model chosen on the same holdout that reports final performance; the
      winner's crowning score reported as final.
    estimand: >-
      The generalization error of the ONE pre-committed final model, scored on
      data that never touched fitting or selection.
    counterexample: >-
      fig_ch14 (seeded, SEED=464) — across 500 worlds the winner's true error
      exceeds its crowning selection score by +0.025 RMSE on average.
    concept_check:
      anchor: {file: "book/part3-pathways/14-prediction-and-generalization.qmd", locator: "selection set"}
      question: >-
        You picked the model with the best holdout score. May you report that
        score as its performance?
      answer: >-
        No — selection made the winning score optimistic; only a locked final
        holdout that touched neither fitting nor selection can score the one
        chosen model.
    cases:
      - kind: positive
        shows: "the winner's true error exceeds its crowning selection score on average"
        code: |
          rng = np.random.default_rng(464)
          degrees = np.arange(1, 13)
          def rmse(c, x, y):
              return np.sqrt(np.mean((np.polyval(c, x) - y) ** 2))
          def world(n):
              x = rng.uniform(-3, 3, n)
              return x, np.sin(1.5 * x) + rng.normal(0, .35, n)
          gaps = []
          for _ in range(200):
              (xt, yt), (xs, ys), (xb, yb) = world(40), world(40), world(5000)
              f = [np.polyfit(xt, yt, d) for d in degrees]
              se = np.array([rmse(c, xs, ys) for c in f])
              pick = int(np.argmin(se))
              gaps.append(rmse(f[pick], xb, yb) - se[pick])
          result = {"mean_gap": float(np.mean(gaps))}
        expect:
          - {key: mean_gap, min: 0.015}
      - kind: boundary
        shows: "no selection (one pre-committed model) — the same reuse shows no optimism"
        code: |
          rng = np.random.default_rng(464)
          def rmse(c, x, y):
              return np.sqrt(np.mean((np.polyval(c, x) - y) ** 2))
          def world(n):
              x = rng.uniform(-3, 3, n)
              return x, np.sin(1.5 * x) + rng.normal(0, .35, n)
          gaps = []
          for _ in range(200):
              (xt, yt), (xs, ys), (xb, yb) = world(40), world(40), world(5000)
              c = np.polyfit(xt, yt, 4)
              gaps.append(rmse(c, xb, yb) - rmse(c, xs, ys))
          result = {"mean_gap": float(np.mean(gaps))}
        expect:
          - {key: mean_gap, max: 0.012, min: -0.012}
      - kind: converse
        shows: "a clean-LOOKING split still leaks when the feature was chosen on all data"
        code: |
          rng = np.random.default_rng(464)
          cors = []
          for _ in range(200):
              F = rng.normal(0, 1, (100, 20)); y = rng.normal(0, 1, 100)
              full = [np.corrcoef(F[:, k], y)[0, 1] for k in range(20)]
              j = int(np.argmax(np.abs(full)))
              sgn = np.sign(full[j])
              cors.append(sgn * np.corrcoef(F[50:, j], y[50:])[0, 1])
          result = {"mean_holdout_corr": float(np.mean(cors))}
        expect:
          - {key: mean_holdout_corr, min: 0.05}
    rejects:
      - "honest best"
      - "the only honest test"
    reject_patterns:
      - pattern: "(pick|choose|choosing|select|selecting|keep)[^.]{0,50}(best|lowest|smallest|winning)[^.]{0,40}(on|from|using)[^.]{0,25}(the )?(test|holdout|held-out|final)"
        why: "choosing a model on the data that reports final performance"
        catches:
          - "Pick whichever model scores best on the test rows."
          - "Choose the degree with the lowest error on the holdout."
        permits:
          - "Fit on training, choose on selection, then score your one choice on the final holdout."
          - "The selection set is separate data you use to choose among candidates."
    requires:
      - "selection set"

  - id: reliability-splits-items
    defect: >-
      "Two halves of one sample" offered as split-half reliability; splitting
      respondents measures sampling variation, not the instrument.
    estimand: >-
      Internal consistency of the INSTRUMENT — agreement between item halves
      within each respondent, not between respondent halves.
    counterexample: >-
      ch18's items-vs-people contrast — respondent halves agree even when the
      items measure nothing coherent.
    concept_check:
      anchor: {file: "book/part4-credible-evidence/18-measurement-and-operationalization.qmd", locator: "split items, never people"}
      question: "To check split-half reliability, do you split respondents or items?"
      answer: >-
        Items, never people — respondent halves agree even when the items
        measure nothing coherent, because item difficulty travels with the
        item.
    cases:
      - kind: positive
        shows: "an INCOHERENT instrument: respondent halves still agree almost perfectly"
        code: |
          rng = np.random.default_rng(464); n, k = 400, 20
          bk = rng.normal(0, 1, k)
          X = bk + rng.normal(0, 1, (n, k))     # no person factor at all
          people_split = np.corrcoef(X[:n//2].mean(0), X[n//2:].mean(0))[0, 1]
          result = {"people_split": float(people_split)}
        expect:
          - {key: people_split, min: 0.9}
      - kind: boundary
        shows: "a COHERENT scale: the item split is high, as it should be"
        code: |
          rng = np.random.default_rng(464); n, k = 400, 20
          bk = rng.normal(0, 1, k)
          _ = rng.normal(0, 1, (n, k))
          theta = rng.normal(0, 1, n)
          Xc = bk + theta[:, None] + rng.normal(0, 1, (n, k))
          item_split = np.corrcoef(Xc[:, 0::2].sum(1), Xc[:, 1::2].sum(1))[0, 1]
          result = {"item_split": float(item_split)}
        expect:
          - {key: item_split, min: 0.6}
      - kind: converse
        shows: "the same incoherent instrument under the CORRECT split: near zero, as it should be"
        code: |
          rng = np.random.default_rng(464); n, k = 400, 20
          bk = rng.normal(0, 1, k)
          X = bk + rng.normal(0, 1, (n, k))
          item_split = np.corrcoef(X[:, 0::2].sum(1), X[:, 1::2].sum(1))[0, 1]
          result = {"item_split": float(item_split)}
        expect:
          - {key: item_split, max: 0.15, min: -0.15}
    rejects:
      - "two halves of one sample"
    requires:
      - "split items, never people"

  - id: specification-spread
    defect: >-
      A same-sign specification curve read as robustness; the min-max span
      reported as an uncertainty interval; versions mixing estimands.
    estimand: >-
      One estimand per commensurable panel; the within-panel spread measures
      what the analyst's CHOICES did, never what chance could do.
    counterexample: >-
      ch21's worked example (three panels, one span each) and ms09's executable
      grid — a cross-panel range compares net-of-tax to gross numbers.
    concept_check:
      anchor: {file: "book/part4-credible-evidence/21-robustness-and-sensitivity.qmd", locator: "specification spread"}
      question: "All your specifications agree in sign. Is the finding robust?"
      answer: >-
        Not yet — a flaw shared by every specification tilts them all
        together; the span measures your choices, never what chance could do.
    cases:
      # Every case keeps the SAME rows and SAME outcome and varies only
      # defensible pre-treatment adjustment sets — the panel rule the entry
      # itself enforces (round-6 F1: the earlier cases conditioned on the
      # outcome and mixed populations into one range).
      - kind: positive
        shows: "true effect ZERO, one shared unobserved confounder — every same-panel specification agrees anyway"
        code: |
          rng = np.random.default_rng(464); n = 3000
          u = rng.normal(0, 1, n)
          z1 = rng.normal(0, 1, n); z2 = rng.normal(0, 1, n)
          g = (u + rng.normal(0, 1, n)) > 0
          y = 0 * g + u + 0.3 * z1 + 0.3 * z2 + rng.normal(0, 1, n)
          def spec(covs):
              X = np.column_stack([np.ones(n), g.astype(float)] + covs)
              return float(np.linalg.lstsq(X, y, rcond=None)[0][1])
          specs = [spec([]), spec([z1]), spec([z2]), spec([z1, z2])]
          result = {"min_gap": min(specs), "truth": 0.0}
        expect:
          - {key: min_gap, min: 0.8}
          - {key: truth, value: 0.0, tolerance: 0}
      - kind: boundary
        shows: "same-sign agreement WITHOUT the defect — a real effect, randomized, no shared bias"
        code: |
          rng = np.random.default_rng(464); n = 3000
          _ = rng.normal(0, 1, n)
          z1 = rng.normal(0, 1, n); z2 = rng.normal(0, 1, n)
          g = rng.random(n) < .5
          y = 0.5 * g + 0.3 * z1 + 0.3 * z2 + rng.normal(0, 1, n)
          def spec(covs):
              X = np.column_stack([np.ones(n), g.astype(float)] + covs)
              return float(np.linalg.lstsq(X, y, rcond=None)[0][1])
          specs = [spec([]), spec([z1]), spec([z2]), spec([z1, z2])]
          result = {"min_gap": min(specs), "max_gap": max(specs)}
        expect:
          - {key: min_gap, min: 0.35}
          - {key: max_gap, max: 0.55}
      - kind: converse
        shows: "the specification range is far narrower than the lead estimate's OWN interval, computed from its actual group sizes and variances"
        code: |
          rng = np.random.default_rng(464); n = 3000
          _ = rng.normal(0, 1, n)
          z1 = rng.normal(0, 1, n); z2 = rng.normal(0, 1, n)
          g = rng.random(n) < .5
          y = 0.5 * g + 0.3 * z1 + 0.3 * z2 + rng.normal(0, 1, n)
          def spec(covs):
              X = np.column_stack([np.ones(n), g.astype(float)] + covs)
              return float(np.linalg.lstsq(X, y, rcond=None)[0][1])
          specs = [spec([]), spec([z1]), spec([z2]), spec([z1, z2])]
          y1, y0 = y[g], y[~g]
          se = float(np.sqrt(y1.var(ddof=1) / len(y1)
                             + y0.var(ddof=1) / len(y0)))
          spec_range = max(specs) - min(specs)
          result = {"spec_range": spec_range,
                    "ci_width": 2 * 1.96 * se,
                    "ratio": spec_range / (2 * 1.96 * se)}
        expect:
          - {key: ratio, max: 0.3}
    rejects:
      - "its spread is your honest range"
      - "the honest range is"
      - "direction is robust and the range"
    requires:
      - "specification spread"
      - "Shared bias"
    reject_patterns:
      - pattern: "(if|when)[^.]{0,60}(every|all)[^.]{0,40}(specification|version|dot)s?[^.]{0,40}(agree|positive|same sign|one side)[^.]{0,40}(robust|holds|confirmed|solid)"
        why: "same-sign agreement read as robustness; a shared bias tilts them together"
        catches:
          - "If every specification agrees, the finding is robust."
          - "When all versions are positive, the direction is robust."
        permits:
          - "A curve that stays entirely on one side of zero shows that your answer is stable across the choices you listed."
    allow:
      # PINNED exception (round-5 G-B): suppression applies ONLY in the pinned
      # file AND only while the paragraph containing the hit still hashes to
      # the pinned value. Any edit near the quotation — including an appended
      # endorsement — invalidates the pin and the reject fires.
      - text: 'Collapsing them into "the honest range is eight to fifteen" quietly claims a precision nobody computed'
        pins:
          - {file: "book/part4-credible-evidence/21-robustness-and-sensitivity.qmd",
             sha256: "27715dcc27fa8b6c9ef6c2e963d699095e9ad1301aaf0cd633e2d76ece77a5b9"}
    allow_reversals:
      - 'Collapsing them into "the honest range is 8 to 15" is correct.'
      - 'Collapsing them into "the honest range is eight to fifteen" is the right call.'
      - 'Collapsing them into "the honest range is eight to fifteen" quietly claims a precision nobody computed. That warning is overly cautious. Use that quoted range as the study uncertainty interval.'

  - id: exact-zero
    defect: >-
      Negative tests expected to return exactly zero; a pass read as ruling out
      an artifact; a simulated band used as a decision rule; a negative
      control's own estimate collapsed into a permutation-style pile.
    estimand: >-
      The null DISTRIBUTION of a continuous estimator (never a point at zero);
      a negative control is its own estimate read against its own uncertainty,
      not a member of an assignment or permutation pile.
    counterexample: >-
      fig_ch22 (seeded, SEED=464) — 2,000 true-null runs, zero exact zeros,
      62 rounding to 0.00, spread -0.29 to +0.27.
    concept_check:
      anchor: {file: "book/part4-credible-evidence/22-diagnostics-and-negative-tests.qmd", locator: "exactly zero"}
      question: "Your negative control read 0.07, not zero. Is that a failure?"
      answer: >-
        Not by itself — a valid null yields a spread of nonzero readings from
        a continuous estimator; read the estimate against its own uncertainty.
    cases:
      - kind: positive
        shows: "a TRUE null, continuous estimator: zero exact zeros, real spread"
        code: |
          rng = np.random.default_rng(464)
          a = (6.3 + rng.normal(0, .4, (300, 12))
               + rng.normal(0, .35, (300, 12))).mean(1)
          b = (6.3 + rng.normal(0, .4, (300, 12))
               + rng.normal(0, .35, (300, 12))).mean(1)
          nulls = a - b
          result = {"exact_zeros": int((nulls == 0).sum()),
                    "sd": float(nulls.std())}
        expect:
          - {key: exact_zeros, value: 0, tolerance: 0}
          - {key: sd, value: 0.213, tolerance: 0.05}
      - kind: boundary
        shows: "a DISCRETE estimator legitimately returns exact zeros — the rule is about continuous readouts"
        code: |
          rng = np.random.default_rng(464)
          _ = rng.normal(0, .4, (300, 12)); _ = rng.normal(0, .35, (300, 12))
          _ = rng.normal(0, .4, (300, 12)); _ = rng.normal(0, .35, (300, 12))
          pois = rng.poisson(3, (300, 2))
          disc = (pois[:, 0] - pois[:, 1]).astype(float)
          result = {"exact_zeros": int((disc == 0).sum())}
        expect:
          - {key: exact_zeros, min: 20}
      - kind: converse
        shows: "a pipeline that INVENTS signal: the null spread sits clearly off zero — that is what a failing control looks like"
        code: |
          rng = np.random.default_rng(464)
          a = (6.3 + rng.normal(0, .4, (300, 12))
               + rng.normal(0, .35, (300, 12))).mean(1)
          b = (6.3 + rng.normal(0, .4, (300, 12))
               + rng.normal(0, .35, (300, 12))).mean(1)
          contaminated = (a - b) + 0.3
          result = {"mean": float(contaminated.mean())}
        expect:
          - {key: mean, value: 0.294, tolerance: 0.05}
    rejects:
      - "state the exact zero I should expect"
      - "make sure it says zero"
      - "rules out one specific artifact"
      - "rules out a procedural artifact"
      - "which rules out the one worry"
    reject_patterns:
      - pattern: "(passing|passed|clean|a) (negative test|control|placebo)[^.]{0,60}(rules? out|eliminates?|proves? (the )?absence|certifies|guarantees)"
        why: "a passed negative test bounded only by the check's sensitivity"
        catches:
          - "A passing negative test eliminates that artifact entirely."
          - "A clean control rules out the artifact."
        permits:
          - "A passed negative test reduces your concern about one specific artifact, as far as that check could have detected it."
      - pattern: "(rules? out[^.]{0,30}\\b(artifact|artefact|worry|one specific)|\\b(artifact|artefact|worry)[^.]{0,40}rules? out)"
        why: "any phrasing that has a check RULE OUT an artifact rather than bound concern"
        catches:
          - "Then write the artifact this pass rules out."
          - "This rules out one specific worry."
          - "That rules out the artifact."
          - "The placebo rules out a procedural artifact."
          - "It rules out artifacts, whatever the caveats say."
        permits:
          # (the corrective nb10 quotation lives behind a PIN, not here — a
          # pinned sentence cannot be probe-tested as a permit)
          - "Random assignment rules out confounding by any pre-treatment trait."
      - pattern: "(is|was|are|were) not an artifact"
        why: "a clean check reframed as proof the result is genuine"
        catches:
          - "The result is not an artifact of procedure."
          - "This shows the gap is not an artifact."
        permits:
          - "Whether the result is an artifact stays open after one quiet control."
      - pattern: "(confirm|check|verify|ensure|expect)[^.]{0,50}(returns?|comes? back|reads?|says?|sits? at|to (return|come back|read))[^.]{0,25}(exactly|precisely) zero"
        why: "demanding an exact zero from a continuous estimator"
        catches:
          - "Confirm the control returns precisely zero before you continue."
          - "Check that it comes back exactly zero."
          - "Expect the reading to come back exactly zero."
        permits:
          - "Reject any answer that asks for a reading of exactly zero."
      - pattern: "negative control[^.]{0,60}(ordinary in (that|the) pile|(?<!not )builds? (a|the|the same) pile|sits? in (that|the) pile)"
        why: "a negative control collapsed into a permutation-style pile; it produces its own estimate (round-4 F1)"
        catches:
          - "A negative control builds the same pile of fake gaps."
          - "Even for a negative control, ask whether your real number is ordinary in that pile."
        permits:
          - "A negative control does not build a pile for your headline number to sit in."
    requires:
      - "reduces your concern"
    allow:
      # PINNED exception (round-5 G-B): the one live corrective quotation.
      # Former inert allows deleted; suppression is file- and paragraph-scoped.
      - text: 'watch out for "it rules out artifacts"'
        pins:
          - {file: "_production_kit/nb_sources/nb10_attack_the_analysis.py",
             sha256: "f6469d57999419c9ca2cfa6cb3d156e9aed6235e6f72015d2a4feca06b8555ec"}
          - {file: "notebooks/instructor/nb10_attack_the_analysis_instructor.ipynb",
             sha256: "f6469d57999419c9ca2cfa6cb3d156e9aed6235e6f72015d2a4feca06b8555ec"}
          - {file: "notebooks/student/nb10_attack_the_analysis_student.ipynb",
             sha256: "f6469d57999419c9ca2cfa6cb3d156e9aed6235e6f72015d2a4feca06b8555ec"}
    allow_reversals:
      - "You can conclude the result is not an artifact after one quiet control."
      - "Check that the control reads exactly zero before continuing."
      - "It rules out artifacts, whatever the caveats say."
      - "Expect the reading to come back exactly zero."
      - 'Do watch out for "it rules out artifacts" less than the cautious do; it rules out the artifact in practice.'

  - id: locf-truncation
    defect: >-
      Last-observation-carried-forward for a post-treatment death called an
      equally defensible rule; the resulting spread called an honest range.
    estimand: >-
      A DECLARED estimand under truncation by death (for example a survivor
      description with its stratum named), never a rule-shopping spread.
    counterexample: >-
      ch32's dead-larvae walkthrough — LOCF invents outcomes for units that no
      longer have them, so the two "rules" answer different questions.
    concept_check:
      anchor: {file: "book/part6-after-conference/32-replication-and-reproduction.qmd", locator: "post-treatment event"}
      question: >-
        Some units died before the final measure. Is carrying the last
        observation forward a neutral default?
      answer: >-
        No — death is a post-treatment event; each handling rule answers a
        DIFFERENT question, so declare the estimand and its assumptions
        instead of averaging rules.
    cases:
      - kind: positive
        shows: "outcome-dependent deaths: LOCF and complete-case give sharply different answers — neither is neutral"
        code: |
          rng = np.random.default_rng(464); n = 2000
          base = rng.normal(20, 3, n); t = rng.random(n) < .5
          final = base + np.where(t, 6, 5) + rng.normal(0, 1, n)
          die = (~t) & (rng.random(n) < (base < 19) * 0.5)
          locf = np.where(die, base, final)
          gap_locf = float(locf[t].mean() - locf[~t].mean())
          gap_cc = float(final[t & ~die].mean() - final[(~t) & ~die].mean())
          result = {"rule_gap": abs(gap_locf - gap_cc)}
        expect:
          - {key: rule_gap, min: 1.0}
      - kind: boundary
        shows: "no deaths — the rules coincide exactly, and the choice is truly inert"
        code: |
          rng = np.random.default_rng(464); n = 2000
          base = rng.normal(20, 3, n); t = rng.random(n) < .5
          final = base + np.where(t, 6, 5) + rng.normal(0, 1, n)
          die = np.zeros(n, bool)
          locf = np.where(die, base, final)
          gap_locf = float(locf[t].mean() - locf[~t].mean())
          gap_cc = float(final[t & ~die].mean() - final[(~t) & ~die].mean())
          result = {"rule_gap": abs(gap_locf - gap_cc)}
        expect:
          - {key: rule_gap, value: 0.0, tolerance: 0.000001}
      - kind: converse
        shows: "EQUAL death rates in both arms, outcome-dependent in one — equal rates do not make the rules agree"
        code: |
          rng = np.random.default_rng(464); n = 2000
          base = rng.normal(20, 3, n); t = rng.random(n) < .5
          final = base + np.where(t, 6, 5) + rng.normal(0, 1, n)
          die_t = t & (final < np.quantile(final[t], .2))
          die_c = (~t) & (rng.random(n) < .2)
          die = die_t | die_c
          locf = np.where(die, base, final)
          gap_locf = float(locf[t].mean() - locf[~t].mean())
          gap_cc = float(final[t & ~die].mean() - final[(~t) & ~die].mean())
          result = {"rate_diff": float(abs(die[t].mean() - die[~t].mean())),
                    "rule_gap": abs(gap_locf - gap_cc)}
        expect:
          - {key: rate_diff, max: 0.03}
          - {key: rule_gap, min: 0.5}
    rejects:
      - "an equally defensible rule"
      - "equally defensible alternative, and the gap"
    requires:
      - "post-treatment event"
    # (former allow "Resist calling that an equally defensible" deleted as
    # inert — the ch32 sentence trips no reject on its own, round-5 G-B)
    allow_reversals:
      - "That is an equally defensible rule despite the objections."

  - id: ai-cannot-execute
    defect: >-
      "An AI tool cannot run the code" — capability depends on the environment;
      what is missing from a bare claim is the execution record.
    estimand: >-
      A capability claim scoped to the CONFIGURED environment; the researcher
      demands the execution record, not a blanket denial.
    counterexample: >-
      ch32's verification move — ask for the run's inputs, outputs, and seed
      instead of asserting the tool cannot run anything.
    concept_check:
      anchor: {file: "book/part6-after-conference/32-replication-and-reproduction.qmd", locator: "execution record"}
      question: >-
        A reviewer says "the AI cannot run code, so the results are
        unchecked." What is wrong with that sentence?
      answer: >-
        Capability depends on the environment; what the researcher demands is
        the execution record — inputs, outputs, seed — not a blanket denial.
    cases:
      - kind: positive
        fixture: "An AI cannot run the code."
        verdict: caught
      - kind: boundary
        fixture: "In this disconnected environment, the configured reviewer role cannot run the code, so ask for the record instead."
        verdict: permitted
      - kind: converse
        fixture: "The tool cannot run code."
        verdict: caught
    reject_patterns:
      - pattern: "(an? ai|the tool|the model|neither|it|a chatbot)\\b[^.]{0,25}((cannot|can't|could not|can never)|(?<=neither )can) (run|execute)[^.]{0,15}(the )?code"
        why: "a blanket capability denial; an agent with an execution environment can run code"
        catches:
          - "Neither can run the code."
          - "An AI cannot run the code."
          - "The tool cannot run code."
        permits:
          - "In this disconnected environment, the configured reviewer role cannot run the code, so ask for the record instead."
          - "This reviewer role does not execute anything."
    requires:
      - "execution record"

  - id: artifact-verbs
    defect: >-
      One verb doing three jobs — redesigns said to "detect" artifacts, and
      checks said to lower "the chance" an existing result is an artifact.
      Design prevents or removes; diagnostics detect; checks update concern.
    estimand: >-
      Three distinct actions — a redesign PREVENTS or REMOVES an artifact, a
      sensitive diagnostic DETECTS it, and a post-hoc check UPDATES CONCERN as
      far as its sensitivity reaches. A produced result's status is fixed;
      only the evidence about it moves (round-4 S1).
    counterexample: >-
      ch13's slot study — the redesign renders every slot identically and logs
      impressions server-side (prevention), while the probes that follow are
      diagnostics.
    concept_check:
      anchor: {file: "notebooks/student/nb07_experimental_descriptive_student.ipynb", locator: "sensitive diagnostic"}
      question: "Does a redesign detect the artifact it targets?"
      answer: >-
        No — a redesign prevents or removes it; a sensitive diagnostic
        detects it; a post-hoc check updates concern as far as its
        sensitivity reaches.
    cases:
      - kind: positive
        fixture: "Could each redesign actually detect the artifact it targets?"
        verdict: caught
      - kind: boundary
        fixture: "Power is how often the design detects a real effect, and it means nothing until you say how you would decide."
        verdict: permitted
      - kind: converse
        fixture: "Our design detects instrument effects before they contaminate the outcome."
        verdict: caught
    reject_patterns:
      # Two one-sided patterns, because artifact context can sit on EITHER
      # side of the verb (round-5 G-B: "For demand effects, the redesigned
      # protocol detects…" slipped past a context-after-only pattern).
      - pattern: "(redesign(ed)?s?( protocols?)?|(the|our|your|their|this|each|a|my|his|her|its) designs?)[^.]{0,40}\\b(detects?|able to detect)\\b[^.]{0,45}(artifact|artefact|demand|instrument)"
        why: "a redesign prevents or removes an artifact; detection is a diagnostic's job"
        catches:
          - "Could each redesign actually detect the artifact it targets?"
          - "The design must be able to detect demand effects."
          - "Our design detects instrument effects before they contaminate the outcome."
          - "My design detects instrument effects before they contaminate the outcome."
        permits:
          - "Does each redesign prevent or remove the artifact it targets?"
          - "The redesign renders every slot identically and logs impressions server-side."
          # POWER language is legitimate: a design detecting a real EFFECT is
          # statistics, not the artifact confusion this family targets.
          - "Power is how often the design detects a real effect, and it means nothing until you say how you would decide."
          - "Power: how often the design would actually detect the effect, under a stated decision rule."
      - pattern: "(artifact|artefact|demand|instrument)[^.]{0,60}(redesign(ed)?s?( protocols?)?|(the|our|your|their|this|each|a|my|his|her|its) designs?)[^.]{0,40}\\b(detects?|able to detect)\\b"
        why: "same confusion with the artifact named before the design verb"
        catches:
          - "For demand effects, the redesigned protocol detects whether participants change their answers."
          - "Against instrument effects, the design detects the drift as it happens."
          - "For demand effects, my design detects the shift."
        permits:
          - "For demand effects, the redesign is prevention: render every arm identically."
          - "Power is how often the design detects a real effect, and it means nothing until you say how you would decide."
      - pattern: "lowers? the chance that (your|the) result"
        why: "a check cannot change whether an existing result is an artifact; it updates concern/evidence"
        catches:
          - "How do you lower the chance that your result is an artifact of your procedure?"
          - "The shuffle lowers the chance that the result is an artifact."
        permits:
          - "How do you lower your concern, as far as the checks were sensitive, that your result is an artifact of your procedure?"
    requires:
      - "prevent or remove"

