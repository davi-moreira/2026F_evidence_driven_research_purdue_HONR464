# COURSE_LAB_NOTES.yml — what each course lab does (GENERATED once,
# then authored here). Rendered into book/for-instructors.qmd by
# scripts/build_course_adoption.py. Keyed by lesson id.

ai-arm-not-brain: In the lab you run a small seeded simulation showing why how confident
  a source *sounds* tells you nothing about whether it is real, then take one topic
  you care about, ask an AI for scholarly sources, and verify each by retrieving
  it yourself.
research-director: In the "safe to delegate, verify first, or never delegate" practice
  you sort five real research tasks into the three buckets and defend each call,
  and at the Human-Only Checkpoint you close the AI and name, for your own project,
  two decisions you will never hand over.
sdiivdd: 'There you run the protocol live: you catch a fabricated citation by retrieving
  it yourself, then catch a confident summary that overstates a number the data
  never held. Both are the Inspect and Verify steps under real pressure.'
responsibility-ownership: 'There you sort real research tasks by how safely they
  delegate, catch a live citation by retrieving it yourself, and fill your first
  AI Research Ledger row: the record that turns "I checked it" into something you
  can show.'
curiosity-to-problem: You will watch one curiosity sharpen the instant it touches
  real survey columns, then walk your own curiosity from your nb01 map down the
  funnel, draft two candidate problems, and defend the one you keep.
question-kinds: There you walk your own curiosity down to a question, watch a naive
  keyword sorter get fooled on a deck of eight questions, and place your own question
  on the compass in the shape you will reuse every time you declare a design.
research-builds: In the lab you watch a pile of fifteen AI citations collapse to
  the few that survive retrieval, build an evidence map in code, and run the retrieval-verification
  loop on your own claim.
verifying-prior-evidence: In the lab you run the retrieval-verification loop on
  your own claim and watch a simulation collapse a tidy pile of fifteen AI citations
  down to the handful that survive retrieval, then build an evidence map whose one
  empty square is your gap.
mida: There you build a small simulated world, write its four MIDA parts, and watch
  what happens to your answer when a data strategy quietly stops matching the inquiry.
uncertainty-foundations: There you write your own design's four parts and watch
  the pile of answers move when you change one of them.
declare-diagnose: In the lab you declare the notebook's mentoring design in a few
  lines of Python, run it thousands of times to read its bias, variance, and power
  with your own eyes, then watch one redesign rescue a fair-but-powerless study
  while a confounded twin stays wrong at any sample size.
ethics-data-governance: There you run the re-identification check on your own planned
  columns and find out which ones you can drop.
observational-descriptive: In the lab you treat a real voter file as a known world,
  draw random samples and one convenience channel from it, and watch the random
  draws cluster on the truth while the convenience channel misses the true mean
  age by nearly twelve years. Then you run a nonresponse stress test that shows
  a clean estimate drifting off the truth.
observational-causal: In the lab you build a small world where *you* set coffee's
  true effect, plant a hidden confounder, and watch a naive comparison inflate a
  true +1.0 to about +3.1, then recover the truth by adjusting for the confounder
  you can see. You then analyze a *real* natural experiment, the Hajj visa lottery
  from Clingingsmith, Khwaja and Kremer (RDSS ch. 16), as a difference in means
  and state exactly what its as-if-random assignment lets you claim, and over whom.
experimental-descriptive: In it you read a real survey experiment as a measurement
  of a settled attitude, recover a hidden prevalence with a list experiment that
  a direct question cannot reach, and then declare, diagnose, and redesign a measurement
  experiment so a number built mostly of demand and instrument artifacts falls back
  onto the construct it was supposed to report.
prediction-generalization: In the lab you sign the four-part contract on a real
  dataset, score an honest baseline first, then build a leak on purpose so you feel
  a fake score climb and learn to hunt it by correlation and timing before you retrain
  clean.
experimental-causal: There you analyze a real get-out-the-vote field experiment,
  estimate the effect as a difference in means, and put a randomization-inference
  interval around it. Then you watch attrition, noncompliance, and spillover each
  bend a clean estimate, so you learn to name which quantity actually survives.
hybrid-complex-designs: 'There you analyze a real get-out-the-vote field experiment
  and meet the complications this chapter names arriving in real data: attrition
  thinning the sample, spillover leaking treatment across neighbors, and inference
  that has to respect how the assignment was actually drawn. The lab handles them
  one at a time; this chapter shows how designs that combine such pieces stay readable.'
data-provenance: In the lab you run the retrieval-verification loop on a claim from
  your own project, watch a tidy pile of AI-suggested citations collapse to the
  few that survive retrieval, and follow citation chains backward and forward into
  an evidence map whose one empty square is a gap you can defend, because every
  source around it is one you opened yourself.
measurement: 'There you build a concept → construct → indicator ladder for your
  own key measure, and you watch a single indicator flatten reality firsthand: a
  survey''s mean of 4.43 sits in a dip between two peaks, so the average describes
  almost no real respondent. An index is an operationalization, and every operationalization
  hides what it averages over.'
ai-as-programmer: 'There you hand cells to your AI and make it earn your trust:
  you ask it to explain, line by line, why ten random samples huddle around a frame''s
  true mean while one convenience channel misses it by nearly twelve years, then
  confirm the range it quotes against the numbers your own cell actually printed.
  That gap between the tool''s fluent story and your printout is this chapter''s
  lesson, run live.'
ai-analytical-assistant: There you take a real get-out-the-vote field experiment
  and hand your assistant the first pass — the headline estimate, the balance and
  attrition checks — then verify each returned number against the data before it
  enters your ledger, which is this chapter's division of labor run live.
robustness-sensitivity: There you rerun one headline gap across a pre-listed grid
  and read its specification curve, watch specification searching manufacture a
  "significant" result from data with no real effect, and run a null check and a
  leave-one-out influence check on seeded code so you feel the difference between
  a robust finding and a fragile one.
negative-tests: 'There you run a placebo test on a real survey estimate: you throw
  away the true grouping, replace it with a coin-flip label 500 times, and watch
  the fake gaps cluster tightly at zero while the real result sits far outside that
  cloud. Then a leave-one-out check shows you whether a single data point is quietly
  carrying the whole finding.'
ai-adversarial-reviewer: You rerun one estimate across a pre-listed grid of eight
  specifications, watch specification searching manufacture a significant result
  from pure noise, run a placebo and a leave-one-out influence check, then hand
  your analysis to a human, one AI, and a panel of AI models and adjudicate every
  flag they raise against the data.
false-confidence: In the lab you pre-list a robustness grid, run placebo and influence
  checks on a finding, then adjudicate three confident AI reviewers against the
  data and watch two of their three flags dissolve the moment a check touches them
  — confidence meeting evidence, which is this chapter's whole subject.
results-to-claims: There you run a gallery-walk audit on one headline figure drawn
  two ways from the same numbers, rehearse a three-lens oral defense, and lock every
  number to its cell and every citation to a real source before your page becomes
  final.
claim-evidence-tables: 'There you run the final-lock audit on a real poster: you
  trace each number to the cell that produced it, confirm each citation resolves
  to a source you opened yourself, and turn loose claims into locked, backed rows.'
research-posters: There you draw one headline figure two ways from the same numbers,
  watch a truncated axis inflate a small gap several times over, and run the four
  audits plus accessibility until each one names a located, fixable hit on the board.
poster-criticism: In the lab you draw one honest set of pilot numbers two ways and
  read the exaggeration factor your own cell prints, run the four audits plus accessibility
  on a sample poster, map the three defense lenses, and log the hits your own poster
  received into your final-poster lock list.
research-pitches: There you run a pacing calculator that turns a script's word count
  into seconds of speech, so you can size each layer honestly, then draft and stress-test
  your own three pitch layers against the one rule.
difficult-questions: There you run an apology-spiral detector that counts self-erasing
  words in three sample deliveries, then paste in your own uncertainty-and-limitations
  sentence and drive its flag count to zero. You also build your five-question bank
  and rehearse the causal reply against your own project.
ai-disclosure: There you code the AI-use questions you were asked as data and fill
  the AI Research Ledger that becomes the disclosure you defend. The final defense
  asks you to name what you delegated to Gemini and the specific check that decided
  whether you accepted, changed, or rejected it.
replication-reproduction: 'There you cold-reproduce a real field experiment''s headline
  number from its files alone, then run the same three audits you just saw: you
  line each written claim against the output behind it, move the number with an
  undisclosed specification, and widen its interval by respecting the clustering
  the write-up ignored.'
poster-to-note: There you score the evidence density of two paragraphs, build a
  results hierarchy by watching a tight interval earn the top while a forty-row
  interval waits at the back, and run an auditor that hunts the five ways a reproducibility
  capsule breaks.
research-packages: There you build `audit_capsule`, watch it flag all five sins
  in a deliberately broken package and none in a clean one, then paste your own
  capsule's key lines in and fix what it catches.
managing-ai-agents: There you build the worker-critic workflow as a directed graph,
  read its critical-path depth and parallel width straight off the code, and watch
  the path grow by one round the moment you make a critic wait on another critic.
  Then you decompose your own draft into scoped roles and defend the wiring you
  chose.
conflicting-agents: There you wire a worker-critic workflow on a real draft, then
  simulate two four-reviewer teams and watch a shared blind spot turn unanimous
  agreement into false confidence you can measure.
final-portfolio: There you wire a worker-critic team, run a seeded simulation showing
  four look-alike reviewers miss a real flaw far more often than four independent
  ones, then draft the four parts of your own portfolio and stage your evidence
  defense.
