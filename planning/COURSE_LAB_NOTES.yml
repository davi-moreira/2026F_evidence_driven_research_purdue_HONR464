# COURSE_LAB_NOTES.yml — what each course lab does (authored here; rendered
# into book/for-instructors.qmd by scripts/build_course_adoption.py).
# Keyed by lesson id. D49: each note describes the notebook it LINKS to.

ai-arm-not-brain: In the lab you run a small seeded simulation showing why how confident
  a source *sounds* tells you nothing about whether it is real, then take one topic
  you care about, ask an AI for scholarly sources, and verify each by retrieving
  it yourself.
research-director: In the "safe to delegate, verify first, or never delegate" practice
  you sort five real research tasks into the three buckets and defend each call,
  and at the Human-Only Checkpoint you close the AI and name, for your own project,
  two decisions you will never hand over.
sdiivdd: 'There you run the protocol live: you catch a fabricated citation by retrieving
  it yourself, then catch a confident summary that overstates a number the data
  never held. Both are the Inspect and Verify steps under real pressure.'
responsibility-ownership: 'There you sort real research tasks by how safely they
  delegate, catch a live citation by retrieving it yourself, and fill your first
  AI Research Ledger row: the record that turns "I checked it" into something you
  can show.'
curiosity-to-problem: You will watch one curiosity sharpen the instant it touches
  real survey columns, then walk your own curiosity from your nb01 map down the
  funnel, draft two candidate problems, and defend the one you keep.
question-kinds: There you walk your own curiosity down to a question, watch a naive
  keyword sorter get fooled on a deck of eight questions, and place your own question
  on the compass in the shape you will reuse every time you declare a design.
research-builds: In the lab you watch a pile of fifteen AI citations collapse to
  the few that survive retrieval, build an evidence map in code, and run the retrieval-verification
  loop on your own claim.
verifying-prior-evidence: In the lab you run the retrieval-verification loop on
  your own claim and watch a simulation collapse a tidy pile of fifteen AI citations
  down to the handful that survive retrieval, then build an evidence map whose one
  empty square is your gap.
mida: There you build a small simulated world, write its four MIDA parts, and watch
  what happens to your answer when a data strategy quietly stops matching the inquiry.
uncertainty-foundations: There you write your own design's four parts and watch
  the pile of answers move when you change one of them.
declare-diagnose: In the lab you declare the notebook's mentoring design in a few
  lines of Python, run it thousands of times to read its bias, variance, and power
  with your own eyes, then watch one redesign rescue a fair-but-powerless study
  while a confounded twin stays wrong at any sample size.
ethics-data-governance: There you run the re-identification check on your own planned
  columns and find out which ones you can drop.
observational-descriptive: 'In nb05''s route hub you meet this route as one of five
  cards: what a description without intervention can estimate, and the claim it
  never licenses. If it is YOUR route, you apply its full lesson to your project
  and defend the choice against one assigned contrast.'
observational-causal: 'In nb05''s route hub you weigh this route''s card: a causal
  effect without assignment demands an identification argument, and a causal question
  with weak data stays causal — currently unidentified, never relabeled. Your-route
  students carry the argument into their pathway declaration.'
experimental-descriptive: 'In nb05''s route hub you meet the card that surprises
  most people: random assignment used to MEASURE, not to estimate an effect. The
  jigsaw advocate for this route explains why assignment does not automatically
  make an inquiry causal.'
prediction-generalization: 'In nb05''s route hub you meet prediction as its own
  answer objective: generalizing to unseen cases, licensed by held-out honesty rather
  than identification. Your-route students commit to the declared-protocol discipline
  their later weeks will verify.'
experimental-causal: 'In nb05''s route hub you weigh the assigned-intervention card:
  what randomization licenses, what attrition can still break, and what the route
  costs to run. Your-route students carry the design into their declaration.'
hybrid-complex-designs: In nb05 you add the hybrid overlay only if your design has
  distinct stages, naming the route and claim licence at each stage. If your design
  has one stage, this lesson stays a reference.
data-provenance: In nb06 you document how your data actually reached you — who produced
  them, how, when, under what terms — and recheck your permission determination
  against the file that arrived, not the file you planned for.
measurement: In nb06 you build the concept → construct → indicator chain for your
  own project, check reliability on items (never by splitting respondents), argue
  validity as interpretation-and-use, and version your Contract where the settled
  measure differs from the provisional one.
ai-as-programmer: In nb07 you translate your declared analysis into an executable
  pipeline, verify every delegated line against a known answer, and produce a first
  result with its uncertainty. The same week's second lecture attacks that result
  from a clean restart.
ai-analytical-assistant: In nb07 you demand the execution record, restart and run
  all from a fresh state, rederive key numbers independently, and check every claim
  against a specific output — the difference between a result and a story about
  one.
robustness-sensitivity: In nb08 you pre-list a robustness grid before seeing any
  outcome, run commensurable panels, and learn why a same-sign specification spread
  is a direction plus a range, never an uncertainty interval.
negative-tests: In nb08 you run licensed negative tests and read each against what
  an honest check could detect — a permutation check against its justified null,
  a negative control against its own estimate and uncertainty — never against exact
  zero.
ai-adversarial-reviewer: In nb08 you commission an adversarial AI review of your
  own analysis and adjudicate every flag against a real data check, cataloguing
  the confident wrong flag that proves confidence is not evidence.
false-confidence: 'In nb08 you close the stress-test by hunting false confidence:
  correlated reviewers agreeing for the same wrong reason, checks that cannot fail,
  and the complete-case contrast narrated as an effect among stayers.'
results-to-claims: In nb09 you convert audited results into claims that carry their
  kind and their reach, and catch the quiet verb upgrades that turn an association
  into a cause under compression.
claim-evidence-tables: 'In nb09 you build the claim-evidence table for your project:
  every claim a row naming its evidence, its verification, and its boundary. A claim
  with no row does not ship.'
research-posters: In nb10 you write your venue contract and adapt the bounded note
  into the artifact that satisfies it, labelled as the preliminary edition it honestly
  is.
poster-criticism: 'In nb10 you run the criticism gallery on your own artifact: what
  the adaptation may lose, what it may never lose, and whether every number still
  traces to a cell.'
research-pitches: 'In nb10 you build the layered pitch under the one rule that governs
  it: compression never expands the claim.'
difficult-questions: In nb10 you rehearse the hardest fair questions with spoken
  uncertainty and the defend-or-concede call.
ai-disclosure: In nb09 you draft your AI disclosure statement FROM your ledger,
  never from memory, and check it against what the ledger actually records — including
  the delegations you rejected.
replication-reproduction: 'In nb11 you cold-run your own work from a clean environment,
  reproduce the uncertainty as well as the point estimate, and label an author''s
  own rerun honestly: a solo proxy, never independent verification.'
poster-to-note: In nb09 you write the bounded research note itself — the core artifact
  every later genre adapts — with uncertainty in the same eye-span as the claim.
research-packages: In nb11 you assemble the reusable package — README, data or an
  access recipe, code, environment record, licence — and it is those reproduced
  numbers that lock onto the poster.
managing-ai-agents: In nb12 you wire worker and critic roles for the final push
  and learn why four agreeing agents can share one blind spot.
conflicting-agents: 'In nb12 you resolve a live conflict between agents by escalating
  to the only reviewer who can settle it: a human rerunning the check.'
final-portfolio: In nb12 you run the release audit on your own package, decide release
  or withhold pending a named repair, and write the next-study agenda as directions,
  never findings.
