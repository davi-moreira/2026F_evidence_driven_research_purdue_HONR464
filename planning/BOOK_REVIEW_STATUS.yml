# BOOK_REVIEW_STATUS — per-chapter instructor-review registry (D26).
#
# Every chapter carries an under-development banner until Davi reviews it.
# When he reports a chapter reviewed: set reviewed: true and the date, run
#   .venv/bin/python scripts/update_chapter_review_banners.py
# and re-render the three books (site first, then book/, book-pt/, book-es/).
# The script inserts the banner into every UNreviewed chapter in all three
# editions and removes it from reviewed ones. Idempotent.
