# BOOK_ARCHITECTURE.yml — the book-only identity manifest (D35 Phase 2, DRAFT v0)
#
# THE canonical source of lesson identity for EDR|AI. Once adopted:
#   - `lesson:` ids are IMMUTABLE and semantic — independent of display order,
#     filename prefix, and chapter number. Citations, cross-references, and
#     generated artifacts key off the id, never the ordinal.
#   - Display numbering is derived at render time from `order:`; inserting a
#     lesson shifts displayed numbers but changes NO id and NO existing URL
#     (acceptance test A10: insert a test lesson → nothing else moves).
#   - `source:` is the EN file (source of truth); PT/ES paths mirror it.
#   - `station:` assigns each lesson to its D35 practice station (1–12);
#     `role:` marks how a linear reader meets it (core | branch | contrast |
#     optional). Branch lessons: the five pathway forms in Station 5 and the
#     four genre adaptations in Station 10.
#   - `legacy_aliases:` preserves any RETIRED path so redirects can be
#     generated (D35 skipped the 111 notebook shims; HTML aliases only).
#   - BOOK_MAP.md becomes GENERATED from this file (Phase 2 tooling); the
#     course-adoption mapping lives in COURSE_BOOK_CROSSWALK.yml, NEVER here
#     (independence axiom: no course facts in the book manifest).
#
# status: draft-v0 — schema pending the Phase-2 design critique; the two
# `planned` lessons are inserted only AFTER the generator/validator consume
# this manifest (D35: identity layer precedes the new lessons).
#
# Validator contract (to be implemented in the Phase-2 rewrite):
#   1. every lesson file exists ×3 editions (except status: planned);
#   2. ids unique + immutable (diff against git HEAD: an id may be added,
#      never renamed or reused);
#   3. order strictly increasing within a part; parts contiguous;
#   4. every station 1–12 non-empty; every core lesson reachable in a linear
#      read; branch/optional lessons attached to a station;
#   5. course-leakage scan (acceptance test A2) over every `source:` body;
#   6. crosswalk coverage: every lesson id appears exactly once in
#      COURSE_BOOK_CROSSWALK.yml readings (the 16 anchors partition lessons);
#   7. prerequisite timing: no Contract field assessed before its teaching
#      lesson (matrix in BOOK_ASSESSMENTS.yml).

