# BOOK_ARCHITECTURE.yml — the book-only identity manifest (D35 Phase 2)
#
# THE canonical source of lesson identity for EDR|AI. Revised to schema 1.0
# per the Phase-2 design critique (2026-07-31,
# _adm/codex_reviews/2026-07-31_phase2-manifest-schema/verdict.md):
#
#   - `id` values (lessons AND stations) are IMMUTABLE and semantic —
#     independent of display order, filename prefix, and chapter number.
#     Citations, cross-references, review keys, and generated artifacts key
#     off the id, never the ordinal.
#   - Display numbering is a DERIVED LABEL from `rank` (A1 ruling: ids,
#     canonical URLs, review keys, and artifact keys are stable; display
#     numbers may change when a lesson is inserted). `rank` is mutable,
#     globally unique, gaps are editorial convenience only.
#   - `url_path` is the IMMUTABLE canonical HTML path. Existing lessons keep
#     their legacy numeric paths as opaque identifiers (D35 promises stable
#     HTML paths); new lessons take semantic filenames. Tooling must never
#     parse identity or sequence out of a filename prefix.
#   - Identity lifecycle (A2 ruling): a released id is NEVER deleted or
#     reused — it moves to `tombstones:` with a disposition. The identity
#     baseline is `identity_epoch`; validators compare against the last
#     released snapshot, not the working tree.
#   - Edition divergence (A3 ruling, D36): `editions:` declares per-edition
#     lifecycle. While an edition is `frozen`, tooling validates snapshot
#     integrity only — it neither requires current-EN coverage nor writes.
#     A lesson absent from an edition routes language navigation to that
#     edition's index.
#   - Stations (A4 ruling) carry immutable slug ids, a mutable rank, their
#     checkpoint ids, and a workbook state. Lessons reference
#     `station: <slug>`. Route/genre tokens come ONLY from the registries
#     below; `branch:` free-forms are retired.
#   - The A2 course-leakage policy lives in planning/BOOK_LEAKAGE_POLICY.yml,
#     never inline in tooling.
#
# Validator contract (Phase-2 build, revised per the critique):
#   1. per-edition existence: every lesson's (edition, state) pair matches
#      the files on disk; `planned` lessons appear in NO public output;
#   2. id uniqueness across lessons, stations, tombstones; no reuse of a
#      tombstoned id; renames forbidden (diff vs the identity epoch);
#   3. `rank` globally unique; part ranks strictly ordered; every lesson's
#      part exists;
#   4. route coverage: every `pathways`/`genres` token used by a lesson is
#      registered; every core lesson appears on every route; each station
#      has >= 1 lesson and >= 1 checkpoint;
#   5. A2 leakage scan per BOOK_LEAKAGE_POLICY.yml over active EN sources;
#   6. crosswalk coverage: every ACTIVE lesson id has exactly one
#      home-anchor disposition in COURSE_BOOK_CROSSWALK.yml (planned
#      lessons: planned_home_anchor only);
#   7. prerequisite timing: delegated to BOOK_ASSESSMENTS.yml's
#      learning_progressions once checkpoints carry course events.

schema_version: "1.0"
status: revised-per-critique   # -> review-approved when the validator passes A10
identity_epoch: null           # set to the migration commit when tooling adopts ids

editions:
  en:
    root: book
    lifecycle: current
    generation: enabled
  pt-BR:
    root: book-pt
    lifecycle: frozen          # D36 — frozen until the translation pass
    snapshot_commit: fdf882d   # notices included; sources byte-frozen since
    generation: disabled
    missing_lesson_target: index
  es:
    root: book-es
    lifecycle: frozen
    snapshot_commit: fdf882d
    generation: disabled
    missing_lesson_target: index

