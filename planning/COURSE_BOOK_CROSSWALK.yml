# COURSE_BOOK_CROSSWALK.yml — the HONR 46400 adoption map for EDR|AI
# (D35 Phase 2 schema; schema 1.1 + Option 2 rows per D41, 2026-08-03 —
#  the studio-first route-selective semester; blueprint + merge record in
#  _adm/codex_collab/2026-08-03_option2-implementation/)
#
# The ONLY place course facts and book structure meet (independence axiom:
# course structures constrain this crosswalk, never the book's spine). Once
# machine-verified, this file GENERATES: the For Instructors adoption table,
# milestone Book Anchors, and course reading lists (BOOK_MAP.md becomes a
# generated projection). Rows reference lessons and stations by their
# immutable ids from BOOK_ARCHITECTURE.yml, never by number.
#
# Schema (C1–C4 rulings; 1.1 additions marked NEW):
#   - `assignments:` are TYPED objects, one per lesson-adoption event:
#       {lesson, requirement: required|recommended|route-required|optional,
#        purpose: first-read|revisit, primary_lab: true|false,
#        home_anchor: true|false}
#     HOME-ANCHOR RULE: every ACTIVE lesson has exactly one home_anchor row
#     across the file (the partition); revisit assignments are a separate
#     multiset and never anchor. `planned` lessons use `planned_home_anchor:`
#     in the row instead — they generate NOTHING until active.
#     Course policy note (amended by D41): the course adopts the book's
#     `optional`-role lessons as REQUIRED reading EXCEPT route-conditional
#     lessons — `hybrid-complex-designs` binds only when the student's
#     design has stages (the book's own role condition, D40).
#   - `station_events:` replace open/advance/close with real event semantics:
#       {station: <slug>, event: introduce|practice|checkpoint|revisit,
#        checkpoint: <id, checkpoint/revisit only>, at: <course event>}
#     `at` values: reading-due | studio | milestone-submission (the row's
#     milestone unless stated). A checkpoint is versioned, never
#     irreversible; it FIRES once (first version) and later course
#     submissions are `revisit` events carrying the next version.
#   - `gates:` are objects: {id, requires, before_event, evidence, blocking}.
#   - NEW `book_milestones:` — the D40 naming bridge: which book Milestone
#     (by station id) this course submission presents, as which version:
#       {station, relationship: checkpoint|revisit|practice,
#        version_label, contribution_refs: [lesson ids in that station]}
#     Generators render "Book Milestone N — <milestone_title> (<label>)"
#     from station rank + BOOK_STATIONS.yml authored fields.
#   - NEW `route_selection:` (M4 only) — the Option 2 route-hub rule.
#   - NEW `supporting_gate_milestones:` — book milestones a course
#     submission enacts as a GATE without presenting them as its artifact.
#   - There is NO authored machine_verification flag (C4): consumers must
#     RUN the validator; provenance lives in a generated lock file
#     (planning/.crosswalk_lock.json — hashes + validator version), written
#     only by the validator itself.
#
# D41 transition note: these rows are ACTIVE. nb05–nb10 cell sources are
# rebuilt to the new topics in the D41 content phase before the Aug 24
# launch; until that rebuild lands, notebook display titles keep their
# pre-Option-2 topics (slugs and filenames are permanent compatibility ids
# and never change).

schema_version: "1.1"
status: option2-active-d41

