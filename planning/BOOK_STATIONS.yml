# BOOK_STATIONS.yml — authored content for the 12 practice studios — 'stations' in the machine layer (D35 §3)
#
# Two grains: lessons are READING units (BOOK_ARCHITECTURE.yml), studios are
# PRACTICE units. This file holds what a studio TEACHES YOU TO DO; studio
# identity, checkpoint ids, and lesson membership live in the architecture
# manifest and are never restated here.
#
# `scripts/build_station_pages.py` generates one page per studio into
# book/studios/ plus its workbook notebook, and the architecture validator
# requires every studio in the manifest to have an entry here.
#
# Every studio page carries the same spine:
#   purpose  -> what you can defend when you leave
#   produces -> the versioned checkpoint artifact (never a locked pass, D35)
#   steps    -> the practice, in order, each one a thing you write or run
#   rails    -> how the four persistent rails apply HERE (specifics only;
#               the generator states the rails themselves)
#   revisit  -> what later evidence sends you back to this studio
#
# D35: checkpoints are VERSIONED, not irreversible. A checkpoint produces
# v0, v1, v2 with reasons attached. Anything else contradicts the book's own
# declare -> diagnose -> redesign method.

schema_version: "1.0"

stations:
  - id: govern-the-work
    purpose: >-
      Decide how you and your tools will work before there is anything at
      stake, so the rules exist when the pressure arrives.
    produces: >-
      A responsibility statement naming what you will never delegate, your
      AI and data-handling rules, your opened AI Research Ledger, and an
      early red-flag screen of your project idea.
    steps:
      - "Write your responsibility statement: the decisions that stay yours no matter how good the tool gets."
      - "Write your AI working rules: what you will delegate, what you will always verify, and how you will record both."
      - Open your AI Research Ledger and enter your first row, today, for any tool you have already used on this project.
      - "Run the red-flag screen on your idea: is it answerable, is it yours to ask, and could you defend attempting it."
    rails:
      ethics: State now what data you expect to touch, so the ethics studio has something to check against.
      evidence: Decide where your project's files will live before you have any.
      ai: This studio opens the ledger every other studio appends to.
      uncertainty: Write what you currently believe about your question, so later revisions are visible as revisions.
    revisit: >-
      Any change in your tools, your data source, or your collaborators
      sends you back here for a new version.
    milestone_title: "Your working agreement"
    milestone_reason: >-
      Every studio after this one asks you to delegate real work to AI and
      then stand behind the result under your own name. The rules for that
      cannot be improvised under deadline pressure; they have to exist
      before anything is at stake. This first milestone writes them down:
      what stays yours, what gets delegated, and how every delegation gets
      recorded and checked. The rest of the book leans on it. Every later
      milestone appends to the ledger you open here, and your final defense
      in Studio 12 reads this agreement back to you.
    hands_forward: >-
      Milestone 2 takes the idea that survived your red-flag screen and,
      under these working rules, turns it into a question whose answer you
      could recognize.
    contributions:
      ai-arm-not-brain: >-
        your opened AI Research Ledger, three genuine curiosities, and one
        first AI exchange already logged and verified
      research-director: >-
        your delegation map: the road's tasks sorted into safe to delegate,
        delegate then verify, and never delegate
      sdiivdd: >-
        one complete SDIIVDD run on a checkable claim, with the
        verification you ran and what it caught
      responsibility-ownership: >-
        your ownership statement, your never-delegate list, and a first
        draft of your AI-use disclosure

  - id: frame-the-inquiry
    purpose: >-
      Turn a curiosity into a question whose answer you could recognize, and
      say what kind of answer it would be.
    produces: >-
      An objective, your units, outcomes and conditions, your target and
      reach, and a provisional claim boundary.
    steps:
      - State your objective in one sentence a stranger could repeat back.
      - Name your units, your outcome, and the conditions you are comparing or describing.
      - Declare kind and reach, and write the words in your question that fix each one.
      - "Write your provisional claim boundary: the sentence you hope to defend, and the sentence you will not be able to."
    rails:
      ethics: Note whether answering this question requires people, and flag it now.
      evidence: Nothing here is settled until Studio 3 checks it against what is already known.
      ai: If AI helped shape the question, the ledger records what you kept and what you rejected.
      uncertainty: A question with no recognizable answer cannot carry uncertainty; fix the question first.
    revisit: >-
      Studio 3 almost always sends you back here. That is the design, not
      a setback.
    milestone_title: "Your question, declared"
    milestone_reason: >-
      A research project is only defensible if its question fixes what
      would count as an answer. This milestone is where the fixing happens:
      you declare your objective, your units and outcome, your kind and
      reach, and the boundary of the claim you hope to make. Everything
      that follows revises this declaration rather than starting over. The
      contract in Studio 4, the pathway in Studio 5, and the claims in
      Studio 9 all trace back to the words you commit here.
    hands_forward: >-
      Milestone 3 holds this declaration up against what is already known,
      and it will usually send back a sharper version.
    contributions:
      curiosity-to-problem: >-
        your chosen research problem, scored on importance, feasibility,
        and contribution, red-teamed, with your expected answer on record
      question-kinds: >-
        your lead question placed by kind and reach, double-barrels split,
        with its comparison world written out if the question is causal

  - id: ground-in-evidence
    purpose: >-
      Find out what is already known, verify that it is actually known, and
      let it change your question.
    produces: >-
      An evidence registry of verified sources, your search log, an evidence
      map, and an explicit revision of your Studio 2 declaration.
    steps:
      - "Search deliberately and log every search: where you looked, what terms, what you found and did not."
      - Verify each source you intend to cite by retrieving and reading it, never by trusting a summary.
      - "Build the evidence map: what is settled, what is contested, what is missing."
      - "Write the revision: how your question changed, or a defended statement of why it did not."
    rails:
      ethics: Record the licence and terms of any dataset you found here, before you plan to use it.
      evidence: This studio IS the evidence rail's home; every later citation traces to this registry.
      ai: Every AI-suggested source is unverified until you have opened it yourself.
      uncertainty: Note where the literature disagrees; that disagreement is uncertainty you inherit.
    revisit: >-
      New evidence found at any later studio is registered here, not
      appended informally to a draft.
    milestone_title: "Your evidence base"
    milestone_reason: >-
      No question is asked in an empty room. Before you spend months
      answering yours, this milestone makes you find out what is already
      known, verify that it is actually known rather than merely repeated,
      and let the verified record change your question. It is also where
      the book's evidence rail becomes physical: the registry you assemble
      here is what every later citation traces back to, all the way to the
      release audit in Studio 12.
    hands_forward: >-
      Milestone 4 takes your revised question and the gap your evidence
      map exposed, and writes them into a research contract that can be
      diagnosed.
    contributions:
      research-builds: >-
        your candidate source list with a status column, seeded by your own
        search, an AI sweep, and hand snowballing, with a lead source marked
      verifying-prior-evidence: >-
        your verified sources, your evidence map with its quiet spot, and
        your gap written as one bounded sentence

  - id: declare-and-diagnose
    purpose: >-
      Write your design down as something specific enough to be diagnosed,
      then find out how it behaves before it costs you anything.
    produces: >-
      Research Contract v0 — objective, target estimand, population, setting
      and time, data strategy, measurement, warrant, answer strategy and
      uncertainty statement — plus your diagnosands, your permission status,
      and a redesign record.
    steps:
      - Write the four MIDA parts of your design so a stranger could run them.
      - State your estimand and estimator, and describe in words what would differ if the procedure ran again.
      - "Diagnose the design: what is its bias, how much does it wobble, and how often would it detect what you are looking for."
      - Run the permission determination and declare one status; if it is anything but cleared, name the authority and the date you asked.
      - Minimise your columns against the declared analysis, and check what a re-identification test would find.
      - Write the redesign record - what you changed after diagnosing, and why. A diagnosis that changed nothing is a diagnosis you should distrust.
    rails:
      ethics: The permission status produced here gates every later studio; nothing downstream may proceed past a stop.
      evidence: Your data strategy names actual sources from the Studio 3 registry, not source types.
      ai: Diagnosis is delegable; the choice of what to fix is not.
      uncertainty: This is where your uncertainty statement is first written down and first tested.
    revisit: >-
      Route diagnosis, measurement changes, permission rulings, and the
      realized data each produce a new Contract version with its reason.
    milestone_title: "Your research contract, v0"
    milestone_reason: >-
      This is the hinge of the book. Everything before it shaped a
      question; everything after it executes a design. The contract you
      write here (objective, estimand, population, data strategy,
      measurement, warrant, answer strategy, uncertainty) is declared
      before any result exists, so that later changes are visibly design
      or visibly drift. Diagnosing it on simulated data now, while
      changing your mind is still free, is what makes the declaration
      honest rather than decorative.
    hands_forward: >-
      Milestone 5 commits the contract to one research pathway and writes
      what that pathway can and cannot establish.
    contributions:
      mida: >-
        your MIDA declaration: model, inquiry, data strategy, and answer
        strategy, with the alignment sentence that ties them together
      uncertainty-foundations: >-
        your estimand and estimator, the repeat-run story behind them, and
        your uncertainty sentence next to its wrong twin
      declare-diagnose: >-
        your design diagnosis: bias, wobble, and power read from
        simulation, one redesign, and the honest call that followed
      ethics-data-governance: >-
        your declared permission status, your minimised column list, your
        AI boundary, and your four governance decisions

  - id: develop-the-pathway
    purpose: >-
      Commit to the research pathway your question and your licence actually
      support, and say what that pathway can and cannot establish.
    produces: >-
      Research Contract v1: objective by target and reach by data strategy by
      warrant, with the pathway declared and its limits written before any
      result exists.
    route_guide: |
      Five pathways run through this part of the book, and your question plus
      what you are allowed to do picks one. Read the row that fits, then read
      one that does not, so you can say why yours is right.

      | If your question asks | and you | your pathway is |
      |---|---|---|
      | how much, how many, or how distributed something is | observe the world as you find it | **observational descriptive** |
      | whether one thing causes another | observe the world as you find it | **observational causal** |
      | how much of a property exists, measured cleanly | assign conditions yourself to measure it | **experimental descriptive** |
      | whether an intervention works | assign conditions yourself | **experimental causal** |
      | what will happen to cases nobody has seen | fit and honestly score a forecast | **prediction** |

      Two cautions. Assigning conditions does not make your question causal:
      a randomized study can be measuring a property the world already has.
      And a causal question whose data cannot identify it stays causal — it
      becomes "causal, currently unidentified", never quietly descriptive.

      If your project combines pieces of several rows, read the complex-designs
      lesson as an overlay after you have declared your primary pathway.
    steps:
      - Use the route guide above to choose your pathway, then read that lesson and at least one that does not fit, so you can say why yours does.
      - "Declare your pathway and write the crossing that licenses it: what makes your comparison mean what you claim."
      - "Write the limits: what this pathway cannot establish no matter how clean the execution."
      - Update your claim boundary to match the pathway, and mark the change as a new Contract version.
    rails:
      ethics: A change of pathway can change your permission status; recheck rather than assume.
      evidence: Name the prior work that used this pathway on a comparable question.
      ai: Ask an assistant to argue for a different pathway, then answer the argument yourself.
      uncertainty: Different pathways carry different sources of uncertainty; name yours here.
    revisit: >-
      Realized data that will not support the declared pathway sends you
      back here before analysis, not after.
    milestone_title: "Your pathway, declared"
    milestone_reason: >-
      Five pathways run through this book, and your project takes exactly
      one as its primary road. This milestone makes the commitment
      explicit: which pathway, what licenses it, and what it cannot
      establish no matter how clean the execution. Declaring it now
      protects you later, because a result can only be defended from
      inside the pathway that produced it.
    hands_forward: >-
      Milestone 6 puts data and measurement under governance so the
      declared pathway has something trustworthy to run on.
    contributions:
      observational-descriptive: >-
        either your four boxes and selection diagram, if this is your
        pathway, or the classification drill that rules it out
      observational-causal: >-
        either your causal diagram with its leverage named and priced, or
        the drill that shows why this road is not yours
      experimental-descriptive: >-
        either your revealed-characteristic estimand with its demand and
        instrument threats named, or the drill run on your own question
      prediction-generalization: >-
        either your signed four-part forecasting contract with its
        boundary, or the plain line saying prediction is not your question
      experimental-causal: >-
        either your treatment, outcome, and potential outcomes with the
        nearest threat named, or the drill plus the confounder that blocks
        the causal reading
      hybrid-complex-designs: >-
        if your design has stages: the stage-by-stage map, its weakest
        link, and the one-sentence justification for keeping or cutting it

  - id: govern-data-measurement
    purpose: >-
      Establish where your numbers came from and whether they measure what
      you say they measure.
    produces: >-
      Provenance documentation, a data-management record, your measurement
      specification, and a route-specific permission recheck.
    acquisition_note: |
      This studio assumes data have reached you, and the cold pilot found
      that nothing before it made that happen. Settle acquisition first, in
      writing, before the steps below.

      Your permission status from Studio 4 decides your route.

      - **Cleared or formal determination granted.** Name your sampling
        frame, how you will reach those units, and what you will do about
        the ones you cannot reach. Non-response is a design fact, not an
        accident.
      - **Pending.** Do everything that does not touch people: build and
        pilot the instrument on yourself, write the analysis code against
        simulated data of the shape you expect, and wait.
      - **No authority to ask, or not authorized.** Take the no-permission
        route, which reaches every method in this book: published aggregate
        statistics, an openly licensed dataset with no individual records,
        or data you simulate yourself. Write down which you chose and what
        it costs you, because a simulated dataset can demonstrate a method
        but cannot support a claim about the world.

      Whichever route you take, record where the data actually came from
      before you touch them. That record is the first row of the provenance
      documentation this studio produces.
    steps:
      - "Settle your acquisition route first, using the guidance above, and write down which route you took and why."
      - "Document provenance for every source: who produced it, how, when, and under what terms."
      - "Write your measurement specification: the construct, the operationalization, and the gap between them."
      - Assess reliability and validity for your own instrument, on the evidence you actually have.
      - Recheck permissions against the data as they actually arrived, not as planned.
    rails:
      ethics: Data that arrived differently from the plan can carry permissions the plan did not cover.
      evidence: Provenance is the evidence rail applied to your own data.
      ai: An assistant can describe a dataset it has never seen; verify every claim against the file.
      uncertainty: Measurement error is uncertainty; state it alongside sampling uncertainty, not instead of it.
    revisit: >-
      Any measurement change is a Contract version, because it changes what
      your estimand refers to.
    milestone_title: "Your data and measurement, governed"
    milestone_reason: >-
      Results inherit the quality of the data and the measures beneath
      them, and no later check can repair what goes wrong here. This
      milestone settles how data reach you, where every number came from,
      and whether your instruments measure what your contract says they
      measure. The work is deliberately unglamorous. It is also where more
      projects quietly fail than anywhere else in the book.
    hands_forward: >-
      Milestone 7 runs the declared analysis on these governed data and
      produces your first reproducible result.
    contributions:
      data-provenance: >-
        your provenance record for every dataset and borrowed number, with
        the primary source behind your headline claim opened and read
      measurement: >-
        your measurement specification: concept, construct, indicator, the
        meaning sentence for each number, and one planned reliability check

  - id: first-analysis
    purpose: >-
      Produce one honest result you can reproduce from a clean start, with
      its uncertainty attached.
    produces: >-
      A route-specific result with an uncertainty statement, a restart-and-run-all
      verification, an environment record, and a claim-to-output check.
    steps:
      - Write the analysis you declared, and only that analysis, before looking at anything else.
      - Produce the result with its uncertainty statement, in the form your Contract specified.
      - Restart and run everything from a clean state; if the numbers move, the pipeline is the finding.
      - Record your environment, and check that every claim you plan to make traces to a specific output.
    rails:
      ethics: What you send to a tool during analysis is a disclosure decision each time.
      evidence: Every number in your result traces to a data cell and a line of code.
      ai: Delegate the writing of code freely; verify every returned number against the data yourself.
      uncertainty: A result reported without uncertainty is not yet a result.
    revisit: >-
      Failing to reproduce your own analysis sends you back here before any
      stress-testing is meaningful.
    milestone_title: "Your first reproducible analysis"
    milestone_reason: >-
      This is where your project produces its first real number. The
      milestone asks for less than you might expect: one honest result,
      with its uncertainty attached, reproducible from a clean start. The
      point is not volume. It is a result you can trace from claim to
      output to data cell, because every number you will ever defend in
      this project passes through the discipline you set here.
    hands_forward: >-
      Milestone 8 exists to attack this result; the cleaner your record
      here, the more the attack can teach you.
    contributions:
      ai-as-programmer: >-
        your first computed number, its delegated code read line by line,
        and the sentence naming what the number does not cover
      ai-analytical-assistant: >-
        your headline estimate with its cycle log, two independently
        re-derived numbers, and a placebo run


  - id: stress-test
    purpose: >-
      Attack your own result the way a hostile reviewer would, and record
      what survived.
    produces: >-
      A pre-listed robustness grid, negative tests with their assumptions
      stated, diagnostics, an adversarial-review record, and your adjudication
      of what survived.
    steps:
      - Pre-list your checks before you run any of them, and commit to reporting all of them.
      - Run the robustness grid and report a span within each commensurable panel, never across panels.
      - Run the null check that your design licenses, and name it correctly.
      - Put your finding to adversarial reviewers, human and AI, and confirm or refute each flag with a data check.
      - "Write the adjudication: what survived, what did not, and what you still cannot rule out."
    rails:
      ethics: Report the checks that hurt your finding as fully as the ones that helped.
      evidence: A flag is real when a check confirms it, not when the reviewer sounds certain.
      ai: An AI reviewer is another critique, not independent verification.
      uncertainty: Specification spread measures your choices; it is not an uncertainty interval.
    revisit: >-
      A finding that does not survive its own pre-listed checks returns to
      Studio 5 or 7, not to the writing studio.
    milestone_title: "Your robustness audit"
    milestone_reason: >-
      A result you have not tried to break is a result you do not yet
      know. This milestone attacks your own finding the way a hostile
      reviewer would: pre-listed robustness checks, negative tests with
      predictions written before the run, an adversarial review, and an
      audit of where your confidence actually comes from. What survives,
      you can defend. What does not, you now know before a reader finds
      it for you.
    hands_forward: >-
      Milestone 9 writes down only the claims this audit licenses, at the
      strength it licenses them.
    contributions:
      robustness-sensitivity: >-
        your pre-listed robustness grid with its full results, direction
        and size, plus the named null check
      negative-tests: >-
        your negative test and diagnostic, each with the prediction you
        wrote before running it
      ai-adversarial-reviewer: >-
        your commissioned adversarial review with every flag adjudicated
        against the data, confirmed or refuted
      false-confidence: >-
        your confidence audit: the not-yet-recomputed list, where belief
        in the headline number comes from, and your boundary sentence

  - id: write-bound-disclose
    purpose: >-
      Write the claim you can defend, bounded by what your evidence supports,
      with your AI use disclosed.
    produces: >-
      A stand-alone research note or report draft, a claim-to-evidence table,
      and your AI disclosure statement.
    steps:
      - Write your claim as one sentence, with its boundary attached in the same sentence.
      - "Build the claim-to-evidence table: every claim, the output that supports it, and the check that verified it."
      - State your uncertainty and your limitations in the words a reader outside your field would use.
      - Write your AI disclosure from your ledger, not from memory.
    rails:
      ethics: Disclosure includes what you sent to tools, not only what they produced.
      evidence: A claim with no row in the table does not appear in the draft.
      ai: The sentence that ships is yours, whatever drafted it.
      uncertainty: Findings are never communicated as certainties.
    revisit: >-
      A claim you cannot fit in the table is a claim to cut or a check to
      run, and both send you back a studio.
    milestone_title: "Your bounded claims"
    milestone_reason: >-
      Writing is where research leaves your head and can first be misread.
      This milestone turns your audited results into claims a stranger can
      weigh: each one bounded by what the design established, traced to
      the output that supports it, and accompanied by an honest account of
      what AI did along the way. The discipline is simple and strict. A
      claim with no row in the evidence table does not ship.
    hands_forward: >-
      Milestone 10 adapts these bounded claims to a real audience and
      rehearses their defense.
    contributions:
      results-to-claims: >-
        your claims with verbs downgraded to what the design established,
        each carrying its boundary line
      claim-evidence-tables: >-
        your claim-evidence table, one row per claim with claim, evidence,
        trace, and boundary, every number traced to its output
      ai-disclosure: >-
        your AI-use disclosure, written from the ledger and naming what
        you did not verify
      poster-to-note: >-
        your research-note spine: problem, gap, question, findings ordered
        by support, and the headline claim with its boundary inside

  - id: adapt-and-defend
    purpose: >-
      Adapt one defensible claim to one audience and rehearse defending it
      against real questions.
    produces: >-
      One chosen genre adaptation - poster, talk, brief, or another - plus a
      defense rehearsal record. This is not yet public release.
    steps:
      - Choose your genre and read its lesson, then say what your claim must lose to fit it.
      - Build the adaptation, keeping every number traceable to the claim-evidence table.
      - Rehearse the defense against the three hardest questions you can construct.
      - Record which questions you could not answer; those are your next studio's agenda.
    rails:
      ethics: An adaptation that drops the limitations is not a shorter version, it is a different claim.
      evidence: Every figure that travels carries its verification with it.
      ai: Use AI to generate hostile questions; answer them yourself.
      uncertainty: The shorter the format, the more explicit the boundary has to be.
    revisit: >-
      A question you cannot answer in rehearsal is evidence, and it sends
      you back to the studio that owns it.
    milestone_title: "Your defense, ready"
    milestone_reason: >-
      A claim becomes public the moment an audience can question it, and
      audiences do not read contracts. They read posters, hear talks, and
      ask hard questions. This milestone adapts your bounded claims to the
      genre your venue asks for and rehearses the defense before it
      counts. The rehearsal record matters as much as the artifact: the
      questions you cannot answer yet are the truest map of what remains.
    hands_forward: >-
      Milestone 11 lets strangers rerun what you have just defended, which
      is the one test rehearsal cannot give you.
    contributions:
      research-posters: >-
        if your venue is a poster: the one-figure draft with labeled
        values, intervals drawn, and a headline verbed to your boundary
      poster-criticism: >-
        the gallery-walk audit of your own draft, hits ranked by how far
        the error travels, fixed once, and the lock call
      research-pitches: >-
        if you will speak: your 30-second and 3-minute pitches, built
        boundary-first and tested aloud on an outsider
      difficult-questions: >-
        your five hardest fair questions with defend-or-concede answers,
        and your uncertainty-and-limitations statement in ULN form

  - id: reproduce-and-package
    purpose: >-
      Prove that someone who is not you can obtain your result from your
      materials.
    produces: >-
      An independent cold-run record and a reusable research package.
    steps:
      - Run your own package cold, from a clean environment, following only your written instructions.
      - Have someone else run it without your help, and log every place they had to ask you a question.
      - Fix what the cold run exposed; every question they asked is a missing line in your documentation.
      - "Assemble the package: data or its access route, code, environment, documentation, and licence."
    rails:
      ethics: What can be shared is set by your permissions, and the package says so explicitly.
      evidence: Reproduction is the evidence rail's final test.
      ai: An assistant can generate documentation; only a cold human run can validate it.
      uncertainty: Reproduce the uncertainty statement, not only the point estimate.
    revisit: >-
      A failed cold run is a finding about your work, and it precedes any
      release.
    milestone_title: "Your reproducible package"
    milestone_reason: >-
      Research that only runs on your machine, with you present, is
      testimony rather than evidence. This milestone proves that someone
      who is not you can obtain your result from your materials alone: a
      cold run, a stranger's run, and a package that carries data access,
      code, environment, documentation, and licence. It is the boundary
      between work you finished and work others can build on.
    hands_forward: >-
      Milestone 12 decides whether the packaged work is ready to leave
      your hands, and what the next cycle should ask.
    contributions:
      replication-reproduction: >-
        your cold reproduction record: every number re-run from the top,
        one undisclosed choice varied, and missingness classified before
        any filling
      research-packages: >-
        your research capsule: notebook, data or its access recipe,
        environment record, README, and a cold rerun in a second
        environment

  - id: release-next-cycle
    purpose: >-
      Decide whether this work is ready to leave your hands, and say what
      the next study should be.
    produces: >-
      A release audit, your final dossier, an explicit stopping rule, and
      your next-study agenda.
    steps:
      - "Run the release audit: permissions, disclosure, reproducibility, claim boundaries, and every promise you made to participants."
      - "Assemble the dossier: contract versions, evidence registry, permissions, measurement, analysis and claim ledgers, AI ledger, artifacts, package, and revision history."
      - "Write your stopping rule: why you are stopping here rather than running one more check, stated as a decision."
      - "Write the next-study agenda: the question this work opened, and what you would do differently."
    rails:
      ethics: Release is the last point at which a permission problem can still be prevented.
      evidence: The dossier is the evidence rail made assemblable.
      ai: Your AI ledger closes here as a complete record, not a summary.
      uncertainty: State what you still do not know as clearly as what you found.
    revisit: >-
      The next-study agenda is the revisit; a research cycle ends by
      declaring the next one.
    milestone_title: "Your release and next cycle"
    milestone_reason: >-
      Every research cycle ends with two decisions no tool can make for
      you: whether this work is ready to leave your hands, and what should
      be asked next. This milestone runs the release audit, closes your
      dossier and your AI ledger as complete records, and writes the
      stopping rule you can say aloud. It is the last milestone, and it
      produces what the other eleven were building toward: your finished
      research artifact, released, defended, and pointing at its
      successor.
    hands_forward: >-
      This is where the chain closes. The artifact leaves your hands, and
      the next-study agenda opens the cycle that follows.
    contributions:
      managing-ai-agents: >-
        if you ran agent loops: your three-loop round with its wiring, its
        turn counts, and the one node you kept human
      conflicting-agents: >-
        if your loops disagreed: your escalation rules, one conflict
        diagnosed and resolved by your own check, and the override on
        record
      final-portfolio: >-
        your finished research artifact with every claim bounded, your
        four-part AI-management portfolio, and the rehearsed
        three-movement defense
