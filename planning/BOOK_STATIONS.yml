# BOOK_STATIONS.yml — authored content for the 12 practice studios — 'stations' in the machine layer (D35 §3)
#
# Two grains: lessons are READING units (BOOK_ARCHITECTURE.yml), studios are
# PRACTICE units. This file holds what a studio TEACHES YOU TO DO; studio
# identity, checkpoint ids, and lesson membership live in the architecture
# manifest and are never restated here.
#
# `scripts/build_station_pages.py` generates one page per studio into
# book/studios/ plus its workbook notebook, and the architecture validator
# requires every studio in the manifest to have an entry here.
#
# Every studio page carries the same spine:
#   purpose  -> what you can defend when you leave
#   produces -> the versioned checkpoint artifact (never a locked pass, D35)
#   steps    -> the practice, in order, each one a thing you write or run
#   rails    -> how the four persistent rails apply HERE (specifics only;
#               the generator states the rails themselves)
#   revisit  -> what later evidence sends you back to this studio
#
# D35: checkpoints are VERSIONED, not irreversible. A checkpoint produces
# v0, v1, v2 with reasons attached. Anything else contradicts the book's own
# declare -> diagnose -> redesign method.

schema_version: "1.0"

stations:
  - id: frame-the-inquiry
    purpose: >-
      Start from the one thing AI cannot supply: a curiosity you own.
      Commit it, stretch it with your tools, and choose the research
      problem worth months of your work.
    opening_move: |
      Research starts with something that will not leave you alone: a
      pattern you keep noticing, a contradiction, a decision you want to
      understand. This first move is yours alone. Write four lines by
      hand.

      1. One thing you genuinely want to understand, in one sentence.
      2. Why an answer would matter, and to whom.
      3. What you currently think the answer might be. A starting belief,
         not a claim.
      4. One kind of evidence that could make you revise that belief.

      Keep what you wrote. Lesson 1 shows why this page is where research
      starts and why the jump on it is yours, then helps you stretch it,
      with AI welcome at the table, into the problem your project will
      chase.
    produces: >-
      Your committed curiosity with its starting belief and the evidence
      that would revise it, the brainstormed candidates with what you
      kept and rejected and why, and one chosen research problem, scored
      and red-teamed, with your expected answer on record.
    steps:
      - Copy your opening move's four lines as the artifact's version zero, dated.
      - "Widen the curiosity: write two candidate directions yourself, then run the structured brainstorm and mark everything it introduced as NEW."
      - Choose the research problem and score it honestly on importance, feasibility, and contribution, one sentence each.
      - Write your expected answer and name one real person or role for whom a different answer would be genuinely surprising.
      - "Keep the trail: candidates kept and rejected, each with its reason, and the NEW elements you adopted as your own."
    rails:
      ethics: Note now whether chasing this curiosity would require people, and flag it before anything is designed.
      evidence: Your starting belief is a claim to check, not to defend; write it so evidence can move it.
      ai: Brainstorm freely, and mark every AI stretch NEW; start a simple exchange log now, and Studio 2 turns it into your AI Research Ledger.
      uncertainty: Write what would change your mind while nothing is yet at stake; that sentence is the seed of every later boundary.
    revisit: >-
      Studio 3's evidence map and Studio 4's diagnosis both send curiosity
      back here. A revised curiosity is progress on the record, not a
      restart.
    milestone_title: "Your curiosity, committed"
    milestone_reason: >-
      Research begins with a jump that is yours to make. Einstein
      sketched discovery as a cycle: you start from experience, you leap
      to an idea that could explain it, and you reason down to
      predictions you can check. The leap has a name, abduction, and a
      Google DeepMind position paper by Tom Zahavy argues that today's AI
      cannot make it: the tools have mastered patterns and derivations,
      but they have only text about the world, not the experience the
      jump starts from [@zahavy2026jump]. Take that as an argued
      position rather than a settled boundary. Either way the jump is
      yours, because you are the one who answers for the claim. This
      first milestone puts it on the record: the curiosity you committed
      by hand, the candidates you and your tools stretched it into, and
      the one research problem you chose to chase.
    hands_forward: >-
      Milestone 2 sets the rules that protect this curiosity, opens the
      ledger that records every delegation, verifies your first AI
      assistance, and closes the arc by declaring your formal research
      question.
    contributions:
      curiosity-to-problem: >-
        your committed curiosity, the brainstormed candidates with NEW
        elements marked and kept or rejected with reasons, your chosen
        research problem scored and red-teamed, and your expected answer
    practice_kit:
      worked_example: |
        A reader's opening move, worked to a chosen problem.

        **The four lines.** "I keep wondering whether eating out near
        campus has really gotten more expensive faster than everything
        else." · It matters to every student budgeting a semester, and
        to the restaurants pricing for them. · Starting belief: "menu
        prices outran overall inflation since 2019." · Revising
        evidence: "price records showing menus tracked the overall
        index."

        **The stretch.** The brainstorm returned five directions; two
        introduced NEW elements (delivery fees; a second town). The
        reader kept the delivery-fee direction as a fallback, rejected
        the second town (no access), and wrote both reasons down.

        **The choice.** Chosen problem: how menu prices near campus
        moved against overall prices, 2019 to 2025. Importance: every
        budget feels it. Feasibility: archived menus plus a public
        index. Possible contribution, provisional until Studio 3 maps the
        evidence: no local look at this campus has surfaced yet. Expected
        answer: menus outran the index; a flat result would surprise
        the reader most.
      faded_task: |
        Here is the same kit half-finished for a different opening move:
        "do students who exercise sleep better?" The four lines and the
        brainstorm exist; the choice, the scores, and the expected
        answer are blank. Finish them, and notice what feasibility does
        to this one: it studies people, and Studio 2's red-flag screen
        will ask you about that before any design exists.
      starter: |
        Copy this skeleton: your four lines, dated (version zero) · two
        directions of your own · the brainstorm's candidates with NEW
        marks · kept and rejected, with reasons · the chosen problem ·
        three scores, one sentence each · your expected answer and who
        would be surprised.
      verification: |
        The ownership test: read your chosen problem and ask whether you
        would chase it if every AI tool disappeared tomorrow. If the
        answer is no, the choice was the tool's, not yours; go back one
        step. Then hand the problem sentence to someone who knows
        nothing about it and ask what is unknown and why it matters;
        where they stall, your next revision lives.

  - id: govern-the-work
    purpose: >-
      Set how you and your tools will work while the stakes are still
      small, verify your first AI assistance, and close by declaring the
      question your evidence will answer.
    produces: >-
      Your working agreement (a responsibility statement, your working
      rules, your opened AI Research Ledger, your delegation map, and the
      red-flag screen of your chosen problem) and your question, formally
      declared: objective, units, outcomes and conditions, kind and
      reach, and a provisional claim boundary.
    steps:
      - "Write your responsibility statement: the decisions that stay yours no matter how good the tool gets — the choice of question first among them."
      - "Write your working rules: what you will delegate, what you will always verify, and how you will record both. Mark the declaration work on the map: candidate wordings are delegable; kind, reach, and the boundary never are."
      - Open your AI Research Ledger and give its first rows to the exchanges you have already run, the Studio 1 brainstorm included.
      - "Run the red-flag screen on your chosen problem: is it answerable, is it yours to ask, and could you defend attempting it."
      - "Assemble your declaration from the last two lessons: the lead question classified by kind and reach, the field card (objective, unit, outcome, conditions), and the chosen wording with every change accounted for."
      - "Write your provisional claim boundary beside it: the sentence you hope to defend, the stronger sentence you will not be able to, and the uncertainty-and-limitations line any answer will have to carry."
      - "Read the two artifacts against each other: every never-delegate line in the agreement must cover a decision the declaration actually made. Where one names a rule the other ignored, fix the weaker document."
    rails:
      ethics: The red-flag screen runs here, and a problem that studies people leaves this studio with that fact attached.
      evidence: Nothing here is settled until Studio 3 checks it against what is already known.
      ai: The ledger opens here and every earlier exchange gets its row; from now on, no delegation goes unrecorded.
      uncertainty: A question with no recognizable answer cannot carry uncertainty; fix the question before you leave.
    revisit: >-
      Studio 3 almost always sends the question back here for a sharper
      version, and any change in your tools, your data source, or your
      collaborators reopens the agreement.
    milestone_title: "Your rules and your question"
    milestone_reason: >-
      Your committed problem now needs two things at once: guardrails,
      and an exact sentence. The rules are not a preface to the question;
      they govern how it is written — which parts AI may draft, which
      decisions stay yours, what gets verified, what gets recorded, and
      what your name signs. So this studio interleaves its two purposes.
      You open the ledger and map the work, test a claim your starting
      belief already makes, and put your name on the record. Then, under
      those rules, you classify the question, draft its wording with
      every change accounted for, and close with the field card, the
      boundary pair, and the stranger test. Every later studio traces
      its evidence, design, analysis, and claim back to a declared
      question, and to the rules under which that declaration was made.
    hands_forward: >-
      Milestone 3 holds the declared question up against what is already
      known, and it will usually send back a sharper version.
    contributions:
      ai-arm-not-brain: >-
        your opened AI Research Ledger and one verified factual hinge
        from your own problem, including the retrospective Studio 1
        receipt as row one
      research-director: >-
        your delegation map for the whole project and for the
        declaration ahead: candidate wording may travel, while the lead
        question, kind, reach, and boundary stay yours
      sdiivdd: >-
        one complete SDIIVDD run on a checkable claim your starting
        belief makes, with the check's outcome on record — including
        "nothing changed" when the check agreed
      responsibility-ownership: >-
        your ownership statement, never-delegate list, and first AI-use
        disclosure, with the research question named as the first
        sentence your name signs
      question-kinds: >-
        your lead question chosen from the candidates, placed by kind
        and reach, with double-barrels split and a comparison world
        recorded when causal
      declare-your-question: >-
        your chosen formal wording with every change accounted for, the
        field card, the boundary pair with its uncertainty-and-limitations
        line, and the stranger-test result, dated as version zero
    practice_kit:
      worked_example: |
        The restaurant-prices reader's working agreement, then the
        declaration it protects.

        **Responsibility statement (excerpt).** "I decide which price
        measure fits what households pay, which base year anchors the
        comparison, and what the final claim says. No tool signs for me."

        **Working rules.** Delegate freely: locating candidate series,
        drafting summaries, brainstorming directions. Delegate then
        verify: any number, any citation, any code. Never delegate: the
        measure choice, the base year, the claim and its uncertainty.

        **First ledger rows.** Row one is the Studio 1 brainstorm,
        logged after the fact: task, tool, kept and rejected, and the
        NEW elements adopted. Row two is the first verified exchange:
        find candidate price-index sources · chat assistant · three
        candidates · kept the statistical agency's series · opened the
        agency's table and read both values · concern: campus menus may
        not track the national basket.

        **Red-flag screen.** Answerable with public data; studies
        prices, not people; defensible to attempt.

        **The declaration.** Objective: describe how much more eating
        out near campus costs than in 2019, relative to overall prices.
        Units: menu items retrievable for both years. Outcome: listed
        price. Conditions: 2019 versus 2025. Kind: descriptive ("how
        much more," not "what caused it"). Reach: the data at hand.
        Boundary: on this panel, prices rose faster than the index;
        cannot defend the group claim or any cause.
      faded_task: |
        The exercise-and-sleep reader's agreement is half done: the
        responsibility statement and first ledger rows exist; the
        never-delegate list, the red-flag screen, and the whole
        declaration are blank. Among the AI's candidate wordings sits
        this one: "do first-year athletes who exercise sleep better than
        other students?" — it reads sharper, and it silently added a
        population nobody chose. Finish the agreement, reject that
        candidate with the reason written down, and then declare
        honestly: kind and reach as the words fix them, and the boundary
        sentence the reach will not let you say.
      starter: |
        Copy this skeleton top to bottom: responsibility statement (two
        to four sentences) · working rules (three lists) · ledger rows
        for every exchange so far (all eight fields) · red-flag screen
        (answerable? yours to ask? defensible?) · objective · units ·
        outcome · conditions · kind, with its fixing words · reach, with
        its fixing words · the sentence you hope to defend · the
        sentence you will not be able to defend.
      verification: |
        Two checks. First, the agreement against Lesson 3's delegation
        map: every starred never-delegate line there appears in your
        rules here. Second, the stranger test on the declared question:
        hand the single sentence to someone who knows nothing about your
        project and ask what one unit is, what you would record, and who
        the answer is about. Where they stall, revise before you
        version.

  - id: ground-in-evidence
    purpose: >-
      Find out what is already known, verify that it is actually known, and
      let it change your question.
    produces: >-
      An evidence registry of verified sources, your search log, an evidence
      map, and an explicit revision of your Studio 2 declaration.
    steps:
      - "Search deliberately and log every search: where you looked, what terms, what you found and did not."
      - Verify each source you intend to cite by retrieving and reading it, never by trusting a summary.
      - "Build the evidence map: what is settled, what is contested, what is missing."
      - "Write the revision: how your question changed, or a defended statement of why it did not."
    rails:
      ethics: Record the licence and terms of any dataset you found here, before you plan to use it.
      evidence: This studio IS the evidence rail's home; every later citation traces to this registry.
      ai: Every AI-suggested source is unverified until you have opened it yourself.
      uncertainty: Note where the literature disagrees; that disagreement is uncertainty you inherit.
    revisit: >-
      New evidence found at any later studio is registered here, not
      appended informally to a draft.
    milestone_title: "Your evidence base"
    milestone_reason: >-
      No question is asked in an empty room. Before you spend months
      answering yours, this milestone makes you find out what is already
      known, verify that it is actually known rather than merely repeated,
      and let the verified record change your question. It is also where
      the book's evidence rail becomes physical: the registry you assemble
      here is what every later citation traces back to, all the way to the
      release audit in Studio 12.
    hands_forward: >-
      Milestone 4 takes your revised question and the gap your evidence
      map exposed, and writes them into a research contract that can be
      diagnosed.
    contributions:
      research-builds: >-
        your candidate source list with a status column, seeded by your own
        search, an AI sweep, and hand snowballing, with a lead source marked
      verifying-prior-evidence: >-
        your verified sources, your evidence map with its quiet spot,
        your gap written as one bounded sentence, and your revised
        declaration — or the defended reason it holds
    practice_kit:
      worked_example: |
        Three rows from the restaurant-prices evidence registry, with the
        search log beside them.

        | Source | What it is | Status |
        |---|---|---|
        | BLS Consumer Price Index, food away from home | the national series for restaurant prices | verified: opened the table at bls.gov, read the values |
        | BLS Consumer Price Index, all items | the overall-prices comparison series | verified: same route |
        | "Campus dining price study" suggested by an AI sweep | a promising-sounding study | could not retrieve from the citation given: DROPPED |

        **Search log lines.** Where: agency site, library database, one
        AI sweep · terms: "restaurant price index", "food away from home
        CPI" · what was found and not found, with dates.

        **Map sentence.** Settled: the two national series exist and
        diverge over the period. Missing: any evidence specific to
        campus-area restaurants. **Gap.** "Across what I could retrieve,
        no source describes how menu prices near a campus moved relative
        to overall prices since 2019."

        The dropped third row is the point: a source that cannot be
        retrieved is not evidence, however fluent the suggestion was.
      faded_task: |
        Your registry needs one more candidate, and this time the AI
        supplies it live: ask your own AI tool for one additional
        published source on your question, with authors, year, and title.
        Take whatever row it returns and decide its status the only way
        that counts, by trying to retrieve it, and write the search-log
        line for the attempt. Then finish the revision sentence: "After
        the map, my Studio 2 declaration changes (or holds) because…"
      starter: |
        Your registry columns: source · what it is · status (verified /
        could not retrieve / pending), with one search-log line per
        search: where, terms, found or not, date.
      verification: |
        The retrievability audit: take each row marked verified and open
        its source again from the citation alone, as a stranger would.
        A row you cannot reopen goes back to pending, whatever you
        remember about it.

  - id: declare-and-diagnose
    purpose: >-
      Write your design down as something specific enough to be diagnosed,
      then find out how it behaves before it costs you anything.
    produces: >-
      Research Contract v0 — objective, target estimand, population, setting
      and time, data strategy, a provisional operationalization you mark for
      revision, warrant, answer strategy and uncertainty statement — plus
      the design properties you diagnosed (its bias, its wobble, and how
      often it would detect what you are looking for), your permission
      status, and a redesign record.
      Measurement proper is taught and assessed in Studio 6; here you only
      commit to a starting choice and say why it is defensible for now.
    steps:
      - "Write the four MIDA parts of your design so a stranger could run them. (MIDA is Blair, Cooper, Coppock, and Humphreys' framework, developed at book length in RDSS.)"
      - State your estimand and estimator, and describe in words what would differ if the procedure ran again.
      - "Diagnose the design: what is its bias, how much does it wobble, and how often would it detect what you are looking for."
      - Run the permission determination and declare one status; if it is anything but cleared, name the authority and the date you asked.
      - Minimise your columns against the declared analysis, and check what a re-identification test would find.
      - Write the redesign record - what you changed after diagnosing, and why. A diagnosis that changed nothing is a diagnosis you should distrust.
    rails:
      ethics: The permission status produced here gates every later studio; nothing downstream may proceed past a stop.
      evidence: Your data strategy names actual sources from the Studio 3 registry, not source types.
      ai: Diagnosis is delegable; the choice of what to fix is not.
      uncertainty: This is where your uncertainty statement is first written down and first tested.
    revisit: >-
      Route diagnosis, measurement changes, permission rulings, and the
      realized data each produce a new Contract version with its reason.
    milestone_title: "Your research contract, v0"
    milestone_reason: >-
      This is the hinge of the book. Everything before it shaped a
      question; everything after it executes a design. The contract you
      write here (objective, estimand, population, data strategy, a
      provisional operationalization, warrant, answer strategy,
      uncertainty) is declared before any result exists, so that later
      changes are visibly design or visibly drift. Diagnosing it on simulated data now, while
      changing your mind is still free, is what makes the declaration
      honest rather than decorative. The four MIDA parts you declare here,
      and the declare-and-diagnose loop you run on them, were introduced by
      Blair, Cooper, Coppock, and Humphreys [@blair2019declaring] and
      developed in RDSS [@blair2023rdss]; this book puts them in plain
      language and joins them to a governed AI workflow.
    hands_forward: >-
      Milestone 5 commits the contract to one research pathway and writes
      what that pathway can and cannot establish.
    contributions:
      mida: >-
        your MIDA declaration: model, inquiry, data strategy, and answer
        strategy, with the alignment sentence that ties them together —
        carrying population, setting and time, the provisional
        operationalization, and the warrant into Contract v0
      uncertainty-foundations: >-
        your estimand and estimator, the repeat-run story behind them,
        your dependence structure, and your uncertainty sentence next to
        its wrong twin
      declare-diagnose: >-
        your design diagnosis: bias, wobble, and power read from
        simulation, one redesign, and the honest call that followed
      ethics-data-governance: >-
        your declared permission status, your minimised column list, your
        AI boundary, and your four governance decisions
    practice_kit:
      worked_example: |
        Research Contract v0 for the restaurant-prices project, compact.

        **Objective.** Describe local menu-price growth against overall
        prices, 2019 to 2025. **Target estimand.** The ratio of the two
        growth rates. **Population.** Restaurants near campus whose
        menus are retrievable for both years. **Data strategy.** Archived
        menus plus the agency's published index. **Provisional
        operationalization (marked for revision).** The listed price of
        a standard dinner entree. **Warrant.** A descriptive comparison;
        no causal claim. **Answer strategy.** Mean growth ratio across
        the menu panel. **Uncertainty.** A coverage caveat, not an
        interval: archived menus survive selectively. **Permission
        status.** Cleared: prices, not people.

        **Diagnosis note.** On simulated menus, price-dependent archiving
        biased the growth estimate upward: pricier restaurants archive
        more, and no restriction inside these data removes that
        selection. **Redesign.** Narrow the estimand to the retrievable
        panel and say so in the claim; the coverage caveat stays.
        **The honest call.** Run it on the panel, bounded, and name what
        more data of the same kind could never fix.
      faded_task: |
        The exercise-and-sleep contract is half written: objective,
        population, data strategy, and answer strategy are done. The
        estimand and the permission status are blank. Write both, and
        notice what the permission line does to the timeline: this
        project studies people, so the status cannot be "cleared" by
        assertion. Name the authority you would ask and the date you
        would ask it.
      starter: |
        Your contract fields, one line each: objective · target estimand
        · population · setting and time · data strategy · provisional
        operationalization, marked for revision · warrant · answer
        strategy · uncertainty statement · permission status · what your
        diagnosis said · what you redesigned · the honest call.
      verification: |
        The alignment check from Lesson 9, written as one sentence:
        "Because my data strategy samples X, my answer strategy's number
        speaks to Y." If X and Y do not connect in your own reading, the
        contract is not aligned; fix the weaker of the two before you
        version it.

  - id: develop-the-pathway
    purpose: >-
      Commit to the research pathway your question and your licence actually
      support, and say what that pathway can and cannot establish.
    produces: >-
      Research Contract v1: objective by target and reach by data strategy by
      warrant, with the pathway declared and its limits written before any
      result exists.
    route_guide: |
      Five pathways run through this part of the book, and your question plus
      what you are allowed to do picks one. Read the row that fits, then read
      one that does not, so you can say why yours is right. The first four
      adapt the design library in RDSS [@blair2023rdss]; prediction is this
      book's added fifth pathway.

      | If your question asks | and you | your pathway is |
      |---|---|---|
      | how much, how many, or how distributed something is | observe the world as you find it | **observational descriptive** |
      | whether one thing causes another | observe the world as you find it | **observational causal** |
      | how much of a property exists, measured cleanly | assign conditions yourself to measure it | **experimental descriptive** |
      | whether an intervention works | assign conditions yourself | **experimental causal** |
      | what will happen to cases nobody has seen | fit and honestly score a forecast | **prediction** |

      Two cautions. Assigning conditions does not make your question causal:
      a randomized study can be measuring a property the world already has.
      And a causal question whose data cannot identify it stays causal — it
      becomes "causal, currently unidentified", never quietly descriptive.

      If your project combines pieces of several rows, read the complex-designs
      lesson as an overlay after you have declared your primary pathway.
    steps:
      - Use the route guide above to choose your pathway, then read that lesson and at least one that does not fit, so you can say why yours does.
      - "Declare your pathway and write the crossing that licenses it: what makes your comparison mean what you claim."
      - "Write the limits: what this pathway cannot establish no matter how clean the execution."
      - Update your claim boundary to match the pathway, and mark the change as a new Contract version.
    rails:
      ethics: A change of pathway can change your permission status; recheck rather than assume.
      evidence: Name the prior work that used this pathway on a comparable question.
      ai: Ask an assistant to argue for a different pathway, then answer the argument yourself.
      uncertainty: Different pathways carry different sources of uncertainty; name yours here.
    revisit: >-
      Realized data that will not support the declared pathway sends you
      back here before analysis, not after.
    milestone_title: "Your pathway, declared"
    milestone_reason: >-
      Five pathways run through this book, and your project takes exactly
      one as its primary road. This milestone makes the commitment
      explicit: which pathway, what licenses it, and what it cannot
      establish no matter how clean the execution. Declaring it now
      protects you later, because a result can only be defended from
      inside the pathway that produced it.
    hands_forward: >-
      Milestone 6 puts data and measurement under governance so the
      declared pathway has something trustworthy to run on.
    contributions:
      observational-descriptive: >-
        either your four boxes and selection diagram, if this is your
        pathway, or the classification drill that rules it out
      observational-causal: >-
        either your causal diagram with its leverage named and priced, or
        the drill that shows why this road is not yours
      experimental-descriptive: >-
        either your revealed-characteristic estimand with its demand and
        instrument threats named, or the drill run on your own question
      prediction-generalization: >-
        either your signed four-part forecasting contract with its
        boundary, or the contrast drill: the plain rejection line, the
        prediction-time leakage check run on your own features, and two
        sentences on why prediction answers a different question
      experimental-causal: >-
        either your treatment, outcome, and potential outcomes with the
        nearest threat named, or the drill plus the confounder that blocks
        the causal reading
      hybrid-complex-designs: >-
        if your design has stages: the stage-by-stage map, its weakest
        link, and the one-sentence justification for keeping or cutting it
    bring_note: >-
      One bound on the skip rule here: this milestone requires your
      PRIMARY pathway's full piece plus ONE contrast drill from any
      other route you choose — reading a road that is not yours is what
      makes yours visible; skipping the rest is correct. The overlay
      binds only when your design has stages.

    practice_kit:
      worked_example: |
        The restaurant-prices reader declares a pathway.

        **The inquiry's words.** "How much more" — a quantity, observed
        as the world offers it. That is observational descriptive.

        **The four boxes.** Target: campus-area menu items, 2019 and
        2025. Frame: menus that were archived. Sample: items retrievable
        in both years. Claim: bounded to that panel.

        **The contrast drill (observational causal).** "Did the wage
        increase raise prices?" would need a comparison world without
        the increase; city-wide inflation confounds it, and no menu
        archive removes that. The question stays causal, currently
        unidentified — it is not quietly relabeled descriptive.

        **Contract v1 line.** Pathway declared: observational
        descriptive; the license is the retrievable panel; the limit is
        that no cause of any gap can be established here.
      faded_task: |
        The exercise-and-sleep reader is mid-declaration: the inquiry
        words point at "goes with", but the reader keeps writing
        "improves". Finish the declaration honestly: name the pathway
        the words support, write the crossing that licenses it, and
        write the limit line for the causal reading the reader wants but
        this design cannot pay for.
      starter: |
        Your route row, one line each: the inquiry's own words · the
        pathway they support · the crossing that licenses it · what the
        pathway cannot establish · the contract v1 sentence recording
        the declaration.
      verification: |
        Read your contract v0 inquiry aloud. If its words ask what would
        happen IF something changed, your pathway cannot be descriptive,
        whatever your data look like; the kind rule cuts both ways. Then
        check the contrast: can you say, in one sentence, why the
        neighboring pathway is not yours?
  - id: govern-data-measurement
    purpose: >-
      Establish where your numbers came from and whether they measure what
      you say they measure.
    produces: >-
      Provenance documentation, a data-management record, your measurement
      specification, and a route-specific permission recheck.
    acquisition_note: |
      This studio assumes data have reached you, and the cold pilot found
      that nothing before it made that happen. Settle acquisition first, in
      writing, before the steps below.

      Your permission status from Studio 4 decides your route.

      - **Cleared or formal determination granted.** Name your sampling
        frame, how you will reach those units, and what you will do about
        the ones you cannot reach. Non-response is a design fact, not an
        accident.
      - **Pending.** Do everything that does not touch people: build and
        pilot the instrument on yourself, write the analysis code against
        simulated data of the shape you expect, and wait.
      - **No authority to ask, or not authorized.** Take the no-permission
        route, which reaches every method in this book: published aggregate
        statistics, an openly licensed dataset with no individual records,
        or data you simulate yourself. Write down which you chose and what
        it costs you, because a simulated dataset can demonstrate a method
        but cannot support a claim about the world.

      Whichever route you take, record where the data actually came from
      before you touch them. That record is the first row of the provenance
      documentation this studio produces.
    steps:
      - "Settle your acquisition route first, using the guidance above, and write down which route you took and why."
      - "Document provenance for every source: who produced it, how, when, and under what terms."
      - "Write your measurement specification: the construct, the operationalization, and the gap between them."
      - Assess reliability and validity for your own instrument, on the evidence you actually have.
      - Recheck permissions against the data as they actually arrived, not as planned.
    rails:
      ethics: Data that arrived differently from the plan can carry permissions the plan did not cover.
      evidence: Provenance is the evidence rail applied to your own data.
      ai: An assistant can describe a dataset it has never seen; verify every claim against the file.
      uncertainty: Measurement error is uncertainty; state it alongside sampling uncertainty, not instead of it.
    revisit: >-
      Any measurement change is a Contract version, because it changes what
      your estimand refers to.
    milestone_title: "Your data and measurement, governed"
    milestone_reason: >-
      Results inherit the quality of the data and the measures beneath
      them, and no later check can repair what goes wrong here. This
      milestone settles how data reach you, where every number came from,
      and whether your instruments measure what your contract says they
      measure. The work is deliberately unglamorous. It is also where more
      projects quietly fail than anywhere else in the book.
    hands_forward: >-
      Milestone 7 runs the declared analysis on these governed data and
      produces your first reproducible result.
    contributions:
      data-provenance: >-
        your acquisition route, written and dated, your provenance record
        for every dataset and borrowed number (the primary source behind
        your headline claim opened and read), your data-management update,
        and the permission recheck against the data as they actually
        arrived
      measurement: >-
        your measurement specification: concept, construct, indicator,
        the meaning sentence for each number, the reliability check's
        result, the indicator-to-use validity argument with its strongest
        rival reading, and the boundary that follows

    practice_kit:
      worked_example: |
        Two rows of the restaurant-prices provenance record, then the
        measurement spec.

        **Provenance.** Archived menus: captured by a public web
        archive, dates recorded per menu, terms open, original record
        the restaurant's own page. Index series: the statistical
        agency's published table, retrieved directly, terms open.

        **Measurement.** Construct: the menu price level. Indicator: the
        listed price of a standard dinner entree. Meaning sentence:
        "this number is what the menu asked, not what anyone paid."
        Reliability check: twenty menus double-entered; two
        transcription errors caught and corrected.

        **Permission recheck.** Prices, not people; the archive's terms
        permit research use; nothing changed on arrival.
      faded_task: |
        One provenance row arrived incomplete: a dataset of delivery
        fees a classmate shared, producer unknown, terms blank. Finish
        the row the only honest ways: locate the original record and its
        terms, or mark the row unusable and say what its loss does to
        wording B's feasibility. Then write the meaning sentence its
        indicator would need.
      starter: |
        Provenance columns: source · producer · when · original record ·
        terms · date you retrieved it. Measurement skeleton: construct ·
        indicator · exact procedure · meaning sentence ("this number
        does/does not…") · one planned reliability check.
      verification: |
        Open one primary source again from your own citation alone, as a
        stranger would. Then reread your contract's provisional
        operationalization against the indicator you just specified:
        if they differ, that is a contract version with a reason, not a
        silent swap.
  - id: first-analysis
    purpose: >-
      Produce one honest result you can reproduce from a clean start, with
      its uncertainty attached.
    produces: >-
      A route-specific result with an uncertainty statement, a restart-and-run-all
      verification, an environment record, and a claim-to-output check.
    steps:
      - Write the analysis you declared, and only that analysis, before looking at anything else.
      - Produce the result with its uncertainty statement, in the form your Contract specified.
      - Restart and run everything from a clean state; if the numbers move, the pipeline is the finding.
      - Record your environment, and check that every claim you plan to make traces to a specific output.
    rails:
      ethics: What you send to a tool during analysis is a disclosure decision each time.
      evidence: Every number in your result traces to a data cell and a line of code.
      ai: Delegate the writing of code freely; verify every returned number against the data yourself.
      uncertainty: A result reported without uncertainty is not yet a result.
    revisit: >-
      Failing to reproduce your own analysis sends you back here before any
      stress-testing is meaningful.
    milestone_title: "Your first reproducible analysis"
    milestone_reason: >-
      This is where your project produces its first real number. The
      milestone asks for less than you might expect: one honest result,
      with its uncertainty attached, reproducible from a clean start. The
      point is not volume. It is a result you can trace from claim to
      output to data cell, because every number you will ever defend in
      this project passes through the discipline you set here.
    hands_forward: >-
      Milestone 8 exists to attack this result; the cleaner your record
      here, the more the attack can teach you.
    contributions:
      ai-as-programmer: >-
        your first computed number, its delegated code read line by line,
        and the sentence naming what the number does not cover
      ai-analytical-assistant: >-
        your headline estimate with its uncertainty statement and cycle
        log, two independently re-derived numbers, a placebo run where
        licensed, the clean-restart record, the environment record, and
        the claim-to-output trace


    practice_kit:
      worked_example: |
        The restaurant-prices reader's declared analysis, run once,
        honestly. (A simulated teaching record: the numbers demonstrate
        the form; yours will be your own.) The declared quantity: mean growth of the panel's
        entree prices, 2019 to 2025, against the retrieved index. The
        result as reported: "panel mean growth 24.1% against index
        growth 18.0%: a gap of 6.1 points, with the coverage caveat
        that archived menus survive selectively." One number, its
        benchmark, its caveat — and a restart-and-run-all record dated
        the same day.
      faded_task: |
        The environment record is half done: Python version and package
        list are there; the data files with their retrieval dates are
        blank, and one claim-to-output row points at a cell that no
        longer exists. Complete the record and repair the trace; if the
        number cannot be traced, the claim does not ship.
      starter: |
        Starter code for your own declared quantity — replace the
        simulated block with your data and keep the discipline:

        ```python
        import numpy as np, pandas as pd
        SEED = 464
        rng = np.random.default_rng(SEED)
        # TODO: replace this simulated frame with YOUR data load
        df = pd.DataFrame({"group": rng.choice(["a", "b"], 200),
                           "value": rng.normal(10, 2, 200)})
        # TODO: compute the quantity your contract declared — only that
        result = df.groupby("group")["value"].mean()
        print(result)
        # TODO: print the uncertainty or the honest caveat beside it
        # then: Runtime -> Restart and run all; numbers must match
        ```
      verification: |
        Restart and run everything from a clean state. If the printed
        numbers differ from your report by even a little, the pipeline
        is the finding; fix it before any stress test means anything.
  - id: stress-test
    purpose: >-
      Attack your own result the way a hostile reviewer would, and record
      what survived.
    produces: >-
      A pre-listed robustness grid, negative tests with their assumptions
      stated, diagnostics, an adversarial-review record, and your adjudication
      of what survived.
    steps:
      - Pre-list your checks before you run any of them, and commit to reporting all of them.
      - Run the robustness grid and report a span within each commensurable panel, never across panels.
      - Run the null check that your design licenses, and name it correctly.
      - "Commission at least one adversarial review, and add a human reviewer when one is available. Neither review is independent verification: confirm or refute every flag with a data check."
      - "Write the adjudication: what survived, what did not, and what you still cannot rule out."
    rails:
      ethics: Report the checks that hurt your finding as fully as the ones that helped.
      evidence: A flag is real when a check confirms it, not when the reviewer sounds certain.
      ai: An AI reviewer is another critique, not independent verification.
      uncertainty: Specification spread measures your choices; it is not an uncertainty interval.
    revisit: >-
      A finding that does not survive its own pre-listed checks returns to
      Studio 5 or 7, not to the writing studio.
    milestone_title: "Your robustness audit"
    milestone_reason: >-
      A result you have not tried to break is a result you do not yet
      know. This milestone attacks your own finding the way a hostile
      reviewer would: pre-listed robustness checks, negative tests with
      predictions written before the run, an adversarial review, and an
      audit of where your confidence actually comes from. What survives,
      you can defend. What does not, you now know before a reader finds
      it for you.
    hands_forward: >-
      Milestone 9 writes down only the claims this audit licenses, at the
      strength it licenses them.
    contributions:
      robustness-sensitivity: >-
        your pre-listed robustness grid with its full results, direction
        and size, plus the named null check
      negative-tests: >-
        your negative test and diagnostic, each with the prediction you
        wrote before running it
      ai-adversarial-reviewer: >-
        your commissioned adversarial review with every flag adjudicated
        against the data, confirmed or refuted
      false-confidence: >-
        your confidence audit: the not-yet-recomputed list, where belief
        in the headline number comes from, and your boundary sentence

    practice_kit:
      worked_example: |
        The restaurant-prices robustness grid, a simulated teaching
        record, pre-listed before any check ran: drop each cuisine category in turn; swap the deflator
        (all-items index versus food-at-home); entree-only versus
        all-items. Results reported as direction and size, together.
        The negative test, predicted first: nationally priced bottled
        drinks should show little local drift — and did. The
        adversarial review returned three flags; two were confirmed
        against the data, one refuted with the leave-one-out table. The
        adjudication: the gap survives every pre-listed check except the
        smallest cuisine category, and that limit is now part of the
        claim.
      faded_task: |
        The grid is filled but the adjudication is blank, and one
        reviewer flag ("the archive over-samples chains") sits
        unadjudicated. Write the adjudication: what survived, what did
        not, what cannot be ruled out — and settle the flag with a data
        check, not a feeling.
      starter: |
        Your grid: rows pre-listed with dates BEFORE running · check ·
        prediction · direction and size found · survives? Plus one named
        null check and the three hardest reviewer flags with their
        checks.
      verification: |
        Compare the grid's pre-list date against the run dates: any row
        added after a disappointing result is reported as exploratory,
        never as a pre-listed check. Spans stay within commensurable
        panels.
  - id: write-bound-disclose
    purpose: >-
      Write the claim you can defend, bounded by what your evidence supports,
      with your AI use disclosed.
    produces: >-
      A stand-alone research note or report draft, a claim-to-evidence table,
      and your AI disclosure statement.
    steps:
      - Write your claim as one sentence, with its boundary attached in the same sentence.
      - "Build the claim-to-evidence table: every claim, the output that supports it, and the check that verified it."
      - State your uncertainty and your limitations in the words a reader outside your field would use.
      - Write your AI disclosure from your ledger, not from memory.
    rails:
      ethics: Disclosure includes what you sent to tools, not only what they produced.
      evidence: A claim with no row in the table does not appear in the draft.
      ai: The sentence that ships is yours, whatever drafted it.
      uncertainty: Findings are never communicated as certainties.
    revisit: >-
      A claim you cannot fit in the table is a claim to cut or a check to
      run, and both send you back a studio.
    milestone_title: "Your bounded claims"
    milestone_reason: >-
      Writing is where research leaves your head and can first be misread.
      This milestone turns your audited results into claims a stranger can
      weigh: each one bounded by what the design established, traced to
      the output that supports it, and accompanied by an honest account of
      what AI did along the way. The discipline is simple and strict. A
      claim with no row in the evidence table does not ship.
    hands_forward: >-
      Milestone 10 adapts these bounded claims to a real audience and
      rehearses their defense.
    contributions:
      results-to-claims: >-
        your claims with verbs downgraded to what the design established,
        each carrying its boundary line
      claim-evidence-tables: >-
        your claim-evidence table, one row per claim with claim, evidence,
        trace, and boundary, every number traced to its output
      ai-disclosure: >-
        your AI-use disclosure, written from the ledger and naming what
        you did not verify
      poster-to-note: >-
        your stand-alone note draft: the problem-gap-question spine,
        methods, results with uncertainty, discussion, ordered findings
        with the headline claim's boundary inside, references, your
        disclosure placed, and the pointer to the package Studio 11 will
        freeze

    practice_kit:
      worked_example: |
        Two rows of the restaurant-prices claim-evidence table (a
        simulated teaching record; the discipline, not the numbers, is
        what transfers).

        Row 1 — claim: "on this panel, listed entree prices rose 6.1
        points faster than the overall index." Evidence: the growth
        comparison with its caveat. Trace: notebook cell 14's printed
        output. Boundary: no claim about affordability, fees, or cause.

        Row 2 — claim: "the gap survives dropping any single cuisine
        except the smallest." Evidence: the leave-one-out table. Trace:
        cell 21. Boundary: the smallest category is a stated limit.

        The disclosure names the tools, the drafting they did, and the
        two numbers the reader re-derived by hand.
      faded_task: |
        A third row claims "students noticed the increase" — its
        evidence cell is empty and no output supports it. Do what the
        discipline requires: trace it or cut it, and write one sentence
        on which you did and why.
      starter: |
        Table columns: claim · evidence (result plus uncertainty) ·
        trace (the exact cell or source) · boundary. Note spine:
        problem, gap, question · findings ordered by support · headline
        with its boundary inside · limitations sized to the claim.
      verification: |
        Pick one row at random, reopen its traced output, and read the
        number again. A table you have not spot-checked is a list of
        hopes.
  - id: adapt-and-defend
    purpose: >-
      Turn your bounded claims into an artifact ready for publication or
      presentation, and rehearse defending it against real questions.
    produces: >-
      A short venue contract and one artifact ready for publication or
      presentation that satisfies it - a paper or research note, a seminar
      or conference talk, a poster, or another venue's format - with a
      content map tracing every load-bearing claim and number, and a
      defense rehearsal record. This is not yet public release.
    genre_guide: |
      The goal of this studio is an artifact ready for publication or
      presentation: a manuscript a venue could receive, a talk a room
      could hear, a poster a conference could hang. Start with a **venue
      contract**: your written record of what the audience will receive
      and what the venue allows. Name the audience, the medium, the
      length or space limit, the required elements, the accessibility
      needs, the submission rule, and the question channel. One line each
      is enough. Example: a five-minute recorded talk, six slides,
      captions required, no live questions.

      Every format carries the same research core: the bounded claim, the
      evidence that earns it, uncertainty and limitations, traceable
      numbers and citations, and whatever disclosure or permission
      information the audience needs. The format only decides where those
      pieces live. Choose the row that fits your venue, work the lessons it
      names, and when you borrow a technique from another row, name the
      technique rather than claiming the whole lesson transfers.

      | If your venue asks for | build it with | then test and rehearse |
      |---|---|---|
      | a paper or research note | your Studio 9 note, developed to the venue contract: sections, length, references, and the figure rules for any figure | the audit on the manuscript; Difficult Questions in writing |
      | a seminar or conference talk | Research Pitches' spine, expanded section by section to the venue's length; slides follow the poster lesson's figure rules | the audit on the deck; Difficult Questions, spoken |
      | a short pitch | Research Pitches | Difficult Questions, spoken |
      | a poster | Research Posters | Poster Criticism, then Difficult Questions |
      | another format | the venue contract plus the nearest row, naming what transfers | Difficult Questions, in the venue's own mode |

      The poster lessons are this book's fully worked visual example: one
      surface, no narrator, every number exposed. The paper route runs on
      your Studio 9 note; the seminar route runs on the pitches lesson's
      spine. Difficult Questions is for everyone. If your venue has no
      live questions, the rehearsal still happens: have a peer or an AI
      reviewer send you hard questions in writing, and record defend,
      concede, or do-not-know for each.
    steps:
      - Write your venue contract using the guide above, then say what your claim must lose to fit that format.
      - "Write a transformation memo from your Studio 9 note: what expands, what compresses, what moves, what becomes visual, and what becomes spoken."
      - "Build a content map before you build the artifact: where the claim, the evidence, the boundary, the uncertainty, and the disclosure will each live."
      - Build the artifact to its venue contract, keeping every load-bearing number, figure, and citation traceable to the claim-evidence table.
      - "Test it in its actual mode: scan the poster at gallery distance, time the talk aloud, advance the deck without narrating, or hand the manuscript to a cold reader."
      - Rehearse the defense against the three hardest questions you can construct, and record which you could not answer; those are your next studio's agenda.
    rails:
      ethics: An adaptation that drops the limitations is not a shorter version, it is a different claim.
      evidence: Every figure that travels carries its verification with it.
      ai: If AI edits the artifact or generates questions, record what changed and verify the result; every defend-or-concede decision remains yours.
      uncertainty: The shorter the format, the more explicit the boundary has to be.
    revisit: >-
      A question you cannot answer in rehearsal is evidence, and it sends
      you back to the studio that owns it.
    milestone_title: "Your artifact, ready to publish or present"
    milestone_reason: >-
      A claim becomes public the moment an audience can question it, and
      audiences do not read contracts. They read papers, hear seminars,
      scan posters, and ask hard questions. This milestone produces the
      artifact itself, ready for publication or presentation: a
      manuscript a venue could receive, a talk a room could hear, a
      poster a conference could hang, each satisfying its venue contract.
      The poster lessons carry the fully worked visual example; the paper
      route develops your Studio 9 note; the venue contract and content
      map carry every format. The rehearsal record matters as much as the
      artifact: the questions you cannot answer yet are the truest map of
      what remains.
    hands_forward: >-
      Milestone 11 lets strangers rerun what you have just defended, which
      is the one test rehearsal cannot give you.
    contributions:
      research-posters: >-
        if your venue is a poster, or your format carries a quantitative
        figure: the draft with labeled values, uncertainty shown as the
        design licenses (interval or caveat), and a headline verbed to
        your boundary
      poster-criticism: >-
        if your venue is a poster: the gallery-walk audit of your draft,
        hits ranked by how far the error travels, fixed once, and the
        lock call
      research-pitches: >-
        if you will speak, whether a pitch, a seminar, or a conference
        talk: your 30-second and 3-minute spines, built boundary-first,
        tested aloud on an outsider, and expanded to the venue's length
      difficult-questions: >-
        your five hardest fair questions with defend-or-concede answers,
        and your uncertainty-and-limitations statement in ULN form
    bring_note: >-
      Your format decides one more input. For a paper or research note,
      bring your Milestone 9 note; for a seminar or talk, the pitch
      spine; for a poster, the visual pieces above; for another format,
      the nearest row's input plus your venue contract. Difficult
      Questions is everyone's.

    practice_kit:
      worked_example: |
        The restaurant-prices venue contract, worked as a simulated
        teaching record: a twelve-minute class seminar, slides allowed, live questions. Transformation memo:
        the note's methods compress to one spoken minute; the growth
        figure becomes the only slide with numbers; the caveat moves
        into the spoken spine, right after the headline. Mode test: the
        talk ran 11:40 aloud, and the one figure survived the
        back-of-room squint. Rehearsal: five hard questions drafted;
        four defended, one conceded ("cause? — outside these words").
      faded_task: |
        The contract and memo exist for a poster venue, but the content
        map is half done: uncertainty and disclosure have no location
        yet. Place them where the audience actually meets them, and
        answer one hard question in writing with defend, concede, or
        do-not-know.
      starter: |
        Venue contract fields: audience · medium · limits · required
        elements · accessibility · submission rule · question channel.
        Content map: where the claim, evidence, boundary, uncertainty,
        and disclosure each live. Then the mode test and the rehearsal
        record.
      verification: |
        Every number on the artifact traces to a claim-table row — walk
        them once. Then run the mode test for real: time the talk, scan
        the poster at distance, or hand the manuscript to a cold reader.
  - id: reproduce-and-package
    purpose: >-
      Prove that someone who is not you can obtain your result from your
      materials.
    produces: >-
      An independent cold-run record and a reusable research package.
      Working alone, the record is a clean-environment rerun labeled
      "solo proxy; external cold run pending" — the label, and the honesty
      it enforces, are part of the artifact.
    steps:
      - "Assemble the draft package first: data or its access route, code, environment, documentation, and licence."
      - Run your own package cold, from a clean environment, following only your written instructions.
      - "Then the external test: have someone else run it without your help, and log every place they had to ask you a question. Working alone? Rerun it yourself after a real break, instructions only, and label the record 'solo proxy; external cold run pending' — a proxy never becomes a claim of independent reproduction."
      - "Fix what the runs exposed — every question asked is a missing line in your documentation — and freeze the final manifest with its date."
    rails:
      ethics: What can be shared is set by your permissions, and the package says so explicitly.
      evidence: Reproduction is the evidence rail's final test.
      ai: An assistant can generate documentation; only a cold human run can validate it.
      uncertainty: Reproduce the uncertainty statement, not only the point estimate.
    revisit: >-
      A failed cold run is a finding about your work, and it precedes any
      release.
    milestone_title: "Your reproducible package"
    milestone_reason: >-
      Research that only runs on your machine, with you present, is
      testimony rather than evidence. This milestone proves that someone
      who is not you can obtain your result from your materials alone: a
      cold run, a stranger's run (or, working alone, its honestly labeled
      solo proxy), and a package that carries data access, code,
      environment, documentation, and licence. It is the boundary
      between work you finished and work others can build on.
    hands_forward: >-
      Milestone 12 decides whether the packaged work is ready to leave
      your hands, and what the next cycle should ask.
    contributions:
      replication-reproduction: >-
        your cold reproduction record: every number re-run from the top,
        one undisclosed choice varied, and missingness classified before
        any filling
      research-packages: >-
        your research capsule: notebook, data or its access recipe,
        environment record, README, licence with its reuse boundary and
        restrictions, the exact output locations, and a cold rerun in a
        second environment

    practice_kit:
      worked_example: |
        The restaurant-prices capsule, five parts: the runnable
        notebook; the panel data with its access note (archive URLs and
        retrieval dates, since the archive itself is public); the
        environment record; a README whose first three lines say what
        the project asks, what the headline found, and how to run
        everything; the licence. The cold-run record: a clean Colab
        session, instructions only, numbers matched — labeled "solo
        proxy; external cold run pending."
      faded_task: |
        The README is missing its run order, and one notebook cell
        loads data from a hard-coded local path no stranger has. Fix
        both, rerun cold, and add the line the record now needs: what
        changed and why the rerun date moved.
      starter: |
        Capsule checklist: runnable notebook · data or its access
        recipe · environment record · README (what it asks, what it
        found, how to run) · licence · the cold-run record with its
        honest label.
      verification: |
        Rerun in a second clean environment following only the README.
        Every number in the note must match the rerun's output; a
        mismatch is a finding about the package, and it precedes any
        release.
  - id: release-next-cycle
    purpose: >-
      The book's special topic, turned onto your finished project: direct
      an advanced multi-role AI review — agentic where your tools truly
      plan and act, human-sequenced otherwise — under your own rules,
      adjudicate what it returns, decide whether the work leaves your
      hands, and turn the largest unresolved limitation into the next
      study.
    produces: >-
      A review-management record for your directed AI team, a release
      audit recording release or withhold-pending-a-named-repair, your
      final dossier with a complete manifest, an explicit stopping rule,
      and your next-study agenda.
    steps:
      - "Check that nothing moved since your Studio 11 cold run: any change to the package — a number, a claim, the data, the code, the environment record, or the instructions a stranger would follow — makes that run stale. Repeat it before you release."
      - "Run the closing review as a directed team: scoped loops (a writer, a skeptic, an auditor at minimum), wired so each role's input exists before it starts, escalation rules written first, one node kept human. Declare who chooses each next step — you, a fixed script, or an agent that plans and calls tools — and never call a manually sequenced chat autonomous. A single well-run assistant playing the roles in turn is a legal team; record what you actually ran, never invented activity."
      - "Run the release audit and mark each item clear, pending, or blocking: permissions, participant promises, disclosure, package-matches-cold-run, reproducibility, claim boundaries, and uncertainty."
      - "Make the release decision. A blocking item means withhold pending the named repair, written as this version's reason — not a euphemistic release."
      - "Assemble the dossier with a manifest: contract versions, evidence registry, permissions, measurement, analysis and claim ledgers, AI ledger, artifacts, package, and revision history — each marked present, absent with reason, or not applicable."
      - "Write your stopping rule: why you are stopping here rather than running one more check, stated as a decision."
      - "Write the next-study agenda: tie the next question to an unresolved limitation, a warrant gap, or something this cycle's evidence opened."
    rails:
      ethics: Release is the last point at which a permission problem can still be prevented.
      evidence: The dossier is the evidence rail made assemblable.
      ai: This studio is the ledger's graduation — loop wiring, conflicts, overrides, and independence checks all land as rows before it closes; record the team you actually ran.
      uncertainty: State what you still do not know as clearly as what you found.
    revisit: >-
      The next-study agenda is the revisit; a research cycle ends by
      declaring the next one.
    milestone_title: "Your release and next cycle"
    milestone_reason: >-
      The book opened with one rule: AI is your arm, not your brain. This
      last studio is its special topic, and the rule's graduation:
      advanced practice in directing AI for research — several scoped
      agents at once, wired so each role's input exists before it starts,
      adversarial by design, escalated to you when they conflict or agree
      too easily — turned onto your own finished project as its closing
      review. The two agent lessons teach the wiring and the escalation;
      a single well-run assistant playing the roles in turn runs the same
      discipline. The release standard does not change with the tool
      count: every public claim must sit inside its evidence and
      permissions, the package must still match the cold run that tested
      it, and the team's records land in the audit, never in place of it.
      What no agent can do is make the two decisions this milestone
      exists for: whether this work is ready to leave your hands, and
      what should be asked next. The book closes where it began: tools
      extend your reach, and the decision about what leaves your hands
      remains yours.
    hands_forward: >-
      This is where the chain closes, on a decision. If the audit clears,
      the artifact leaves your hands; if it does not, this version names
      the repair that still blocks release. Either way the next-study
      agenda opens the cycle that follows.
    contributions:
      managing-ai-agents: >-
        your closing-review team: the loops' scoped jobs, the dependency
        wiring and turn counts, and the one node you kept human
      conflicting-agents: >-
        your escalation rules, and one load-bearing pair of outputs
        (agreeing or not) diagnosed and settled by your own check, with
        any override on record
      final-portfolio: >-
        your finished research artifact with every claim bounded, your
        AI-management portfolio with the team record inside, and the
        rehearsed three-movement defense
    practice_kit:
      worked_example: |
        The restaurant-prices closing review, capability-honest. Review
        mode: one assistant playing three roles in turn (writer,
        skeptic, auditor), sequenced by the reader — recorded exactly
        so, never as autonomous. The audit rows: permissions clear;
        disclosure clear; package-matches-cold-run clear;
        reproducibility clear; claim boundaries clear; uncertainty
        clear; archive-terms citation PENDING (the archive's research
        clause needs the exact link). The decision: withhold pending
        that one named repair — written as this version's reason, not a
        failure. Stopping rule: "every surviving claim has a check I ran
        myself." Next-study agenda: the delivery-fee question wording B
        opened.
      faded_task: |
        The audit rows are filled and one is BLOCKING: a number in the
        note changed after the cold run. Write the decision the gates
        force, the version reason, and the one-line plan that turns the
        withhold into a release.
      starter: |
        Audit checklist: permissions · participant promises ·
        disclosure · package-matches-cold-run · reproducibility · claim
        boundaries · uncertainty, each clear / pending / blocking.
        Dossier manifest: contract versions · evidence registry ·
        permissions · measurement · ledgers · artifacts · package ·
        revision history, each present / absent-with-reason / n-a.
      verification: |
        Check the package-current gate against your Studio 11 record by
        date and content, and read your review-mode declaration once
        more: if a manually sequenced chat is described as an agent
        deciding its own next step, correct the record before you
        decide anything else.
