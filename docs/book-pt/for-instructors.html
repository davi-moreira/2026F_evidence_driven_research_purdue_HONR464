    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = "Wrong password.";
  }
});
</script>
