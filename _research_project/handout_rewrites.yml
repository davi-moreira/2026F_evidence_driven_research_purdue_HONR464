        not leave its researcher alone in the opening weeks. This milestone catches that

        thing before it evaporates, and then it makes you choose. By Friday you have a

        **committed'
      why: 'The opening sentence of Purpose pinned both ends of the arc to specific months ("in December" / "in August"). Recast as relative semester positions, which is what the sentence actually means. "By Friday" is kept untouched: it is the stable weekly rhythm. The find extends one line further than strictly needed so the paragraph rewraps cleanly instead of leaving a stub line.'
