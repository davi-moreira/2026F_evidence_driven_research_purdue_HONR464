# handout_rewrites.yml — how the DATED milestone briefs become DATE-FREE handout PDFs
#
# `_research_project/2026Fall/milestone_NN_*.md` is the single source of truth for
# every milestone: it carries this edition's real dates, and it is what the course
# site and Brightspace point at. The PDFs Davi uploads to Brightspace must instead
# be reusable in ANY future edition, so `scripts/build_handout_pdfs.py` applies the
# rewrites below on the way to PDF. Nothing here edits the source brief.
#
# Rules are exact, ordered string substitutions. Every `find` is verified to occur
# EXACTLY ONCE in its source file; the build fails loudly if that stops being true,
# which is what tells you a brief changed under a rule.
#
# What the rewrites remove: calendar dates, deadline clock times, and semester/year
# labels. What they deliberately KEEP: the Mon/Wed/Fri meeting rhythm (stable in
# every edition and load-bearing pedagogy), whether a deadline is at-class or
# end-of-day, bibliographic citation years, and years inside URLs.
#
# Authored 2026-08-23 by a 17-agent pass, one agent per brief; every replacement was
# written to hold the briefs' student voice (second person, honors undergraduates,
# no quantitative background).
#
# To add a rule: append it under its file, keep `find` byte-exact (watch U+2014 em
# dashes and curly apostrophes), then rerun the builder.
schema: 1
files:
