      replace: 'Due: **by the end of the day on this milestone''s Friday** (you work on it at

        that Friday''s studio). Brightspace carries the exact date and time.'
      why: 'Removes the calendar date and the clock time while preserving the two things that are instructional design, not calendar: the deadline is end-of-day (not at-class), and it lands on the milestone''s own Friday, the same Friday whose studio you work at. Adds the Brightspace pointer in the brief''s own second-person voice. No em dash added.'
