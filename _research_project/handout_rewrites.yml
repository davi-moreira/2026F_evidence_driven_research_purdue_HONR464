    - find: '**M1–M17**, peaks publicly at the **Purdue Fall Undergraduate Research Expo

        poster session (Tuesday, November 17 — required)**, and closes with an oral

        **Evidence Defense** and a final research chapter in December. Every milestone'
      replace: '**M1–M17**, peaks publicly at the **required Purdue Fall Undergraduate Research

        Expo poster session**, a single day late in the semester that falls outside the

        regular class pattern, and closes with an oral **Evidence Defense** and a final

        research chapter at the end of the semester. Every milestone'
      why: Removes the pinned Expo date ("Tuesday, November 17") and the pinned closing month ("in December"). The Expo's Tuesday is a one-off event day, not part of the stable Mon/Wed/Fri rhythm, so it goes with the date; the replacement keeps the pedagogically load-bearing fact that the Expo interrupts the normal class pattern. "required" is preserved by moving it into the bolded noun phrase, so the requirement is not softened. Removes one em dash and adds none.
