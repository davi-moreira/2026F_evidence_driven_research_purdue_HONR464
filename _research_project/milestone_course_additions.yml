    retired_additions_markdown: "### Your venue is already decided\n\nThe book page lets you choose a\
      \ format. This course chooses it for you: a\nprinted poster at the undergraduate research expo,\
      \ presented with live\nquestions while you stand beside it. So the conditional pieces on the book\n\
      page are all required for you. Work the poster lesson, the poster criticism\nlesson, the pitches\
      \ lesson, and the difficult questions lesson.\n\nBuild both branches, and make them carry the same\
      \ claim.\n\n1. **The poster draft.** Built to your venue contract, and labeled\n   **preliminary**\
      \ where a viewer can see it. This milestone is not the lock.\n   The printed poster locks later,\
      \ at M13.\n2. **The spoken spine.** A 30-second hook and a 3-minute walk, both built\n   boundary\
      \ first, timed and tested aloud on someone outside your field.\n\n### Four things the course adds\
      \ to the book's practice\n\n1. **Nothing on the poster may be new.** Every number, figure, and citation\
      \ on\n   the board also appears in your M9 bounded note. Each one walks back through\n   your claim-to-evidence\
      \ table to the cell that produced it. If the layout\n   leaves a gap, let the space stay empty.\n\
      2. **Run the gallery-walk audit on your own draft** across five lenses: claim\n   boundary, figure\
      \ honesty, read path, uncertainty, and accessibility. Rank\n   every hit by how far the error travels.\
      \ Revise once in that order. Record\n   what you fixed and what you deliberately left.\n3. **Run\
      \ the Poster Critic**, the required AI reviewer role for this milestone\n   (briefing in `genai_studio/roles/poster_critic.md`).\
      \ Give it your text plus\n   a description or export of each figure. Then adjudicate: settle every\n\
      \   untraceable-number flag and claim-boundary flag with a check in your own\n   material. Record\
      \ at least one flag you refuted, and name the check that\n   refuted it. A flag with no check behind\
      \ it changes nothing.\n4. **Rehearse five hard questions, not three.** Write the five hardest fair\n\
      \   questions a visitor could ask you. Answer each in two sentences, and mark it\n   defend, concede,\
      \ or do-not-know. Add your uncertainty and limitations\n   statement in ULN form: uncertainty, then\
      \ limitation, then next step. Every\n   do-not-know becomes your written agenda for M13.\n\n###\
      \ At the Friday studio\n\nYour draft goes through an **artifact criticism gallery**. You read your\n\
      classmates' artifacts the way the expo audience will, from the distance that\naudience will use,\
      \ and they read yours. Then you rehearse your defense against\ntheir hardest questions, revise once,\
      \ update your ledger, and submit before the\nstudio closes.\n\n### How it is judged\n\nThe book\
      \ page's rubric governs your file. Two failures here are not recoverable\nby strength elsewhere.\
      \ The first is a number shown on the board with no path\nback to your data, or an element the M9\
      \ note does not contain. The second is a\nclaim that grew under compression, so the board or the\
      \ spine says more than the\nnote earned. A shorter sentence is not a bigger finding.\n"
