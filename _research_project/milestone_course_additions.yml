      before any run. Rewritten whole as a statement of the course''s tighter shape only: the list is
      exactly three, and each row names its reviewer attack.'
    retired_additions_markdown: '### Freeze your three checks at the week''s lecture


      1. Your pre-list is exactly three checks, and each one names the reviewer attack it answers.

      2. At the transfer block that closes the week''s lecture, put each check into the studio workbook
      as the exact code you will run, in quotes.

      3. The workbook parses that code for syntax and runs nothing else. What leaves the room is a commitment,
      not a result.

      4. Run none of the three before the Friday studio. A check that occurs to you once numbers are on
      screen is still worth running: label it exploratory and keep it off the frozen list.


      ### Run and adjudicate at the Friday studio


      You execute the frozen audit at the studio, working with your AI assistant.


      1. The adversarial review has a named reviewer here: the **Robustness & Sensitivity Reviewer** (briefing:
      `genai_studio/roles/robustness_sensitivity_reviewer.md`).

      2. One studio does not hold enough minutes for a check per flag, so you triage. Rank the flags by
      how much damage each would do to your claim if it were true.

      3. Verify the most damaging flag in the room. Record four fields: the flag as raised, the check
      you ran, the output it produced, and your verdict of confirmed or refuted.

      4. Put every remaining flag on a **pending register**: the flag, its damage rating, the check that
      would settle it, and when you will run it. Pending is an honest state here, and it is graded as
      one.

      5. Where one of your checks refuted a flag, name the **loudest wrong flag**: the objection the reviewer
      stated most confidently that your data did not support.

      6. Walk the room through what survived, defend the flag you verified there, and hand over your register.
      Submit the same day.


      ### Hand over a notebook that reruns


      Your audit runs in a Colab notebook. Set sharing so the instructor can open **and rerun** it, and
      paste that link inside your PDF. Every check you report has to run from that notebook, so restart
      it and confirm the audit reproduces before you submit.


      ### How this part is judged


      These course pieces are read inside the Book Milestone rubric. Graders look for a scaffold frozen
      at the lecture, the top flag settled by a check whose output you show, a complete register for the
      rest, and a notebook that reruns.

      '
    retired_extra_artifacts:
    - name: Shared, rerunnable Colab notebook link (the audit notebook)
      why: The brief requires the instructor to open AND rerun the audit so every reported check reproduces.
        A PDF cannot execute code, so the live notebook has to be shared alongside it; the link is pasted
        into the PDF but the runnable object itself is separate.
