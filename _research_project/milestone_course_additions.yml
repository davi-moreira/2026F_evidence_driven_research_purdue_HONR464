      re-derived numbers' from Lesson 23. If Lesson 23's 'It is your turn' does not actually require the
      declare-the-tolerance-first step, that step is orphaned and should be added to my section.
    - 'Filename versus content mismatch: the brief lives at milestone_07_experimental_measurement_protocol.md
