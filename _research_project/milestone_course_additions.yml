      \ the lost points. A late written package loses 10 points\n  per day for up to three days.\n\nTwo\
      \ rules bite hard. Document fewer than three poster reviews and your craft\nscore cannot rise above\
      \ Developing. Log a question you were not actually asked,\nor attribute a flaw a poster does not\
      \ carry, and your evidence-integrity score\ndrops to Beginning regardless of everything else.\n"
