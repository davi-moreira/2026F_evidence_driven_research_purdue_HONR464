    retired_additions_markdown: '### One submission, two book artifacts


      Your PDF carries two artifacts from the book''s ladder. Your reproducible package is Book Milestone
      11. Your research note is Book Milestone 9 written again, as version 2. Version 2 answers evidence
      that did not exist when you first drafted the note: real questions from readers at the Expo, and
      a stranger''s cold run of your own package. Work both book pages, then add the course sections below.


      One book instruction does not apply to you. Book Milestone 11 offers a "solo proxy" label for anyone
      with no external runner. You have a real peer cold run, so use it.


      ### 1. Build the inbound list


      Two streams of outside evidence reached your project, and neither came from you. Gather them into
      one numbered table before you decide anything.


      - **Expo criticism.** Pull these rows from your M15 tally and your defense revision record.

      - **Your peer''s cold run.** A classmate opened your package without you in the room and returned
      a threat-ranked list of what broke and what they had to ask you. Keep their ranking visible.


      Tag every row with its source, the item in one sentence, and the part it touches: claim, evidence,
      writing, or package. A question you were asked five times is one row with its recurrence noted,
      not five rows. A reader should be able to count your rows, count your verdicts, and get the same
      number twice.


      ### 2. Write the adjudication record


      This is the heart of the milestone, and it opens your note. Give every row a dated verdict, and
      exactly one of three.


      1. **Accept.** The criticism was right. Say what changed and where a reader can see it.

      2. **Rebut.** It does not hold. Give the evidence, not the irritation. "The reader misread the table"
      is the start of a reason, not the whole of one.

      3. **Bound.** It holds in part, so the claim narrows. State the new boundary inside the claim sentence
      itself, never in a footnote.


      Each verdict carries a reason in your own words, one you could defend aloud. Nothing sits undecided,
      and nothing is answered with silence. A claim that shrank under public testing is the system working,
      so say plainly that it shrank and what shrank it.


      ### 3. Revise the note, then repair the package


      Revise the five-move spine wherever an accepted or bounded verdict demands it, and nowhere else.
      Let the note grow only where public questioning showed a reader needed more, usually to two to four
      pages. Order findings by how much evidence backs each: strongest first, exploratory last and clearly
      labeled. An AI tool may be your writing critic, never your ghostwriter. Reject every edit that upgrades
      a verb or quietly drops an "in this sample".


      Then rebuild the package your peer ran. Every place they had to stop and ask you something is a
      missing line in your documentation, so write those lines now, or log the reason the gap stays. Audit
      yourself against the five package sins: a hard-coded path, a missing seed, a by-hand edit, an undocumented
      exclusion, and stale or unversioned data. Name the one sin you found and fixed.


      Redraft your AI disclosure from the full ledger rather than from memory. It now covers the poster
      weeks and the peer exchange as well as this revision.


      ### 4. Run it clean a second time


      Any change to the package makes the previous run record stale. A number, the data, the code, the
      environment record, or one line of the instructions a stranger follows: each of those is a change.
      So after your last edit, run the package once more in a fresh environment, restart-and-run-all,
      following only your written instructions. Record the date, the environment, and the result. The
      headline number has to come back, and so does its uncertainty statement. Label the record honestly
      as an author rerun, and keep your peer''s run beside it as the independent evidence.


      ### 5. At the Friday studio


      Two things happen at the studio itself, not before it. A peer reads your adjudication table and
      questions it. Then you perform the second clean run, and you submit at studio close.


      ### What you hand in


      One PDF, in this order: the inbound list, the adjudication record, the note, the updated claim-evidence
      table, your AI disclosure, and the clean-run record. The package cannot live inside a PDF, so share
      it as a link the instructor can open, holding the README, the seeded notebook, your data or its
      access recipe, the environment record, and the licence and permissions note. Check that it runs
      top to bottom when opened cold.


      ### How it is judged


      The book page''s rubric governs the PDF. Three failures cap a rubric row on their own: an inbound
      item left with no verdict, a headline number that does not rerun from your package, and a run record
      older than your last edit, which counts as not reproducing. An honest "this part did not reproduce,
      and here is what broke" never triggers a cap. The cap is for the false pass.

      '
