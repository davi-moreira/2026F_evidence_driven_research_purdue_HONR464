    additions_markdown: '### Defend your work out loud


      Your **Evidence Defense** is performed live in class and graded in the room. It is never a file
      you upload.


      1. You defend once, in the slot you are assigned. Rounds run in the Wednesday defense blocks of
      the last two weeks, and the final round runs in the last Friday studio.

      2. A full slot gives you ten minutes to defend plus five minutes of cross-examination. A compressed
      round keeps the same order and the same proportions, and the defense schedule gives your exact length.

      3. Use three movements, in this order. **Claims** (about three minutes): your headline claim and
      the exact edge it stops at. **Choices** (about four minutes): why this compass position, this data
      strategy, this measurement, and the road you did not take. **Verification** (about three minutes):
      how you checked, what survived, which sources you confirmed real, and how your release audit came
      out.

      4. Bring your full claim ledger with your three weakest rows already marked, plus your dossier draft
      and your package, ready to open live if someone probes.

      5. Where your ledger says a claim reaches too far, concede precisely and name the smaller true claim.
      A well-timed concession is scored as strength.

      6. Three moves are forbidden: inventing a new claim under pressure, taking a concession back by
      insisting rather than by evidence, and blaming the AI tool.


      If a defense falls apart, it converts to a supported walkthrough and you may elect a redo slot later
      in the sequence. That is not a zero.


      ### Cross-examine your classmates


      On every day you are not defending, ask the defenders at least one question. Ground it in a ledger
      row, a decision, or a verification step. Probe hard, stay respectful, and never make it personal.
      Your questioning is scored, so silence costs you.


      ### Close the dossier in the final studio


      The last Friday studio runs a final dossier checklist against your draft. Work through it in the
      room and close every open item, or write the reason it stays open, before you upload. Arrive with
      the work complete enough to submit at the start of that session rather than at the end.


      ### What your submission contains


      1. One PDF carries the whole milestone: your final research chapter, then your release audit with
      its decision, your dossier manifest, and your AI-management portfolio, each as a clearly marked
      section.

      2. Upload the runnable notebook behind the chapter as well. It must pass restart-and-run-all, and
      every headline number in the chapter must rerun from it with no manual steps.

      3. The portfolio section is always yours alone, written from your own full-semester ledger, even
      if your project is shared.


      ### If your project is an approved group


      Share the chapter and the notebook, and name every member on both. Write your own portfolio and
      give your own defense. Those two are scored per person, so members can finish with different scores.


      ### This milestone is terminal


      There is no revision window and no resubmission. The deadline governs the grade, so assemble everything
      before you upload.


      ### How it is judged


      The Book Milestone rubric that follows scores the milestone artifact. Separately, your chapter,
