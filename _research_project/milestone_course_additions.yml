      3. **Evaluate at least three other posters.** Take your notes at each poster\n   itself: the presenter's\
      \ central claim, the evidence shown for it, and the\n   one place the two do not line up. These\
      \ public evaluations are not the\n   confidential Peer Evaluation component of your Final Project.\n\
      \n### The written reflection package\n\nWork this after the conference, across the two asynchronous\
      \ reflection\nsessions, with your AI assistant. All of it goes inside your one submission\nfile,\
      \ typically two to four pages.\n\n1. **A coded question tally.** A real table, one row per question,\
      \ with three\n   codes: **type** (method, alternative-explanation, so-what, generalization,\n  \
      \ AI-use, or other), **target** (claims or communication, tagged where the\n   *fix* lives rather\
      \ than where the sting lives), and **recurrence** (how many\n   times you heard a version of it).\n\
      2. **The pattern.** One or two sentences read straight off the counts: which\n   type carried the\
      \ most recurrence-weighted questions, and whether the heavier\n   target was claims or communication.\
      \ Cite the rows behind it. Then name the\n   single claims question that recurred enough to count\
      \ as a finding.\n3. **An honest reflection paragraph.** What the public test changed in how you\n\
      \   see your question, your evidence, or your boundary, stated with its\n   uncertainty and its\
      \ limits. \"Warm room, but nobody probed my weakest claim,\n   so I still do not know if it holds\"\
      \ is a strong answer, not a weak one.\n4. **A defense revision record.** This is the spine of the\
      \ milestone. Give\n   every place the questioning exposed something its own row with three cells:\n\
      \   what it exposed (naming the tally rows behind it), the revision written out\n   in the exact\
