      Craft 0 and returns the submission unread. The book page carries only the not-authorized blocking
      gate. If you want the caps to keep their teeth on the PDF, they need a home in the standard header
      or the course grading page, because the Book Milestone page never states them.'
    - The course brief's revision policy (a revised submission within 7 days of feedback recovers up to
      half the lost points) and late penalty (minus 10 points per day, up to 3 days) appear nowhere on
      the book page. Confirm the standard submission header carries both, or they vanish from M6's student-facing
