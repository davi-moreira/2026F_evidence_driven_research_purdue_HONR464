      \   version (at most 75 words), a ninety second version (at most 200 words), and a\n   two minute\
      \ version (at most 300 words), each showing its word count. Each\n   length has its own job: earn\
      \ the next ninety seconds, then deliver the finding\n   with its bound, then add the choice you\
      \ would defend.\n3. **The same boundary sentence at all three lengths**, in the same words.\n  \
      \ Compression drops blocks, never bounds: no verb, quantifier, or scope word\n   gets stronger in\
      \ a shorter version than in a longer one.\n4. **A poster integration outline.** For each length,\
