      - The **Peer Review score** judges the quality of the criticism itself: findings\n  that reach the\
      \ argument and not only the layout, calibration on every sheet,\n  the wrong-inference test answered\
      \ everywhere, and a response record that\n  ranks, repairs, rejects with reasons, and flags recurrence.\n\
      \nNeither score evaluates your own poster.\n"
