    schedule_note: null
  M07:
    schedule_mark: true
    classification: additions
    reason: 'The Book Milestone page asks only for the declared analysis, the result with uncertainty,
      a clean restart, an environment record, and a claim-to-output trace. The course adds two things
      the page never mentions: a required Prediction and Leakage Auditor pass whose flags must each be
      settled by a check in the student''s own pipeline, and a 150 to 250 word Undergraduate Research
      Conference abstract that must clear an internal instructor gate at the Friday studio because its
      clock is external to the course.'
    schedule_note: URC abstract + conference application
    additions_markdown: '### The conference submission


      Two things leave your hands this week on the conference''s calendar rather than

      on your research schedule, and the book milestone has neither.


      **1. The abstract the conference publishes.** Write the abstract you would submit

      to the Undergraduate Research Conference, roughly 150 to 250 words: the question,

      what you measure, the analysis your pipeline executes, the verified result with

      its uncertainty, and the boundary around the claim. It clears an internal gate at

      the studio before it goes out. The gate has one rule: the abstract may use only

      the claims your current verified result licenses. Your result is verified this

      week and not yet audited, so your wording has to survive next week''s robustness

      work without becoming false.


      **2. The application that puts your name on the programme.** Apply to present a

      poster through Purdue''s Undergraduate Research site. The form wants your title,

      your abstract with no author name inside the abstract box, five keywords, you as

      author, in-person poster presentation, your availability on the day, a research

      category and judging unit, and a faculty mentor of record: Davi Cordeiro Moreira,

      dcordeir@purdue.edu. An application without a mentor does not stand.


      Save the confirmation as a PDF and submit it as your proof of application. Without

      that confirmation there is no poster session for you to present at, however good

      the rest of your project is. The deadline belongs to the conference, not to this

      course, and it is posted on your course platform.

      '
    instructor_notes:
    - 'Rubric mismatch in KIND, not only scale: the course brief adds four hard caps (fabricated or unretrievable
      source, untraceable number, non-reproducing result, missing AI Research Ledger) plus an explicit
