      \ on that poster, and stays kind but critical: you attack the\n   claim, never the person.\n6. **A\
      \ post-release note.** Half a page answering three questions honestly. Did\n   anything move between\
      \ your release audit and the conference? Which audit\n   rows did the public test press on? Does\
      \ the release decision still stand? If\n   something surfaced that would have made you withhold,\
      \ write the repair that\n   now blocks the next release.\n7. **A self-reflection check.** Two lines,\
      \ measured against your counts rather\n   than the mood of the room: one thing your presentation\
      \ did well, one thing\n   you would do differently. Write these yourself. No tool can name a weakness\n\
      \   in your own work honestly for you.\n\nAlso include, inside the same file, proof that you presented\
      \ and a record of\nyour three poster reviews. A photograph or a small table is fine.\n\n### How\
      \ it is judged\n\nTwo separate scores come out of this milestone.\n\n- The **live presentation**\
