      \ request or an attack. At least three questions you will ask the visitor.\n   One prepared \"my\
      \ design cannot settle that\", with the smaller true claim you\n   offer instead.\n6. **One public\
      \ invitation post.** Post publicly and professionally, inviting\n   your network to your session.\
