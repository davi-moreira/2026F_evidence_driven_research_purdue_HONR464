    retired_additions_markdown: "### Your format for this version is a poster\n\nThe book lets you pick\
      \ a venue format. Here the course picks it for you: this\nversion of the artifact is your **first\
      \ full poster draft** for the research\nconference. Build it on the course poster template, sized\
      \ to the conference\nprint spec.\n\nEvery block must be on the board, even where it is still rough:\
      \ title and\nauthor, the question, the design and data, the result with its uncertainty, the\nboundary,\
      \ and the AI-use disclosure. Rough is fine. Missing is not, because a\nreader cannot find the defect\
      \ in a block you never drew.\n\nTwo rules are checked on the board itself:\n\n1. Every number traces\
      \ to the cell that produced it.\n2. The uncertainty sits in the same eye-span as the claim it qualifies.\n\
      \n### What to do\n\n1. **Storyboard on paper first.** Sketch the six blocks in the order a\n   visitor's\
      \ eye travels them, and place the headline in a position you can\n   name and defend. A board laid\
      \ out inside the software takes the shape the\n   software offers.\n2. **Build the draft on the\
      \ template**, at the print spec, then check it once\n   at print scale rather than screen scale.\
      \ Text that reads well on a laptop is\n   often unreadable from two metres, and that is where your\
      \ reader stands.\n3. **Run the traceability sweep.** List every number printed on the board with\n\
      \   the notebook and the cell that produced it. Copy each one from the run, not\n   from your earlier\
      \ prose, which was rounded. Anything you cannot locate in a\n   minute goes on the list marked *blocking*.\n\
      4. **Run the reach check.** Paste your headline sentence and its interval, and\n   ask AI for every\
      \ word that reaches further than the interval licenses, with\n   no rewriting. Then confirm or dismiss\
      \ each flag against your own\n   claim-evidence table.\n5. **Run the Poster Critic** in GenAI Studio\
      \ on the draft. Do not ask whether\n   it looks good. Ask what a visitor would conclude from the\
      \ board alone,\n   without being told your claim. Record that reading; a reading is something\n\
      \   you can act on, a compliment is not.\n6. **Hand it in at the start of Wednesday's class**, and\
      \ bring a printed or\n   screen-shareable copy with you. The structured peer review runs in that\
      \ same\n   session, and the review round reads the board, not the file listing.\n\nSteps 4 and 5\
      \ each get their own ledger row, with the verification method\nnamed.\n\n### What goes where\n\n\
      Your poster draft uploads as its own file, at full print size, because it\ncannot be judged at spec\
      \ inside a letter-size page. Everything else goes in\n`lastname_m11.pdf`: the storyboard sketch,\
      \ the traceability sweep, and this\nmilestone's ledger rows.\n\n### How it is judged\n\nBeyond the\
      \ book milestone's own rubric, your draft is read for four things:\nwhether the six blocks deliver\
      \ question, result, and bound in a ninety-second\nread; whether every printed number is traced or\
      \ openly named as blocking;\nwhether the uncertainty and the boundary sentence sit on the reading\
      \ path; and\nwhether the board arrives complete enough, and early enough, for every reader\nfrom\
      \ another active project to give you an actionable finding. A draft that\nmisses the review round\
      \ has nothing to revise from before the lock.\n"
