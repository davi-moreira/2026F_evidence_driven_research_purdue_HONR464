    additions_markdown: "This is the one milestone whose artifact is about **someone else's research**.\n\
      The Book Milestone page below teaches how to build and defend your own artifact.\nThe course asks\
      \ you to turn that same criticism outward, on every other live\nproject, and then to adjudicate\
      \ the criticism your own project receives. Both\nparts go in your one PDF, as two clearly labelled\
      \ sections.\n\n### 1. Review every other active project\n\nYou review **every other active project\
      \ or poster**, with none skipped. When all\nfive projects are individual, that is four reviews;\
      \ an approved group lowers the\ncount, and you always review at least two other live projects. This\
      \ is\nindividual work even if your own project is a group project.\n\nWrite one review survey per\
      \ project, on the course poster rubric's four\ncriteria: reading architecture, traceability, uncertainty\
      \ placement, and craft.\nOn every sheet:\n\n1. Name **at least one item that is genuinely sound**,\
      \ specifically enough that\n   the author knows what to protect while revising.\n2. Give **at least\
      \ two findings**. A finding names the block it lives in, the\n   defect, and the repair that would\
      \ fix it.\n3. Answer the **wrong-inference test** explicitly: what did you conclude from\n   this\
      \ board that the author may not actually have claimed?\n\nA preference names no block, no defect,\
      \ and no repair, so it cannot be acted on\nor argued with. Your sheets are graded on findings, not\
      \ preferences.\n\nThe round is silent and independent. You write in Wednesday's class, without\n\
      conferring, and finish the sheets in the Friday studio. Readers who talk first\nproduce one shared\
      \ check wearing several names. Write first, talk after. If you\nspot a defect you also have on your\
      \ own board, that is useful to you and it\nchanges nothing about what you write here.\n\n### 2.\
      \ Adjudicate the reviews your project receives\n\nOn the sheets your own project gets back:\n\n\
      1. Rank every finding **blocking** or **optional**.\n2. Pair every blocking finding with the repair\
