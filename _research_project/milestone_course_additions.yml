# milestone_course_additions.yml — which course milestones ask for more than
# their Book Milestone, and exactly what the extra is.
#
# THE RULE (instructor ruling, 2026-08-23, NARROWED the same day). A course
# milestone is normally just its Book Milestone. The one thing a milestone PDF
# may ask for on top of the book page is what the UNDERGRADUATE RESEARCH EXPO
# itself requires and the book milestone does not carry: applying, the published
# abstract, the peer review of the boards, the printed poster and its lock, the
# spoken pitches, the invitation, presenting, and evidencing that you presented.
#
# Everything else the course adds -- readiness checks, classroom drills, gallery
# walks, reproducibility packaging, rubric detail, analysis-craft practice --
# belongs in the milestone brief on the course platform, NOT in this PDF. Where
# such text was authored here it is preserved under `retired_additions_markdown`
# (and `retired_extra_artifacts`) rather than deleted, so any call is reversible.
#
# Under the narrowed rule `classification` and `schedule_mark` coincide: a
# milestone carries a "What this course adds" section exactly when the schedule
# marks it. Only M07, M12, M13, M14 and M15 qualify.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for both distinctions.
# scripts/build_handout_pdfs.py reads `classification` (the PDF section) and
# scripts/update_schedule_badges.py reads `schedule_mark` (the schedule plus),
# both through scripts/milestone_map.py.
#
# `schedule_mark`       does the Schedule page mark this row with the plus sign?
#                       TRUE only where the Book Milestone this milestone presents
#                       FAILS TO INCLUDE something a student genuinely needs in
#                       order to apply to, be accepted by, prepare for, present
#                       at, or evidence their presence at the Purdue Fall
#                       Undergraduate Research Expo (instructor ruling,
#                       2026-08-23, calibrated against QM 47400's conference
#                       milestone chain). Course logistics, classroom drills,
#                       reproducibility packaging, standing policy, rubric
#                       wording and analysis-craft practice are NOT marks,
#                       however much the course adds them: the instructor's own
#                       worked example is M01, whose readiness screenshot and
#                       studio pitch are real requirements but change nothing
#                       about presenting at the Expo.
#                       This is a SEPARATE decision from `classification`:
#                       turning the mark off never removes anything from the
#                       student PDF, and an UNMARKED milestone can still carry a
#                       full "What this course adds" section that is graded.
# `classification`      pure | additions ('retired' entries live under `retired:`)
#                       This governs the PDF's "What this course adds" SECTION,
#                       and nothing else. Never demote it to make the schedule
#                       quieter: the body is required instruction that exists
#                       nowhere else, and no CI gate would catch its deletion.
# `reason`              why the call was made, against the classification test
# `schedule_note`       <= 6 words for the narrow schedule column (additions only)
# `additions_markdown`  the PDF section body, headings from ### down. No em
#                       dashes, no dates: the builder enforces both.
# `extra_artifacts`     what genuinely cannot live inside lastname_mNN.pdf
# `instructor_notes`    judgment calls and loose ends for Davi, never rendered
#
# Authored 2026-08-23 by a 17-agent pass (one agent per milestone) reading each
# course brief against its book milestone page, with a six-agent adversarial
# refutation pass over the marginal calls.
#
# TO CHANGE THE SCHEDULE PLUS: edit `schedule_mark` and rerun
# scripts/update_schedule_badges.py.
# TO CHANGE WHAT THE PDF SAYS: edit `classification` / `additions_markdown` and
# rerun scripts/build_handout_pdfs.py.
#
# Audited 2026-08-23 by a 10-agent pass (eight readers, two adversarial) that
# re-read every brief against its book milestone page. M04's mark came off: its
# live declaration talk was retired by the course's own schedule source
# (scripts/schedule_data/part1.py:407) and its 3-node DAG rule is a form spec on
# a drawing the book already requires. M08 and M09 are CONTESTED and keep the
# mark, because wrongly dropping it tells a student nothing extra is owed.
schema: 1
milestones:
  M01:
    schedule_mark: false
    classification: pure
    reason: The Book Milestone page produces the curiosity artifact in full, but the course also requires
      a working-setup check with a three-checkmark readiness screenshot from the course notebook and a
      live 30-second pitch at the Friday studio that counts toward the grade. Neither appears anywhere
      on the book page or its studio page, so a student reading only the book page would hand in an incomplete,
      unpitched submission.
    schedule_note: null
    instructor_notes:
    - 'Rubric differs in kind, not only in scale: the course brief adds four hard caps the book page has
      no equivalent for (a fabricated or unretrievable source, an untraceable number, a non-reproducing
      kept code cell, and a missing AI Research Ledger row that scores Craft 0 and returns the submission
      unread). Decide whether these caps are stated on every milestone PDF, in the standard header, or
      only on the syllabus. I put only the non-reproducing-code cap in the section, because it attaches
      to a course-specific instruction (SEED = 464) that the book page does not give.'
    - The brief's 'About the Research Project' block (individual by default, at most one approved group,
      peer evaluation by two assigned project peers, group artifacts naming every member) is standing
      project-mode policy repeated on every milestone brief. It is not an M1 addition, so I left it out.
      It belongs in the standard header or on the Final Project grading page.
    - The brief currently offers 'a shared Colab notebook link' as an alternative to the PDF for both
      submission rows. The new one-file rule (lastname_m01.pdf) supersedes that, so the alternate-submission
      sentences should be removed from the brief. Note the screenshot and any kept code output then have
      to be pasted into the PDF rather than left live in a notebook.
    - The late policy (-10 per day up to 3 days) and the 7-day revision window recovering up to half the
      lost points are standing policies. I assumed the standard header or syllabus carries them; if not,
      they need a home.
    - The brief says 'the week's course notebook' without naming it. If you want the PDF to be unambiguous,
      give the file name (nb01) in the readiness step. I did not add it, since the brief does not state
      it.
    retired_additions_markdown: '### Two things to add beyond the book milestone


      1. **Prove your working setup runs.** Open this week''s course notebook in Colab and save a copy
      to your own Drive. Run the readiness cell. It finishes with three ✓ marks: you can run a code cell,
      the course data loads, and you have claimed your copy by name. Paste one screenshot showing all
      three marks into your PDF. This is your proof that no later milestone stalls on setup. A setup problem
      you hide this week becomes a lost class hour later.


      2. **Give a 30-second pitch at the Friday studio.** Say your research problem out loud, then name
      the real person for whom a different answer would be surprising. No slides. This is part of the
      grade, so time it once before class and keep it warm and short.


      ### If you keep any code


      Seed every code cell you keep with `SEED = 464`, and make sure the notebook reruns cleanly from
      top to bottom. A kept cell that does not rerun caps your verification score at the lowest band.


      ### How these pieces are judged


      Keep the whole artifact to about one or two pages, screenshot included. The screenshot and the pitch
      are both scored in the craft row: three legible ✓ marks and a pitch delivered on time earn full
      credit there.

      '
  M02:
    schedule_mark: false
    classification: pure
    reason: Every one of the course brief's ten components maps onto Book Milestone 2's own practice steps
      and "What you bring" list (working agreement, opened ledger with hinge and SDIIVDD run, red-flag
      screen, declared question with field card and stranger-test result, claim boundary, cross-read,
      dated version), so a student reading the Book Milestone page and told the filename would hand in
      exactly the right artifact. The remaining differences are the AI ledger, the "It is your turn" sections,
      the dossier line, and a 100-point rubric in place of the book's 12-point one, all of which the test
      excludes as grounds for classification.
    instructor_notes:
    - 'Borderline call, flagged for your judgment: the stranger test. The book page lists "the stranger-test
      result" in "What you bring" and Lesson 7 step 6 says only "where they stall, revise before you version."
      The course brief grades a much thicker record: the exact sentence handed over, the three questions
      asked, what the reader misunderstood quoted in their own words, and the revision made because of
      it, run on a classmate at the Friday studio, and it states the test replaces a class presentation.
      I judged this a documentation standard inside a book-owned step rather than a course addition. If
      you want that evidentiary bar enforced, it needs one line somewhere: either the standard PDF header
      or a minimal additions section.'
    - 'Rubric difference that is arguably in KIND, not scale (per instructions, noted rather than used
      to classify): the course rubric carries four hard caps the book''s 12-point rubric has no analogue
      for. A relabelled causal question caps the declared-question row at Beginning; a fabricated or unretrievable
      source, an untraceable number, or a non-reproducing kept code cell each cap the verification row
      at Beginning; and a missing AI Research Ledger entry scores Craft 0 and returns the submission unread.
      If the book page''s rubric alone governs the PDF, these caps disappear from the student-facing document.
      The missing-ledger rule is a standing course rule (CLAUDE.md), so it likely belongs in the standard
      header rather than in M2''s PDF.'
    - 'Two course-wide policies live in the brief''s boilerplate and would vanish with it: the late penalty
      (minus 10 points per day up to 3 days, then not accepted) and the revision policy (a revised submission
      within 7 days of feedback recovers up to half the lost points). Both are standing policy, not M2
      content, so they belong in the standard header on every milestone PDF, not in an M2 additions section.'
    - The brief's "About the Research Project" block states the individual-by-default project mode, the
      conditions for one instructor-approved group, and how Peer Evaluation ratings work. That is D52
      policy repeated on every brief. It should sit in the standard header or the Final Project grading
      page, not in an M2 additions section.
    - 'Two small course conventions in the brief are not on the book page: any kept code cell must be
      seeded with SEED = 464, and a shared Colab notebook was previously an acceptable alternative to
      the PDF. The seed convention is course-wide style and fits the standard header. The Colab alternative
      is superseded by the one-file rule, and the brief already allows the "It is your turn" work to be
      "included in your artifact," so nothing here needs to leave the PDF.'
    - The brief's Book Anchor names chapters 2 through 7, while the book page names them as Lessons 2
      through 7 with the same links. The numbering is consistent between the two documents, so no reconciliation
      is needed if the anchor list drops out with the brief.
    - 'Content that only exists in the brief but is teaching, not requirement: the worked examples (the
      price-measure responsibility statement, the burnout double-barrel, the "first-year athletes" silent
      scope change), the three named upgrades (silent upgrade, leakage, after-therefore-because), and
      the three Common Pitfalls. If you want any of it kept, it is elaboration of book material and could
      be folded into the chapters rather than into the PDF.'
    schedule_note: null
  M03:
    schedule_mark: false
    classification: pure
    reason: 'The Book Milestone page asks for a search log, verified sources, an evidence map and a revision,
      but the course wraps the milestone in an in-class evidence-map gallery walk on classmates'' maps
      with one received challenge worked into the artifact, and it also sets requirements the book page
      and its two lessons never state: a floor of at least six verified sources, an evidence-type field
      on every registry row, and a retrievability audit. A student working from the book page alone would
      hand in an artifact missing all of that.'
    schedule_note: null
    instructor_notes:
    - 'Rubric difference in kind, not just scale: the book page scores five 0/1/2 rows out of 10, while
      the course brief adds four hard caps (a fabricated or unretrievable source, a registry row that
      cannot be reopened, an untraceable reported count, and a missing AI Research Ledger entry that returns
      the submission) plus a 7-day revision policy recovering half the lost points. Decide which instrument
      governs the PDF; I referenced only the reopen-failure cap, because it is what makes the retrievability
      audit make sense.'
    - The brief says 'the room circulates and leaves challenges on your map' but never states how many
      challenges you must leave on other maps, or whether every map must be visited. I wrote the giving
      side without a count so as not to invent a rule.
    - The brief allows 'a shared Colab notebook link' as an alternative to the PDF, and allows the Book
      Anchor 'It is your turn' sections to be shared as notebook links. Under the one-file rule everything
      now lives inside lastname_m03.pdf (the map as an image, the links as text), so I listed no extra
      artifacts. If you still want a live notebook accepted in place of the PDF, that needs its own policy
      line in the standard header.
    - The course brief specifies five registry fields (full citation, retrieval location, central claim
      in your words, evidence type, licence and terms). Citation, retrieval, central claim and licence
      are already carried by the book page or its rails, so I added only the evidence-type field.
    - 'Not carried into the section because the book page already collects them: the candidate list with
      its status column and lead source, the search log including empty searches, the three-zone map,
      the bounded gap sentence, the revision of the declaration, the licence line, the version line, the
      dossier line, and the AI Research Ledger rows.'
    - The brief's Week 3 note (a lost Monday, one Wednesday carrying both lessons) is calendar-specific
      and was dropped; if that compression recurs every year it belongs in the schedule, not the PDF.
    retired_additions_markdown: '### The gallery walk at the Friday studio


      1. Bring your registry and your evidence map in a form the room can read at a glance. A clearly
      labeled three-zone list works as well as a picture does.

      2. Present your map briefly when the room reaches you. Say what is settled, what is contested, and
      where your gap sits.

      3. As the room circulates, read your classmates'' maps and leave challenges on them. A challenge
      is one pointed question, or one source a map seems to have missed.

      4. Pick one challenge you received. Work it into your registry, your map, or your gap sentence before
      you submit.

      5. Add a note of one or two sentences naming that challenge and saying what you changed. If it changed
      nothing, say why it did not land.


      You develop the artifact at that same studio with your AI assistant, and you submit it the same
      day.


      ### Three extra requirements for your registry


      1. Your registry needs at least six sources that you retrieved and read yourself.

      2. Give every registry row an **evidence type**: descriptive, generalization, predictive, or causal.
      Type it by the evidence the source really has, so a descriptive survey pattern is not written up
      as a causal law.

      3. Run a **retrievability audit** at the end. Take each row you marked verified and try to open
      the source again from your citation alone, the way a stranger holding only your bibliography would.
      Any row you cannot reopen returns to *pending*, whatever you remember about reading it. Record what
      the audit found.


      ### How this part is judged


      Your presentation at the walk, the challenge you incorporated, and its note all count toward the
      craft score. The audit protects you: a row you cannot reopen, still reported as verified, is scored
      as an evidence-integrity failure, so run the audit before you submit rather than after.

      '
  M04:
    schedule_mark: false
    classification: pure
    reason: The Book Milestone page asks only for the written, diagnosed Contract v0 artifact, but the
      course also requires a live three-minute contract declaration at the Friday studio that takes one
      question per listener, and a submitted three-node DAG image with a confounder arrowed into both
      treatment and outcome. Neither the milestone page nor the lessons it collects asks for a live presentation
      or for that specified DAG figure, so a student working from the book page alone would hand in an
      incomplete milestone.
    schedule_note: null
    instructor_notes:
    - 'GRADING KIND, not scale: the course rubric explicitly scores two things the book page''s 10-point
      rubric does not assess at all, the live 3-minute declaration (Craft row) and the DAG''s confounder
      structure (Contract completeness row). The added section names both so the book rubric can still
      govern, but if you want them scored you may want a line on the book milestone page itself.'
    - The old brief allowed 'a shared Colab notebook link' as an alternative to the PDF. The one-file
      rule removes that option, so the diagnosis output and the DAG figure must be pasted into the PDF.
      Worth saying once in the standard header if other milestones face the same change.
    - 'The brief requires a two-sentence claim boundary plus a three-state call (identified / association
      only / causal but not yet identified). The book milestone page names ''claim boundary'' only as
      a rail heading, and the three-state call lives inside Lesson 10''s do-not-delegate box rather than
      the milestone practice. I did not treat this as a course addition, but it is the thinnest link in
      the chain: if you want it enforced at M4, add it to the book page''s practice list.'
    - The brief's provisional-marking wording is 'provisional, settled at M6' (a course milestone number);
      the book page says measurement is settled in Studio 6. Same thing, two vocabularies. The book page's
      wording is the one the student will read.
    - Standing policies in the old brief (late penalty, the 7-day revision window, group-mode rules, the
      not-authorized blocking gate) are either already on the book page (the gate) or are course-wide
      policy, so none of them entered the additions section.
    retired_additions_markdown: '### Declare your contract out loud at the Friday studio


      That Friday studio is a contract declaration round. You present before you submit.


      1. Prepare a three-minute spoken declaration of Contract v0. Walk your listeners through the fields
      in order.

      2. Take one question from each listener. Any field is fair game, so know why you wrote every one
      of them.

      3. Write down anything a question changed in your thinking, and fix it before you submit.

      4. Submit the same day, after the studio.


      ### Draw the model as a three-node DAG


      Your contract carries a picture of the world it assumes. A DAG is a diagram where each node is a
      variable and each arrow claims that one variable could directly affect another.


      1. Draw exactly three nodes: the thing that varies (your treatment), your outcome, and one confounder.

      2. Give the confounder an arrow into both the treatment and the outcome.

      3. Be ready to name the real-world mechanism behind each arrow.

      4. Put the drawing in your PDF as a legible image. A photographed hand drawing is fine, and so is
      the studio notebook figure edited to your project.


      If your question is descriptive, you still draw it. The third node is then the trait that bends
      both what enters your data and what you measure.


      ### How these two are judged


      The declaration is judged on craft and communication: three minutes, clear, and able to answer a
      question on any field. The DAG is judged with contract completeness: three nodes, a real confounder
      arrowed into both, and arrows you can explain aloud.

      '
  M05:
    schedule_mark: false
    classification: pure
    reason: 'The Book Milestone page asks only for a declared pathway, its crossing licence, its limits,
      and a versioned Contract v1 built from one self-chosen contrast drill. The course adds three things
      the page never asks for: a live in-class route jigsaw advocating an assigned pathway plus a written
      five-sentence summary of it, a roughly one-page engagement with an instructor-assigned contrast
      (the book lets you choose any), and a required Causal Identification Skeptic reviewer run whose
      every ranked attack must be answered in writing.'
    schedule_note: null
    instructor_notes:
    - 'Direct conflict inside the single PDF: the Book Milestone page says you bring your primary pathway''s
      full piece plus ONE contrast drill ''from any other route you choose'', while the course assigns
      the contrast route. My section states the course rule explicitly, but you may want the book page''s
      sentence softened at the next chapter review so a reader does not follow the wrong instruction.'
    - 'Rubric differs in kind, not only in scale: the course brief runs 100 points across five criteria
      with three hard caps (relabeled question, fabricated or unretrievable source, missing or unanswered
      Skeptic run) plus a returned-submission rule for a missing AI Research Ledger. The book page''s
      10-point, five-row rubric has none of those caps. I kept the caps out of the rubric discussion and
      instead stated the Skeptic and relabel expectations as content rules, so nothing is lost to the
      student; decide whether the caps should be restored at the header or rubric level.'
    - The brief never says WHO assigns the jigsaw route or WHEN the assignment is announced, and it does
      not say whether the in-class advocacy itself is scored or only the written five-sentence summary.
      I wrote it neutrally ('your instructor assigns'). Worth pinning down in the schedule or the session
      guide.
    - The brief also does not say when the instructor-assigned contrast route is communicated. Since the
      assigned contrast drives graded reading (its 'It is your turn' section), it needs to reach the student
      early in the week.
    - The brief's submission table allowed a shared Colab notebook link as an ALTERNATIVE to the PDF and
      asked for companion notebook links. Under the one-file rule, the completed 'It is your turn' sections
      must be pasted into the PDF or their share links listed inside it. No extra artifact is needed,
      but the old alternative-submission wording should be dropped from any surviving copy of the brief.
    - 'Content already covered by the book page and deliberately omitted from my section: the anchor study
      (rail two), the counter-pathway AI argument (rail three), the permission recheck (rail one), route
      uncertainty sources (rail four), the claim-boundary rewrite, the dated numbered version with a reason,
      and the blocking gate on a not-authorized determination.'
    retired_additions_markdown: "### Advocate a route in the jigsaw\n\nYour instructor assigns you one\
      \ pathway to advocate to the room this week. That\nassignment is independent of the road your own\
      \ project takes. Prepare the route,\nargue it in class, and take questions on it.\n\nThen add a\
      \ **jigsaw summary** to your PDF: five sentences a non-specialist could\nrepeat. Say what the route\
      \ asks, what it requires, what claim its licence buys,\nwhat it can never establish, and one study\
      \ you would run with it.\n\n### Work the contrast your instructor assigns\n\nThe book lets you pick\
      \ any contrasting route. In this course the contrast is\nassigned to you. Complete the \"It is your\
      \ turn\" section of that assigned\nchapter as well as your own route's chapter.\n\nThen write about\
      \ one page on the assigned contrast, taken seriously on its\nmerits:\n\n1. **What would it require?**\
      \ The data, the assignment power, or the permissions\n   your project would have to obtain.\n2.\
      \ **What would it license?** The claim it could make that your route cannot.\n3. **Why is it not\
      \ yours?** The specific mismatch with your question or your\n   licence. If it partly fits, say\
      \ instead what adopting it would change in your\n   Contract, your data strategy, and your claim\
      \ boundary.\n\nA contrast dismissed in one sentence is a strawman, and a strawman defends\nnothing.\
      \ The page earns its place when a reader could finish it believing you\nwould have taken the other\
      \ road if the facts had pointed there.\n\n### Run the Causal Identification Skeptic (required)\n\
      \nBefore you submit, run the **Causal Identification Skeptic**, one of the course's\nGenAI Studio\
      \ reviewer roles, against your declaration.\n\n- On a causal route, give it your identification\
      \ leverage and let it attack.\n- On any other route, give it your **descriptive-boundary defense**:\
      \ your\n  argument for why your claims stop short of cause. Let it hunt for causal\n  language you\
      \ did not notice.\n\nAnswer every ranked attack in writing. Rule the attack out, or carry it as\
      \ a\nnamed limitation. It supplies the attack; you supply the defense. The critique\nand your answers\
      \ ride inside the PDF, and the run gets a row in your AI Research\nLedger.\n\n### If your question\
      \ is causal but your data are weak\n\nA question's kind lives in its words, not in your data. So\
      \ a causal question\nwith no leverage stays **causal, currently unidentified**. Declare the\nobservational\
      \ causal route, name the leverage you lack, and keep your language\nat \"associated with\" until\
      \ identification is earned. Quietly relabeling the\nquestion descriptive is the one move this milestone\
      \ forbids. The honest\ndeclaration passes; the silent relabel does not.\n\n### Two more things\n\
      \n- Answer the stage question in writing even when the answer is no. One sentence\n  saying your\
      \ design has no stages is enough.\n- Work on the milestone at the Friday studio with your AI assistant.\n\
      \n### How it is judged\n\nThe Skeptic run is not optional. Skipping it, or leaving its top attack\
      \ standing\nwith no reply, counts as a failure of verification however strong the rest of\nthe work\
      \ is. A relabeled question, or a cited study that turns out not to exist\nor not to use the pathway\
      \ you claim, is judged the same way.\n"
  M06:
    schedule_mark: false
    classification: pure
    reason: 'Every one of the course brief''s seven parts is already asked for by Book Milestone 6: the
      acquisition route, provenance record, data-management record, route-specific permission recheck,
