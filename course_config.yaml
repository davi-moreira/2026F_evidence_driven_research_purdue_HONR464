  - {week: 2,  notebook: "nb02", lectures: 2, topic: "From curiosity to a research problem: descriptive, predictive, causal", milestone: "M1"}
  - {week: 3,  notebook: "nb03", lectures: 1, topic: "Research builds on research: verified evidence and real gaps", milestone: "M2"}
  - {week: 4,  notebook: "nb04", lectures: 2, topic: "The anatomy of a research design: MIDA, declaration, diagnosis", milestone: "M3"}
  - {week: 5,  notebook: "nb05", lectures: 2, topic: "Observational descriptive research", milestone: "M4"}
  - {week: 6,  notebook: "nb06", lectures: 2, topic: "Observational causal research", milestone: "M5"}
  - {week: 7,  notebook: "nb07", lectures: 2, topic: "Experimental descriptive research", milestone: "M6"}
  - {week: 8,  notebook: "nb08", lectures: 1, topic: "Prediction", milestone: "M7"}
  - {week: 9,  notebook: "nb09", lectures: 2, topic: "Experimental causal research", milestone: "M8"}
  - {week: 10, notebook: "nb10", lectures: 2, topic: "Share the research and attack the analysis", milestone: "M9"}
  - {week: 11, notebook: "nb11", lectures: 2, topic: "Poster criticism and final poster lock", milestone: "M10"}
  - {week: 12, notebook: "nb12", lectures: 2, topic: "Poster delivery: pitches, uncertainty, difficult questions", milestone: "M11"}
  - {week: 13, notebook: "nb13", lectures: 1, topic: "Final conference preparation, presentation, and reflection", milestone: "M12"}
  - {week: 14, notebook: "nb14", lectures: 0, topic: "Thanksgiving async: replication and red-team", milestone: "M13"}   # async module
  - {week: 15, notebook: "nb15", lectures: 2, topic: "From poster to research note", milestone: "M14"}
  - {week: 16, notebook: "nb16", lectures: 2, topic: "Managing multiple AI agents; the final defense", milestone: "M15"}

