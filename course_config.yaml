# Source-of-truth materials (see planning/SOURCE_AUDIT_V2.md).
sources:
  primary_book:
    key: "RDSS"
    citation: "Blair, Coppock & Humphreys (2023). Research Design in the Social Sciences: Declaration, Diagnosis, and Redesign. Princeton University Press."
    local_root: "_adm/_references/book/"
    r_package: "rdss"           # CRAN v1.0.14, MIT license; wraps DeclareDesign
    license: "MIT"
    library: "https://book.declaredesign.org/library/"   # Weeks 5–9 backbone
  course_book:
    key: "EDRAI"
    title: "Evidence-Driven Research in the Age of AI: How to Design, Analyze, Verify, and Defend"
    acronym: "EDR|AI"
    status: "work in progress — under development across the semester"
    reading_model: "EDR|AI chapters are the REQUIRED reading; the matching RDSS chapters are RECOMMENDED (EDR|AI translates RDSS to the undergraduate audience)"
    translations: ["pt-BR (book-pt/ -> docs/book-pt)", "es (book-es/ -> docs/book-es)"]
    format: "Quarto book, 37 chapters in six parts, rendered to docs/book/"
    sync: "chapters synchronized with nb01–nb16 + site (validate_book_sync.py)"
  secondary_book:
    key: "CB"
    citation: "Bergstrom & West (2020). Calling Bullshit: The Art of Skepticism in a Data-Driven World."
    local: false
    use: "optional / parallel; light discussion; public callingbullshit.org where used"
  datasets:            # from rdss / RDSS replication (MIT); shipped as CSV under notebooks/data/
    - bonilla_tillery      # survey experiment → nb07
    - cliningsmith_etal    # natural experiment → nb06
    - foos_etal            # field experiment → nb09
    - la_voter_file        # sampling frame → nb05
    - lapop_brazil         # sample survey → nb05

