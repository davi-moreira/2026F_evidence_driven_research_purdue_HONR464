  M11: {title: "Poster first draft",                               due: "2026-11-04", kind: "lecture",  note: "due at class Wednesday; the in-class peer review runs the same session"}
  M12: {title: "Peer review submission",                           due: "2026-11-06", kind: "studio",   note: "independent structured reviews of every other active project; individually scored"}
  M13: {title: "Final poster lock",                                due: "2026-11-08", kind: "terminal", note: "Sunday 11:59 PM, one print-ready PDF; shared print run with QM 47400"}
  M14: {title: "Go-public package: presentation plan and invitation", due: "2026-11-15", kind: "studio", note: "three timed pitches, audience analysis, question strategy, and the invitation post"}
  M15: {title: "Conference reflection",                            due: "2026-11-29", kind: "async",    note: "Sunday; worked across the Nov 20 and Nov 23 asynchronous sessions"}
  # Week 15: the post-conference studio presents book Milestone 11. Week 16
  # teaches Studio 12 but carries NO milestone (D54): its Friday is the
  # ungraded-as-milestone final reflection, scored under participation.
  M16: {title: "Reproducible package and the peer cold run",       due: "2026-12-06", kind: "studio",   note: "also carries the research note revised after public criticism"}

# The cumulative Research Project Dossier (every milestone updates it).
dossier_components:
  - research charter
  - evidence and literature map
  - MIDA design declaration
  - data and measurement documentation
  - reproducible Colab notebook
  - declared analysis protocol
  - claim–evidence table
  - robustness and diagnostic record
  - AI Research Ledger
  - poster and presentation materials
  - replication record
  - research note / chapter
  - AI-agent management portfolio

# Grading (D52/D53, amended D58 and D61 2026-08-23). Keep these values in sync with
# syllabus.qmd's Assessments table, planning/ASSESSMENT_ARCHITECTURE.md, and
# scripts/build_brightspace_kit.py (which generates brightspace/gradebook_spec.md).
# Key ORDER below is gradebook order, so iyt_practice stays between participation
# and srl_performance.
assessment:
  attendance: 1                    # iClicker; 85% attendance target
  participation: 9                 # ONE undivided block (D57): see participation: below.
                                   # No internal split is published or applied. D58 moved
                                   # the "It is your turn" family OUT to iyt_practice:, so
                                   # this block is now 14 credits (12 studio feedback +
                                   # the profile survey + the course reflection).
  iyt_practice: 15                 # EDR|AI "It is your turn" sections; see iyt_practice: below
                                   # (D58 created it at 10; D61 raised it to 15)
  srl_performance: 25              # D58 raised it from 20 to 30; D61 lowered it to 25;
                                   # 5 flipped-lecture leads per student
  final_project: 50
# Total: 1 + 9 + 15 + 25 + 50 = 100.
# THE QUIZ CATEGORY IS RETIRED for this edition (D58), which is why `quizzes: 20`
# no longer appears above: no quiz is administered and nothing is scored on one.
# The banks in _quizzes/ (gitignored), every quiz builder, and
# scripts/audit_answer_length.py are KEPT for a future edition. Retiring the
# category is never permission to delete a quiz file or a quiz script.

# Participation (D57, 2026-08-23; item families re-partitioned by D58). ONE
# undivided 9% block: every required item below is worth the same single credit,
# and the block is their sum. There is no published internal split and none is
# applied — D57's mechanics are preserved exactly. What D58 changed is WHICH item
# families sit here: the studio feedback survey, the student profile survey and
# the course reflection, and nothing else. The EDR|AI "It is your turn"
# submissions moved out to the iyt_practice: block below. The student-facing
# contract for BOTH blocks is surveys/participation_grading.md. Both dated
# schedules are still generated by scripts/build_participation_schedules.py:
# STUDIO_FEEDBACK_SCHEDULE.md is the participation schedule, while
# IYT_SUBMISSION_SCHEDULE.md now serves iyt_practice:.
participation:
  undivided: true                  # never split the 9% into sub-weights
  credit_rule: "1.0 on time; 0.5 within seven days; 0 otherwise"
  drop_rule: "ceil(0.10 * N) lowest credits dropped automatically"   # N = 14 -> d = 2
  baseline_credits: 14             # 12 studio feedback + profile survey + course reflection
                                   # (D58: the 36 IYT credits moved to iyt_practice)
  formula: "points = 9.0 * (sum of the highest N-d credits) / (N-d)"
  contribution_adjustment: 0.9     # documented, at most +/- 0.9 course points — one tenth
                                   # of THIS 9% block. Never applied to iyt_practice.
  items:
    studio_feedback:
      label: "Studio feedback survey (Qualtrics, one link)"
      count: 12                    # one per Studio, NOT one per chapter (D57)
      due_rule: "11:59 PM on the Sunday that ends the studio week"
      graded: "completion"
      schedule: "planning/STUDIO_FEEDBACK_SCHEDULE.md"
    student_profile_survey:
      label: "Student profile survey"
      count: 1
      due: "2026-08-30"
      graded: "completion"
      instrument: "surveys/student_profile_survey.md"   # content pending
    course_reflection:
      label: "Course reflection"
      count: 1
      due: "2026-12-11"            # last class; D54 retired M17 and moved this here
      graded: "completion"
      instrument: "surveys/course_reflection.md"        # content pending
  retired:
    - "lecture-notebook completion (notebooks are never collected)"
    - "per-chapter reading feedback (replaced by 12 per-studio responses)"
    - "the proposed 5/2/2 internal split of the 9%"
    - "the 'It is your turn' submissions (moved OUT to the iyt_practice category, D58; 15% since D61; participation no longer carries them)"

# IYT Practice (D58, 2026-08-23; raised to 15% by D61). Its own top-level 15%
# category, carrying the EDR|AI "It is your turn" family that participation: used
# to hold. Same mechanics as that block: one undivided completion contract, one
# credit per item, automatic drops, and no content grade. The student-facing
# contract is surveys/participation_grading.md; the dated schedule is generated by
# scripts/build_participation_schedules.py.
iyt_practice:
  undivided: true                  # never split the 15% into sub-weights
  credit_rule: "1.0 on time; 0.5 within seven days; 0 otherwise"
  drop_rule: "ceil(0.10 * N) lowest credits dropped automatically"   # N = 35 -> d = 4
  baseline_credits: 35             # 34 everyone + 1 pathway (the DECLARED route only, D60:
                                   # the assigned contrast stays required reading but is not
                                   # collected). A design with stages also owes ch. 19
                                   # (N = 36), and ceil(0.10 * 36) is still 4, so the drop
                                   # count does not grow with it.
  formula: "points = 15.0 * (sum of the highest N-d credits) / (N-d)"
  items:
    it_is_your_turn:
      label: "EDR|AI 'It is your turn' submissions"
      count_typical: 35            # 34 everyone + 1 declared route (+1 if the design has stages)
      due_rule: "11:59 PM on the date that chapter's reading was due"
      graded: "completion"
      schedule: "planning/IYT_SUBMISSION_SCHEDULE.md"
  schedule: "planning/IYT_SUBMISSION_SCHEDULE.md"
  bonuses: "none — the two syllabus bonuses land on participation only"

# D52 supersedes D51. It adopts QM474's exact five Final Project component names
# and operative 30/20/10/20/20 shares without replacing any component; the names
# are never renamed. Project shares sum to 100; course shares sum to
# assessment.final_project (50).
# D53 (2026-08-23) moved the operational detail OUT of syllabus.qmd, which now
# prints only these five names and their project_share values, as QM474 does.
# The student-facing authority for the course_share split, the scoring_rule
# formulas, and the project-mode rules is
# _research_project/2026Fall/final_project_grading_and_project_modes.md, with the
# gradebook wiring in the generated brightspace/gradebook_spec.md. The keys below
# are the machine record of what the syllabus no longer states.
final_project_breakdown:
  milestone_deliverables:
    label: "Milestone Deliverables"
    project_share: 30
    course_share: 15
    includes: "M1-M16 incremental project submissions, each scored on its 100-point milestone rubric"
    scoring_rule: "equally weighted mean of the M1-M16 milestone scores"
  peer_evaluation:
    label: "Peer Evaluation"
    project_share: 20
    course_share: 10
    includes: "confidential ratings from every teammate for group projects or two assigned project peers for individual projects; no self-rating"
    scoring_rule: "80% received-rating score plus 20% required-evaluation submission; see project/final_dossier/peer_evaluation_instrument.md"
  peer_review:
    label: "Peer Review"
    project_share: 10
    course_share: 5
    includes: "structured reviews of classmates' posters and documented use of criticism"
    scoring_rule: "M12 Final Project Peer Review rubric (100 points)"
  poster_presentation_at_the_conference:
    label: "Poster Presentation at the Purdue Undergraduate Research Conference"
    project_share: 20
    course_share: 10
    includes: "the locked poster and each student's required public presentation at the Expo"
    scoring_rule: "70% M13 poster-quality rubric + 30% M15 live Expo presentation rubric"
  instructor_ta_evaluation:
    label: "Instructor/TA Evaluation"
    project_share: 20
    course_share: 10
    includes: "the instructor's evaluation of the final poster submission locked at M13"
    scoring_rule: "100% instructor evaluation of the M13 final poster submission (D54)"

# Source-of-truth materials (see planning/SOURCE_AUDIT_V2.md).
sources:
  primary_book:
    key: "RDSS"
    citation: "Blair, Coppock & Humphreys (2023). Research Design in the Social Sciences: Declaration, Diagnosis, and Redesign. Princeton University Press."
    local_root: "_adm/_references/book/"
    r_package: "rdss"           # CRAN v1.0.14, MIT license; wraps DeclareDesign
    license: "MIT"
    library: "https://book.declaredesign.org/library/"   # W5 route-hub backbone (D41)
  course_book:
    key: "EDRAI"
    title: "Evidence-Driven Research in the Age of AI: How to Design, Analyze, Verify, and Defend"
    acronym: "EDR|AI"
    status: "work in progress — under development across the semester"
    reading_model: "EDR|AI chapters are the REQUIRED reading; the matching RDSS chapters are RECOMMENDED (EDR|AI translates RDSS to the undergraduate audience). Route lessons (D41): your own route plus one assigned contrast; hybrid/complex only when the design has stages"
    translations: ["pt-BR (book-pt/ -> docs/book-pt)", "es (book-es/ -> docs/book-es)"]
    format: "Quarto book, 40 lessons in 12 Studios, each closed by a generated Book Milestone chapter (D38/D40), rendered to docs/book/"
    sync: "chapters synchronized with nb01–nb16 + site (validate_book_sync.py)"
  datasets:            # from rdss / RDSS replication (MIT); shipped as CSV under notebooks/data/
    - bonilla_tillery      # survey experiment → nb07
    - cliningsmith_etal    # natural experiment → nb06
    - foos_etal            # field experiment → nb09
    - la_voter_file        # sampling frame → nb05
    - lapop_brazil         # sample survey → nb05

